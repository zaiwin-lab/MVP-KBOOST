<style>
/* ==========================================================================
   SALES PORTAL — web-based, three access panels.
   Public / Management / Salesman. 16 modules, 3 transaction models.
   ========================================================================== */
:root{
  --blue:#3B5BFF; --blue-d:#2743D8; --blue-lo:#EDF1FF; --blue-lo2:#DCE4FF;
  --vio:#8B5CF6; --vio-lo:#F3EEFE;
  --cyan:#22D3EE; --cyan-lo:#E4FAFE;
  --grn:#0E9F6E; --grn-lo:#E3F7EF;
  --amb:#D97706; --amb-lo:#FDF1E1;
  --red:#DC2626; --red-lo:#FDECEC; --red-ln:#F7CFCF;
  --ink:#0B1224; --ink2:#141D36; --mut:#57678A; --dim:#93A0BC;
  --page:#F5F7FC; --card:#FFFFFF; --s2:#FAFBFE; --s3:#EFF3FA;
  --line:#E4EAF4; --line2:#CDD8EA;
  --paper:#FEFDFB; --pink:#1A1712;
  --ui:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px; --r-s:10px; --r-l:20px; --pill:100px;
  --sh:0 1px 2px rgba(11,18,36,.05),0 6px 18px rgba(11,18,36,.06);
  --sh2:0 10px 34px rgba(11,18,36,.13);
  --sh3:0 24px 60px rgba(11,18,36,.18);
  --ai:linear-gradient(115deg,#8B5CF6,#3B5BFF 45%,#22D3EE);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--page);color:var(--ink);font-family:var(--ui);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body[data-lang="cn"]{font-family:"Noto Sans SC",var(--ui)}
h1,h2,h3,h4{line-height:1.18;letter-spacing:-.025em;font-weight:800;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
img,svg{max-width:100%}

/* ---------- AI SHINE PRIMITIVES -------------------------------------------
   Used anywhere the portal is doing machine work, so the AI layer is
   visible at a glance rather than claimed in a paragraph. */
@keyframes sweep{0%{background-position:200% 50%}100%{background-position:-200% 50%}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(3%,-4%) scale(1.08)}66%{transform:translate(-3%,3%) scale(.95)}}
@keyframes ring{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.9);opacity:0}}

/* animated gradient border — the signature "AI is live" treatment */
/* An open consignment is waiting on a balance count, so the card is marked —
   but with a still edge. It used to carry a rotating gradient border, which
   reads as something in progress when nothing is happening, and sits there
   spinning for as long as the delivery stays open. */
.card.cg-open{border-left:3px solid var(--vio)}

/* shimmering text */
.shine{background:linear-gradient(100deg,var(--ink) 20%,#3B5BFF 38%,#22D3EE 48%,#8B5CF6 58%,var(--ink) 76%);
  background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 5s linear infinite}
.shine-w{background:linear-gradient(100deg,#fff 20%,#A9BEFF 38%,#7BE9FB 48%,#C6AEFF 58%,#fff 76%);
  background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 5.5s linear infinite}

.ai-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 13px 5px 9px;border-radius:var(--pill);
  background:var(--ai);color:#fff;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  box-shadow:0 4px 16px rgba(91,92,246,.35)}
.ai-pill.gh{background:rgba(139,92,246,.1);color:var(--vio);box-shadow:none}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;animation:ring 1.8s ease-out infinite}
.ai-pill .dot{background:#fff;color:#fff}

/* ---------- CHROME: TOP BAR ---------- */
.top{position:sticky;top:0;z-index:80;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 22px;height:62px}
.top.dark{background:rgba(11,18,36,.72);border-bottom-color:rgba(255,255,255,.1);color:#fff}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15.5px;letter-spacing:-.02em;flex:none}
.brand .mk{width:32px;height:32px;border-radius:9px;background:var(--ai);display:grid;place-items:center;
  color:#fff;font-size:13px;font-weight:800;box-shadow:0 3px 12px rgba(91,92,246,.4);flex:none}
.brand small{display:block;font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;line-height:1.2}
.top.dark .brand small{color:rgba(255,255,255,.55)}
.tnav{display:flex;gap:3px;margin-left:12px;overflow-x:auto;scrollbar-width:none}
.tnav::-webkit-scrollbar{display:none}
.tnav a{padding:7px 13px;border-radius:var(--pill);font-size:13px;font-weight:700;color:var(--mut);white-space:nowrap;transition:.15s}
.tnav a:hover{background:var(--s3);color:var(--ink)}
.tnav a.on{background:var(--ink);color:#fff}
.top.dark .tnav a{color:rgba(255,255,255,.7)}
.top.dark .tnav a:hover{background:rgba(255,255,255,.12);color:#fff}
.top.dark .tnav a.on{background:#fff;color:var(--ink)}
.tright{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.who{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border-radius:var(--pill);background:var(--s3)}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:11.5px;flex:none}
.who b{font-size:12.5px;display:block;line-height:1.25}
.who span{font-size:10.5px;color:var(--mut);display:block;line-height:1.2}
.top.dark .who{background:rgba(255,255,255,.12)}
.top.dark .who span{color:rgba(255,255,255,.6)}
.exit{padding:7px 13px;border-radius:var(--pill);background:var(--s3);font-size:12.5px;font-weight:700;
  color:var(--mut);border:1px solid transparent;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.exit:hover{background:var(--line);color:var(--ink)}
.exit:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top.dark .exit{background:rgba(255,255,255,.12);color:#fff}
/* Signing out ends the session, so it carries its own weight rather than
   sitting in the bar as one more grey pill. */
.exit.out{background:var(--red-lo);color:var(--red);border-color:var(--red-ln)}
.exit.out:hover{background:var(--red);color:#fff;border-color:var(--red)}
.exit.out svg{width:14px;height:14px;flex:none}

/* ---------- 4-PANE LANGUAGE SWITCH ---------- */
.lang{display:flex;background:var(--s3);border-radius:var(--pill);padding:3px;gap:2px;flex:none}
.lang button{padding:5px 11px;border-radius:var(--pill);font-size:11.5px;font-weight:800;color:var(--mut);transition:.15s;white-space:nowrap}
.lang button:hover{color:var(--ink)}
.lang button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.top.dark .lang{background:rgba(255,255,255,.12)}
.top.dark .lang button{color:rgba(255,255,255,.7)}
.top.dark .lang button.on{background:#fff;color:var(--ink)}

/* ---------- LAYOUT ---------- */
.shell{display:flex;min-height:calc(100vh - 62px);align-items:flex-start}
.rail{width:236px;flex:none;padding:18px 12px 40px;border-right:1px solid var(--line);background:#fff;
  position:sticky;top:62px;height:calc(100vh - 62px);overflow-y:auto;scrollbar-width:thin;
  display:flex;flex-direction:column}
.rail a,.rail .gp{flex:none}
.rail::-webkit-scrollbar{width:4px}.rail::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
.rail .gp{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:800;margin:16px 12px 7px}
.rail a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-s);font-size:13.5px;font-weight:700;color:var(--mut);transition:.14s}
.rail a:hover{background:var(--s3);color:var(--ink)}
.rail a.on{background:var(--blue-lo);color:var(--blue-d)}
.rail a svg{width:17px;height:17px;flex:none}
.rail a .bg{margin-left:auto;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:var(--pill);background:var(--red);color:#fff}
.rail a .bg.n{background:var(--s3);color:var(--mut)}
.rail a.on .bg.n{background:#fff;color:var(--blue-d)}
.main{flex:1;min-width:0;padding:26px 30px 90px;max-width:1320px}
.mainw{flex:1;min-width:0;padding:0 0 90px}
.pgh{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.pgh h1{font-size:26px}
.pgh p{font-size:13.5px;color:var(--mut);margin-top:3px}
.pgh .ra{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;min-width:0;max-width:100%}

/* ---------- CARDS / GRID ---------- */
.g{display:grid;gap:14px}
/* Grid items default to min-width:auto, so a card holding a wide row refuses
   to shrink and pushes the page sideways on a phone. */
.g>*{min-width:0}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.g23{grid-template-columns:1.55fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card.p{padding:18px}
.card h3{font-size:15.5px;margin-bottom:3px}
.card .sub{font-size:12.5px;color:var(--mut)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi .l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:800}
.kpi .v{font-size:25px;font-weight:800;margin-top:6px;letter-spacing:-.035em}
.kpi .d{font-size:11.5px;color:var(--mut);margin-top:3px}
.kpi .sp{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.kpi .sp svg{width:17px;height:17px}
.sec{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:800;margin:26px 0 11px;display:flex;align-items:center;gap:9px}
.sec .mo{margin-left:auto;color:var(--blue);font-size:12px;text-transform:none;letter-spacing:0;font-weight:700}

/* ---------- TABLE ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:620px}
thead th{text-align:left;padding:11px 14px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dim);font-weight:800;background:var(--s2);border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:.12s}
tbody tr:hover{background:var(--s2)}
td.r,th.r{text-align:right}
td b{font-weight:700}
.tw table .lk{color:var(--blue);font-weight:700}
.tw table .lk:hover{text-decoration:underline}

/* ---------- BITS ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--pill);font-size:11px;font-weight:800;white-space:nowrap}
.k-blue{background:var(--blue-lo);color:var(--blue-d)}
.k-vio{background:var(--vio-lo);color:var(--vio)}
.k-grn{background:var(--grn-lo);color:var(--grn)}
.k-amb{background:var(--amb-lo);color:var(--amb)}
.k-red{background:var(--red-lo);color:var(--red)}
.k-mut{background:var(--s3);color:var(--mut)}
.k-cy{background:var(--cyan-lo);color:#0E7490}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 17px;border-radius:var(--r-s);
  font-weight:700;font-size:13.5px;background:#fff;border:1px solid var(--line2);color:var(--ink);transition:.15s}
.btn:hover{background:var(--s2);border-color:var(--dim)}
.btn-p{background:var(--blue);color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(59,91,255,.3)}
.btn-p:hover{background:var(--blue-d);border-color:transparent}
/* Destructive: revoking access locks a person out, so the control says so. */
.btn-r{background:var(--red);color:#fff;border-color:var(--red)}
.btn-r:hover{filter:brightness(.92)}
.btn-g{background:var(--grn);color:#fff;border-color:transparent}
.btn-g:hover{background:#0B8459;border-color:transparent}
.btn-ai{background:var(--ai);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(91,92,246,.36)}
.btn-ai:hover{filter:brightness(1.08)}
.btn-w{width:100%;padding:13px;font-size:14.5px;border-radius:var(--r)}
.btn-s{padding:7px 12px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn svg{width:16px;height:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;min-width:0;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:6px 14px;border-radius:var(--pill);font-size:12.5px;font-weight:700;background:#fff;
  border:1px solid var(--line);color:var(--mut);white-space:nowrap;flex:none;transition:.14s}
.tabs button:hover{border-color:var(--line2);color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.f{margin-bottom:14px}
.f label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);font-weight:800;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;padding:11px 13px;background:#fff;border:1px solid var(--line2);border-radius:var(--r-s);font-size:14px;font-weight:600}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-lo)}
.f .hint{font-size:11.5px;color:var(--dim);margin-top:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.search{position:relative;flex:1;min-width:200px}
.search input{width:100%;padding:10px 14px 10px 38px;background:#fff;border:1px solid var(--line2);border-radius:var(--pill);font-size:13.5px;font-weight:600}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--dim)}
.note{background:var(--blue-lo);border-left:3px solid var(--blue);border-radius:0 var(--r-s) var(--r-s) 0;padding:12px 14px;font-size:13px;color:#1A3A8F;line-height:1.6}
.warn{background:var(--amb-lo);border-left:3px solid var(--amb);border-radius:0 var(--r-s) var(--r-s) 0;padding:12px 14px;font-size:13px;color:#7A4A08;line-height:1.6}
.okbox{background:var(--grn-lo);border:1px solid #A7E3CB;border-radius:var(--r);padding:14px;font-size:13.5px;color:#0A6E4C;display:flex;gap:11px;align-items:center}
.empty{text-align:center;padding:46px 20px;color:var(--dim)}
.empty b{display:block;font-size:15.5px;color:var(--mut);margin-bottom:5px}
.prog{height:7px;background:var(--s3);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.prog i.ai{background:var(--ai)}
.bars{display:flex;align-items:flex-end;gap:5px;height:104px;margin-top:14px}
.chartcard{display:flex;flex-direction:column}
.chartcard .bars{flex:1;height:auto;min-height:120px}
.bars i{flex:1;background:var(--blue-lo2);border-radius:3px 3px 0 0;transition:height .9s cubic-bezier(.2,.8,.2,1);min-height:3px}
.bars i.hi{background:var(--blue)}
.lgd{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);font-weight:700;margin-top:6px}

/* ---------- AI PANEL ---------- */
.aip{background:linear-gradient(150deg,#0B1224,#1B2450 55%,#241C4E);color:#fff;border-radius:var(--r);padding:19px;position:relative;overflow:hidden}
.aip::after{content:"";position:absolute;width:280px;height:280px;right:-90px;top:-120px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.5),transparent 68%);filter:blur(20px);animation:drift 12s ease-in-out infinite}
.aip>*{position:relative;z-index:1}
.aip h3{font-size:15.5px;margin:11px 0 4px}
.aip p{font-size:13px;color:rgba(255,255,255,.74);line-height:1.6}
.aip .rd{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:13px;align-items:flex-start}
.aip .rd:last-child{border-bottom:none}
.aip .rd i{font-style:normal;flex:none;width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.13);display:grid;place-items:center;font-size:11px}
.aip .rd b{color:#fff}
.aip .rd span{color:rgba(255,255,255,.7)}

/* ---------- MODAL ---------- */
.mask{position:fixed;inset:0;background:rgba(11,18,36,.55);backdrop-filter:blur(5px);z-index:300;display:grid;place-items:center;padding:20px;animation:rise .2s}
.sheet{background:#fff;border-radius:var(--r-l);padding:24px;width:100%;max-width:470px;max-height:88vh;overflow-y:auto;box-shadow:var(--sh3)}
.sheet h3{font-size:18.5px;margin-bottom:5px}
@media(max-width:600px){.mask{place-items:end center;padding:0}.sheet{border-radius:20px 20px 0 0;max-width:none}}

/* ---------- THERMAL DOC ---------- */
.thm{background:var(--paper);color:var(--pink);font-family:var(--mono);font-size:11px;line-height:1.62;padding:18px 15px;
  border-radius:6px;box-shadow:var(--sh2);border:1px solid #E8E2D6;margin:0 auto;max-width:302px}
.thm.w58{max-width:220px;font-size:10px}
.thm .hd{text-align:center;padding-bottom:10px;border-bottom:1px dashed #B9B0A0}
.thm .hd b{font-size:14px;display:block;font-family:var(--ui);font-weight:800}
.thm .hd span{font-size:9.5px;color:#6B6455}
.thm .r{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.thm .r span{color:#6B6455}
.thm .sc{padding:10px 0;border-bottom:1px dashed #B9B0A0}
.thm .gt{display:flex;justify-content:space-between;padding:10px 0 0;font-weight:700;font-size:13px;border-top:1px solid #8C8474;margin-top:9px}
.thm .st{margin-top:13px;text-align:center;font-weight:700;letter-spacing:.14em;padding:7px;border:2px solid var(--grn);color:#0A6E4C;border-radius:5px}
.thm .ft{text-align:center;font-size:9px;color:#6B6455;margin-top:12px;line-height:1.5}
.dact{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:15px}
.dact button{padding:11px 6px;border-radius:var(--r-s);font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff}
.dact button:hover{border-color:var(--blue);color:var(--blue)}
.dact svg{width:17px;height:17px}
.wsel{display:flex;gap:6px;justify-content:center;margin-bottom:13px}
.wsel button{padding:5px 13px;border-radius:var(--pill);font-size:11.5px;font-weight:800;border:1px solid var(--line2);background:#fff;color:var(--mut)}
.wsel button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li .n{flex:1;min-width:0}
.li .n b{display:block;font-size:13.5px;font-weight:700}
.li .n span{font-size:11px;color:var(--dim);font-family:var(--mono)}
.stp{display:flex;align-items:center;background:var(--s3);border-radius:var(--r-s);flex:none}
.stp button{width:31px;height:31px;font-size:17px;font-weight:700;color:var(--mut);display:grid;place-items:center}
.stp .q{width:32px;text-align:center;font-weight:800;font-size:13.5px}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:15px 0;border-top:2px solid var(--line2);margin-top:9px}
.tot b{font-size:26px;font-weight:800}

/* ==========================================================================
   PUBLIC / UNIVERSAL PANEL
   ========================================================================== */
.pub{background:var(--page)}
.hero{position:relative;background:linear-gradient(155deg,#080E1E 0%,#131C3E 42%,#1E1A46 78%,#0C1327 100%);
  color:#fff;overflow:hidden;padding:74px 30px 96px}
.hero .aur{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
.hero .a1{width:560px;height:560px;background:radial-gradient(circle,rgba(59,91,255,.5),transparent 66%);top:-190px;left:-120px;animation:drift 16s ease-in-out infinite}
.hero .a2{width:500px;height:500px;background:radial-gradient(circle,rgba(139,92,246,.44),transparent 66%);top:-70px;right:-130px;animation:drift 19s ease-in-out infinite reverse}
.hero .a3{width:420px;height:420px;background:radial-gradient(circle,rgba(34,211,238,.3),transparent 66%);bottom:-220px;left:34%;animation:drift 22s ease-in-out infinite}
.hero .grid{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000,transparent);
  mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000,transparent)}
.hero .in{position:relative;z-index:2;max-width:1120px;margin:0 auto}
.hero h1{font-size:clamp(34px,5.2vw,58px);letter-spacing:-.04em;margin:20px 0 16px;max-width:17ch}
.hero .ld{font-size:clamp(15px,1.7vw,18.5px);color:rgba(255,255,255,.76);max-width:60ch;line-height:1.68}
.hero .cta{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.hero .btn{padding:13px 22px;font-size:14.5px}
.hero .btn.gh{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.22);backdrop-filter:blur(8px)}
.hero .btn.gh:hover{background:rgba(255,255,255,.18)}
.hero .tick{display:flex;gap:26px;margin-top:44px;flex-wrap:wrap;padding-top:26px;border-top:1px solid rgba(255,255,255,.12)}
.hero .tick div .v{font-size:26px;font-weight:800;letter-spacing:-.035em}
.hero .tick div .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.55);font-weight:800;margin-top:2px}

.wrapx{max-width:1120px;margin:0 auto;padding:0 30px}
.band{padding:74px 0}
.band.alt{background:#fff;border-block:1px solid var(--line)}
.bh{text-align:center;max-width:64ch;margin:0 auto 42px}
.bh .ai-pill,.bh .kk{margin-bottom:14px}
.kk{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--blue);
  background:var(--blue-lo);padding:5px 13px;border-radius:var(--pill)}
.bh h2{font-size:clamp(26px,3.4vw,38px);letter-spacing:-.035em}
.bh p{font-size:15.5px;color:var(--mut);margin-top:13px;line-height:1.7}

/* the three access doors */
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.door{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);padding:26px;display:flex;flex-direction:column;
  box-shadow:var(--sh);transition:.22s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.door:hover{transform:translateY(-5px);box-shadow:var(--sh3);border-color:var(--line2)}
.door .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:16px}
.door .ic svg{width:23px;height:23px}
.door h3{font-size:19px;margin-bottom:7px}
.door p{font-size:13.5px;color:var(--mut);line-height:1.65;flex:1}
.door ul{list-style:none;margin:15px 0 19px;display:flex;flex-direction:column;gap:7px}
.door li{font-size:12.5px;color:var(--mut);display:flex;gap:8px;align-items:flex-start}
.door li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--line2);margin-top:7px;flex:none}
.door .btn{width:100%}
.door.feat{background:linear-gradient(160deg,#0B1224,#1A2246);color:#fff;border-color:transparent}
.door.feat p,.door.feat li{color:rgba(255,255,255,.72)}
.door.feat li::before{background:rgba(255,255,255,.35)}
.door.feat .ic{background:rgba(255,255,255,.14)}

/* capability grid */
.caps{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.cap{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:17px;transition:.18s}
.cap:hover{border-color:var(--blue);transform:translateY(-3px);box-shadow:var(--sh2)}
.cap .n{font-family:var(--mono);font-size:10.5px;color:var(--dim);font-weight:700}
.cap b{display:block;font-size:14px;margin:7px 0 5px}
.cap span{font-size:12px;color:var(--mut);line-height:1.55;display:block}

/* three models */
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mod{border-radius:var(--r-l);padding:24px;border:1px solid var(--line);background:#fff;box-shadow:var(--sh)}
.mod .tag{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.mod h3{font-size:20px;margin:9px 0 9px}
.mod p{font-size:13.5px;color:var(--mut);line-height:1.65}
.flow{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.flow div{font-size:12px;font-weight:700;padding:8px 12px;border-radius:8px;background:var(--s3);color:var(--mut);
  display:flex;align-items:center;gap:8px;font-family:var(--mono)}
.flow div.hi{background:var(--blue-lo);color:var(--blue-d)}
.flow div.gd{background:var(--grn-lo);color:var(--grn)}

/* AI showcase */
.aish{background:linear-gradient(150deg,#080E1E,#141C40 55%,#221B4A);border-radius:var(--r-l);padding:44px;color:#fff;position:relative;overflow:hidden}
.aish .aur{position:absolute;border-radius:50%;filter:blur(66px);pointer-events:none}
.aish .b1{width:420px;height:420px;background:radial-gradient(circle,rgba(139,92,246,.42),transparent 68%);top:-150px;right:-90px;animation:drift 15s ease-in-out infinite}
.aish .b2{width:340px;height:340px;background:radial-gradient(circle,rgba(34,211,238,.3),transparent 68%);bottom:-160px;left:-70px;animation:drift 18s ease-in-out infinite reverse}
.aish>*{position:relative;z-index:1}
.aish h2{font-size:clamp(24px,3vw,33px);margin:15px 0 13px}
.aish>p{font-size:15px;color:rgba(255,255,255,.74);max-width:62ch;line-height:1.7}
.aigrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:32px}
.aic{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--r);padding:19px;backdrop-filter:blur(8px)}
.aic .h{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.aic .h .o{width:28px;height:28px;border-radius:9px;background:var(--ai);display:grid;place-items:center;font-size:13px;flex:none}
.aic b{font-size:14px;display:block}
.aic p{font-size:12.5px;color:rgba(255,255,255,.68);line-height:1.6}
.aic .out{margin-top:12px;padding:11px;border-radius:9px;background:rgba(0,0,0,.28);font-size:12px;line-height:1.55;
  border-left:2px solid var(--cyan);color:rgba(255,255,255,.9)}

/* ---------- SIGN IN ---------- */
.lgwrap{min-height:100vh;display:grid;place-items:center;padding:26px 18px;
  background:linear-gradient(155deg,#080E1E 0%,#131C3E 45%,#1E1A46 78%,#0C1327 100%)}
.lgcard{width:100%;max-width:398px;background:var(--card);border-radius:var(--r-l);
  padding:30px 28px;box-shadow:0 30px 80px -30px rgba(0,0,0,.7)}
.lgcard .brand{color:var(--ink);margin-bottom:22px}
.lgcard .brand small{color:var(--mut)}
.lgcard h1{font-size:23px;letter-spacing:-.02em;margin:0 0 6px}
.lgcard .sub{font-size:13px;color:var(--mut);line-height:1.55;margin-bottom:19px}
.lgcard .f{margin-bottom:13px}
.lgcard .btn-w{margin-top:5px}
.lg-err{background:var(--red-lo);color:var(--red);border:1px solid var(--red);
  border-radius:var(--r-s);padding:9px 12px;font-size:12.5px;font-weight:600;margin-bottom:15px}
.lg-demo{margin-top:21px;padding-top:17px;border-top:1px solid var(--line);text-align:center}
.lg-demo b{display:block;font-size:13px;margin-bottom:3px}
.lg-demo span{display:block;font-size:12px;color:var(--mut);line-height:1.5;margin-bottom:11px}
.spin{width:26px;height:26px;border-radius:50%;margin:0 auto;
  border:2.5px solid var(--line2);border-top-color:var(--blue);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* A banner the live panels carry until transaction history is migrated, so an
   empty ledger reads as "not yet" rather than "broken". */
.livebar{display:flex;gap:10px;align-items:flex-start;background:var(--amb-lo);
  border:1px solid var(--amb);border-radius:var(--r-s);padding:10px 13px;margin-bottom:16px;
  font-size:12.5px;line-height:1.5;color:var(--ink)}
.livebar b{display:block;color:var(--amb-d,#8A5204)}
.livebar.demo{background:var(--vio-lo);border-color:var(--vio);align-items:center}
.livebar.demo b{color:var(--vio)}

/* ---------- WHO IS USING THE PORTAL ----------
   A demo affordance, styled to read as a account chip rather than a control
   panel, with an explicit note that it is not security. */
.whosw{position:relative}
.whobtn{display:flex;align-items:center;gap:9px;padding:5px 9px 5px 6px;border-radius:var(--pill);
  border:1px solid transparent;background:transparent;cursor:pointer;font:inherit;color:inherit;
  transition:background .16s,border-color .16s}
.whobtn:hover,.whobtn.on{background:var(--blue-lo);border-color:var(--line2)}
/* Signed in there is no menu behind the chip, so it must not invite a click. */
.whobtn.flat{cursor:default}
.whobtn.flat:hover{background:transparent;border-color:transparent}

/* Who you are and the way out, at the foot of the rail. */
.railout{margin-top:auto;padding:14px 12px calc(16px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);display:grid;gap:10px}
.railout .rw{display:flex;align-items:center;gap:9px;min-width:0}
.railout .av{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:11.5px;flex:none}
.railout .rw b{display:block;font-size:12.5px;line-height:1.25;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.railout .rw span span{display:block;font-size:10.5px;color:var(--mut);line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.railout .rw > span{min-width:0}
.railout .exit{justify-content:center;width:100%}
.top.dark .whobtn:hover,.top.dark .whobtn.on{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.whobtn .cv{font-size:10px;opacity:.5;flex:none}
.whobtn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.umenu{position:absolute;right:0;top:calc(100% + 8px);z-index:400;min-width:266px;
  background:var(--card);border:1px solid var(--line2);border-radius:var(--r);
  box-shadow:var(--sh3);overflow:hidden;animation:rise .16s ease-out}
.umenu .uh{padding:10px 13px 7px;font-size:10.5px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim)}
.umenu .usep{padding:8px 13px 5px;font-size:10.5px;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);border-top:1px solid var(--line)}
.umenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 13px;border:0;background:transparent;cursor:pointer;font:inherit;color:var(--ink)}
.umenu button:hover{background:var(--blue-lo)}
.umenu button.on{background:var(--blue-lo2)}
.umenu button b{display:block;font-size:13.5px;font-weight:700;line-height:1.25}
.umenu button span span{display:block;font-size:11px;color:var(--mut);margin-top:1px}
.umenu button .tk{margin-left:auto;color:var(--blue);font-weight:800;flex:none}
.umenu .unote{padding:9px 13px;font-size:10.5px;line-height:1.45;color:var(--dim);
  background:var(--amb-lo);border-top:1px solid var(--line)}
@media(max-width:860px){
  .umenu{right:-6px;min-width:240px}
}

/* ---------- CORNER BUBBLES: AI HELP 24/7 (left) · WHATSAPP (right) ------- */
.bub{position:fixed;bottom:22px;z-index:200;display:flex;align-items:center;gap:10px;padding:11px 17px 11px 12px;
  border-radius:var(--pill);font-size:13px;font-weight:800;box-shadow:var(--sh3);text-decoration:none;
  transition:.2s cubic-bezier(.2,.8,.2,1)}
.bub:hover{transform:translateY(-3px) scale(1.03)}
.bub .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;flex:none;position:relative}
.bub .st{display:block;font-size:10px;font-weight:700;opacity:.72;letter-spacing:.03em;line-height:1.25}
.bub .tx{line-height:1.2}
/* Scoped to .bub deliberately: bare .bl and .br are short enough to collide
   with a layout class elsewhere, and the footer's first column did exactly
   that — it was being painted with the AI gradient. */
.bub.bl{left:22px;background:var(--ai);color:#fff}
.bub.bl .av{background:rgba(255,255,255,.2)}
.bub.bl .av::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(255,255,255,.5);animation:ring 2.2s ease-out infinite}
/* WhatsApp keeps its own brand green — a visitor should recognise where the
   button leads before reading the label. */
.bub.br{right:22px;background:linear-gradient(180deg,#2BD46E,#17A34A);color:#fff;
  box-shadow:0 12px 28px -10px rgba(23,163,74,.62),var(--sh3)}
.bub.br .av{background:rgba(255,255,255,.22);color:#fff}
.bub.br .st{opacity:.8}
.bub.br .lv{width:7px;height:7px;border-radius:50%;background:#BBF7D0;position:absolute;right:-1px;bottom:-1px;border:2px solid #17A34A}
@media(max-width:720px){
  .bub{padding:11px;bottom:16px}
  .bub .tx{display:none}
  .bub.bl{left:16px}.bub.br{right:16px}
}

/* AI chat drawer */
.chat{position:fixed;bottom:0;left:0;right:0;top:0;z-index:310;background:rgba(11,18,36,.55);backdrop-filter:blur(5px);display:grid;place-items:end start;padding:20px}
.chat .box{width:100%;max-width:400px;height:min(600px,86vh);background:#fff;border-radius:var(--r-l);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh3);animation:rise .24s cubic-bezier(.2,.8,.2,1)}
.chat .ch{background:linear-gradient(140deg,#0B1224,#221B4A);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:11px;flex:none}
.chat .ch .o{width:34px;height:34px;border-radius:11px;background:var(--ai);display:grid;place-items:center;font-size:15px;flex:none}
.chat .ch b{font-size:14.5px;display:block}
.chat .ch span{font-size:11px;color:rgba(255,255,255,.66);display:flex;align-items:center;gap:5px}
.chat .ch .x{margin-left:auto;width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:16px;color:#fff;flex:none}
.chat .bd{flex:1;overflow-y:auto;padding:18px;background:var(--s2);display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:11px 14px;border-radius:14px;font-size:13px;line-height:1.6}
.msg.a{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;box-shadow:var(--sh)}
.msg.u{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg b{font-weight:800}
.chat .qk{display:flex;gap:7px;flex-wrap:wrap;padding:0 18px 12px;background:var(--s2)}
.chat .qk button{padding:7px 12px;border-radius:var(--pill);background:#fff;border:1px solid var(--line2);font-size:12px;font-weight:700;color:var(--mut)}
.chat .qk button:hover{border-color:var(--blue);color:var(--blue)}
.chat .fo{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;flex:none;background:#fff}
.chat .fo input{flex:1;padding:10px 14px;border:1px solid var(--line2);border-radius:var(--pill);font-size:13.5px}
.chat .fo button{width:40px;height:40px;border-radius:50%;background:var(--ai);color:#fff;display:grid;place-items:center;flex:none}
@media(max-width:600px){.chat{padding:0;place-items:end center}.chat .box{max-width:none;border-radius:20px 20px 0 0;height:88vh}}

/* ---------- SIGNATURE FOOTER ---------- */
/* The deep bottom padding keeps the signature row clear of the two fixed
   corner bubbles, which otherwise sit right on top of it at the end of a
   scroll and cover the maker's credit. */
.sig{background:linear-gradient(155deg,#080E1E,#131C3E 60%,#0C1327);color:#fff;padding:52px 30px 96px;position:relative;overflow:hidden}
.sig .aur{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(80px);pointer-events:none;
  background:radial-gradient(circle,rgba(59,91,255,.28),transparent 68%);bottom:-300px;left:50%;transform:translateX(-50%)}
.sig .in{position:relative;z-index:1;max-width:1120px;margin:0 auto}
.sig .cols{display:grid;grid-template-columns:1.9fr 1fr 1fr;gap:34px;padding-bottom:32px;border-bottom:1px solid rgba(255,255,255,.11)}
.sig h4{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.48);margin-bottom:13px;font-weight:800}
.sig a.l{display:block;font-size:13px;color:rgba(255,255,255,.74);padding:4px 0;transition:.15s}
.sig a.l:hover{color:#fff;transform:translateX(3px)}
.sig .bl p{font-size:13px;color:rgba(255,255,255,.62);line-height:1.7;margin-top:12px;max-width:42ch}
.sig .bot{display:flex;align-items:center;gap:14px;padding-top:24px;flex-wrap:wrap;font-size:12.5px;color:rgba(255,255,255,.55)}
.sig .bot .rt{margin-left:auto;display:flex;align-items:center;gap:8px}

/* the signature line — KOBIS gets the shine on hover */
/* The maker's credit. Understated by default — small, letterspaced, low
   contrast — so it reads as a signature rather than a second logo. The shine
   only wakes on hover. */
.by{display:inline-flex;align-items:baseline;gap:7px;font-size:11.5px;
  letter-spacing:.055em;color:rgba(255,255,255,.4);font-weight:500}
.kobis{position:relative;font-weight:700;font-size:12px;letter-spacing:.045em;padding:2px 1px;display:inline-block;

 "q.debt":          ["Belum jelas <b>{o}</b>, daripada itu <b>{d}</b> sudah lepas tarikh matang.<br>Penuaan: {ag}.","Outstanding <b>{o}</b>, of which <b>{d}</b> is past its due date.<br>Ageing: {ag}.","未结 <b>{o}</b>，其中 <b>{d}</b> 已逾期。<br>账龄：{ag}。","Agi tinggal <b>{o}</b>, ari nya <b>{d}</b> udah lepas tarikh matang.<br>Umur: {ag}."],
 "q.cg":            ["Consignment bermakna anda bil <b>barang yang terjual sahaja</b>. Hantar stock, lawatan berikut masukkan baki, sistem kira terjual = hantar − baki.<br>Sekarang ada <b>{n}</b> penghantaran belum disemak baki.","Consignment means you bill <b>only what sold</b>. Send stock, enter the balance on the next visit, and the system works out sold = sent − balance.<br>There are <b>{n}</b> deliveries awaiting a balance check.","寄售意味着只就<b>售出部分</b>开单。先送货，下次拜访时输入余货，系统算出售出量＝送出－余货。<br>目前有 <b>{n}</b> 笔送货待盘点。","Consignment reti nuan bil <b>semina utai ti udah dijual</b>. Kirum stock, lawang ti datai tama ke baki, sistem ngira dijual = dikirum − baki.<br>Diatu bisi <b>{n}</b> pengirum ti apin dipeda baki."],
 "q.quiet":         ["<b>{n}</b> outlet senyap lebih lama daripada irama biasa mereka. Paling ketara: <b>{c}</b> — {s} hari, biasanya setiap {a} hari.","<b>{n}</b> outlets have been quiet for longer than their usual rhythm. The clearest: <b>{c}</b> — {s} days, normally every {a}.","<b>{n}</b> 家门店静默时间超出常态。最明显的是 <b>{c}</b> — {s} 天，通常每 {a} 天一次。","<b>{n}</b> outlet senyap lebih lama ari irama sida ti biasa. Ti pemadu nyata: <b>{c}</b> — {s} hari, biasa nya tiap {a} hari."],
 "q.quiet0":        ["Tiada outlet yang tersasar daripada corak pesanan mereka sekarang.","No outlet has drifted from its ordering pattern right now.","目前没有门店偏离其下单模式。","Nadai outlet ti nyimpang ari chara order sida diatu."],
 "q.btb":           ["<b>Bil to Bil</b> — setiap order menjadi bil sendiri: Order → SO → Invoice, bayar ikut term 1, 2 atau 3 bulan yang disimpan pada outlet itu.","<b>Bil to Bil</b> — every order becomes its own bill: Order → SO → Invoice, paid on the 1, 2 or 3 month term held on that outlet.","<b>Bil to Bil</b> — 每笔订单自成一单：下单 → SO → 发票，按该门店设定的 1、2 或 3 个月账期付款。","<b>Bil to Bil</b> — tiap order nyadi bil diri empu: Order → SO → Invoice, bayar nitihka term 1, 2 tauka 3 bulan ba outlet nya."],
 "q.cash":          ["<b>Cash</b> — order dan bayar di tempat. SO dan Invoice dijana, payment direkod serta-merta, resit keluar sebelum salesman keluar dari kedai.","<b>Cash</b> — order and pay on the spot. The SO and Invoice are raised, the payment is recorded immediately, and the receipt is out before the salesman leaves.","<b>Cash</b> — 当场下单付款。生成 SO 与发票，款项即时入账，业务员离店前开出收据。","<b>Cash</b> — order lalu bayar ba endur nya. SO enggau Invoice digaga, bayar direkod tekala nya, resit pansut sebedau salesman pansut."],
 "q.howorder":      ["Buka Panel Salesman → {o}, pilih outlet, laraskan kuantiti dan harga (dalam had lantai), kemudian hantar. SO dan Invoice dijana serentak.","Open the Salesman panel → {o}, pick an outlet, set the quantities and prices (down to the floor), then submit. The SO and Invoice are raised together.","打开业务员面板 → {o}，选择门店，调整数量与价格（不低于限价），然后提交。SO 与发票同时生成。","Buka Panel Salesman → {o}, pilih outlet, atur kuantiti enggau rega (sampai ke pemadu baruh), udah nya kirum. SO enggau Invoice digaga sama lebuh."],
 "q.stock":         ["Stok van anda bernilai <b>{v}</b> merentas {n} SKU. {l} SKU bawah paras minimum.","Your van stock is worth <b>{v}</b> across {n} SKUs. {l} SKUs are below the minimum level.","你的车载库存价值 <b>{v}</b>，共 {n} 个 SKU，其中 {l} 个低于最低水平。","Stock van nuan berega <b>{v}</b> ba {n} SKU. {l} SKU baruh ari paras minimum."],
 "q.docs":          ["Setakat ini <b>{n}</b> dokumen dijana: {d}. Lima turutan berasingan, tiada nombor diguna semula. DO hanya untuk consignment, jadi kiraannya kecil; SO dijana bila barang terjual. Sebab itu nombor setiap jenis tidak sama.","<b>{n}</b> documents raised so far: {d}. Five separate sequences, no number reused. DO is consignment only, so its count stays small; an SO is raised when goods actually sell. That is why the numbers never match.","迄今已生成 <b>{n}</b> 份单据：{d}。五套独立编号，不重复使用。DO 仅用于寄售，数量较少；SO 在货品售出时生成。因此各类编号并不一致。","Udah <b>{n}</b> dokumen digaga: {d}. Lima turutan belain, nadai nambor diguna baru. DO semina ke consignment, nya alai mimit; SO digaga lebuh utai bendar dijual. Nya kebuah nambor tiap jenis enda sama."],
 "q.lang":          ["Portal ini menyokong empat bahasa: Bahasa Malaysia, English, 中文 dan Jaku Iban. Tukar di penjuru kanan atas — seluruh portal berubah serta-merta.","This portal runs in four languages: Bahasa Malaysia, English, 中文 and Jaku Iban. Switch at the top right and the whole portal changes immediately.","本门户支持四种语言：马来文、英文、中文与伊班文。在右上角切换，整个门户即时变更。","Portal tu bisi empat jaku: Bahasa Malaysia, English, 中文 enggau Jaku Iban. Tukar ba kanan atas — semua portal berubah tekala nya."],
 "q.modules":       ["Enam belas modul beroperasi: Register Customer, Senarai Outlet, Customer Profile, Jadual Harian, Ambil Order, DO, SO, Invoice, Payment, Receipt, Product &amp; Stock, Return, Sales Ranking, PDF/WhatsApp/Print, Running Number, dan Refer &amp; Earn.","Sixteen modules are running: Register Customer, Outlet List, Customer Profile, Daily Schedule, Take Order, DO, SO, Invoice, Payment, Receipt, Product &amp; Stock, Return, Sales Ranking, PDF/WhatsApp/Print, Running Number and Refer &amp; Earn.","十六个模块已运行：登记客户、门店清单、客户档案、每日行程、下单、DO、SO、发票、付款、收据、产品与库存、退货、销售排名、PDF/WhatsApp/打印、流水编号，以及推荐奖励。","Enam belas modul bejalai: Register Customer, Senarai Outlet, Customer Profile, Jadual Harian, Ambil Order, DO, SO, Invoice, Payment, Receipt, Product &amp; Stock, Return, Sales Ranking, PDF/WhatsApp/Print, Running Number, enggau Refer &amp; Earn."],
 "q.ai":            ["Lapisan AI membuat tiga kerja sebenar: menyusun laluan harian ikut wang tertunggak, membaca kelakuan bayaran setiap outlet daripada lag invois-ke-resit, dan menanda outlet yang senyap berbanding irama mereka sendiri.","The AI layer does three real jobs: it orders the day's route by money owed, reads each outlet's payment behaviour from the invoice-to-receipt lag, and flags outlets that have gone quiet against their own rhythm.","AI 层做三件实事：按欠款排定每日路线、从开票到收款的时间差读出各门店的付款行为，并标出相对自身节奏已静默的门店。","Lapisan AI ngereja tiga pengawa bendar: nyusun laluan tiap hari nitihka duit ti agi tinggal, macha chara bayar tiap outlet ari lag invois-ngagai-resit, lalu nanda outlet ti senyap nyimban enggau irama sida empu."],
 "q.hello":         ["Salam! Saya boleh jawab tentang jualan, kutipan, consignment, ranking, stok dan cara guna portal ini. Cuba salah satu soalan di bawah.","Hello. I can answer on sales, collections, consignment, ranking, stock and how to use this portal. Try one of the questions below.","您好！我可以回答销售、收款、寄售、排名、库存以及本门户的使用方式。请试试下面的问题。","Salam! Aku ulih nyaut pasal jualan, kutipan, consignment, ranking, stock enggau chara ngena portal tu. Uji siti tanya ba baruh."],
 "q.fallback":      ["Saya boleh bantu dengan: jualan dan ranking, kutipan dan hutang tertunggak, consignment dan baki stock, stok van, dokumen dan running number, atau tiga model transaksi. Cuba tanya salah satu.","I can help with: sales and ranking, collections and outstanding debt, consignment and stock balances, van stock, documents and running numbers, or the three transaction models. Ask about one of those.","我可以协助：销售与排名、收款与欠款、寄售与余货、车载库存、单据与流水编号，或三种交易模式。请就其中之一提问。","Aku ulih nulung pasal: jualan enggau ranking, kutipan enggau utang ti agi tinggal, consignment enggau baki stock, stock van, dokumen enggau running number, tauka tiga model transaksi. Uji tanya siti."],

/* ---------- COMPANY IDENTITY -----------------------------------------------
   This block prints at the head of every Invoice, Receipt and DO.
   It is DEMO DATA and must be replaced with the operating company's real
   details before a single real document is issued.

   The SSM field deliberately reads as a placeholder rather than a plausible
   registration number: a fabricated-but-realistic SSM number on a document
   that looks like a tax invoice is a problem, not a detail.
   ------------------------------------------------------------------------- */
const CO={name:"[Company Name] Sdn Bhd",trade:"Retail Distribution",ssm:"[SSM NO. — NOT SET]",
  addr:"[Registered address not set]",phone:"[Phone not set]",demo:true};
/* Who is using the portal. A single fixed user hid every per-salesman
   behaviour in the system — own outlets, own van, own collections, own
   ranking — so identity is a variable with a picker in the top bar.

   This is NOT access control: the picker is a demo affordance and anyone can
   select anyone. Real separation arrives with login and the database rules.
   At that point the session sets ME and the picker goes; every one of the
   forty places that read ME stays exactly as it is. */
let ME=null;
const USER_KEY="sp.user";
function setUser(id,go){
  const u=SALESMEN.find(x=>x.id===id)||SALESMEN[0];
  ME=u;
  try{localStorage.setItem(USER_KEY,u.id)}catch(_){}
  if(go) location.hash=go; else render();
}

/* Payment term decides which documents exist, so there is no one chain builder.
   Consignment gets a DO when the stock is physically dropped at the shop; the
   SO is raised later, and only for the units that actually sold. Bil to Bil and
   Cash never produce a DO at all — goods and sale happen in the same visit — so
   they go straight to SO and Invoice. Taking an order is a step, not a document:
   there is no ORD number.

   Because each document is issued on a different event, the running numbers
   are never in step with each other. That is the point of keeping them apart. */
function mkDelivery(c,date,lines,salesmanId){
  const total=money(lines.reduce((a,l)=>a+money(l.qty*l.price),0));
  const d={id:nn("DO",++DB.seq.DO),customerId:c.id,salesmanId,date,lines,total};
  DB.dos.push(d);
  return d;
}
function mkSale(c,date,lines,salesmanId,payNow,doId,invoiceNow){
  const total=money(lines.reduce((a,l)=>a+money(l.qty*l.price),0));
  const s={id:nn("SO",++DB.seq.SO),doId:doId||null,customerId:c.id,salesmanId,
    date,lines,total,invoiceId:null};
  DB.sos.push(s);
  /* An SO written in the field is not invoiced until the office processes it.
     Holding a few back is what keeps the two sequences honestly out of step. */
  if(invoiceNow===false) return {s,inv:null};
  const due=new Date(date.getTime()+(c.term==="cash"?0:c.months*30)*DAY);
  const inv={id:nn("INV",++DB.seq.INV),soId:s.id,doId:s.doId,customerId:c.id,salesmanId,
    date,due,total,paid:0,status:"pending",kind:c.term};
  DB.invoices.push(inv);
  s.invoiceId=inv.id;
  if(payNow) payInvoice(inv,total,"Cash",date);
  return {s,inv};
}
function payInvoice(inv,amt,method,date){
  inv.paid=money(inv.paid+amt);
  inv.status = inv.paid>=inv.total-0.01?"paid":"partial";
  const p={id:newId("PAY"),invoiceId:inv.id,customerId:inv.customerId,
    amount:amt,method,date,salesmanId:inv.salesmanId};
  DB.payments.push(p);
  const r={id:nn("REC",++DB.seq.REC),paymentId:p.id,invoiceId:inv.id,customerId:inv.customerId,
    amount:amt,method,date,salesmanId:inv.salesmanId};
  DB.receipts.push(r);
  return r;
}

/* ---------- SELECTORS ---------- */
const S={
  myCust:()=>CUSTOMERS.filter(c=>c.salesmanId===ME.id),
  mySched:()=>DB.schedule.filter(x=>x.salesmanId===ME.id).sort((a,b)=>a.order-b.order),
  myRefer:()=>DB.referrals.filter(r=>r.salesmanId===ME.id),
  invOf:cid=>DB.invoices.filter(i=>i.customerId===cid).sort((a,b)=>b.date-a.date),
  outstanding:cid=>DB.invoices.filter(i=>(!cid||i.customerId===cid)&&i.status!=="paid").reduce((a,i)=>a+(i.total-i.paid),0),
  overdue:cid=>DB.invoices.filter(i=>(!cid||i.customerId===cid)&&i.status!=="paid"&&i.due<TODAY).reduce((a,i)=>a+(i.total-i.paid),0),
  totalSales:cid=>DB.invoices.filter(i=>!cid||i.customerId===cid).reduce((a,i)=>a+i.total,0),
  inRange:(d,r)=>{
    const t=TODAY, x=new Date(d);
    if(r==="today") return sameDay(x,t);
    if(r==="yest") return sameDay(x,ago(1));
    /* Compare whole days. Today's orders carry a 09:00-15:00 timestamp, so a
       raw x<=t against midnight would drop the current day out of "this week". */
    const k=dbet(d0(x),d0(t));
    if(r==="week") return k>=0&&k<7;
    if(r==="lweek") return k>=7&&k<14;
    if(r==="month") return x.getMonth()===t.getMonth()&&x.getFullYear()===t.getFullYear();
    if(r==="lmonth"){const m=new Date(t.getFullYear(),t.getMonth()-1,1);return x.getMonth()===m.getMonth()&&x.getFullYear()===m.getFullYear();}
    if(r==="year") return x.getFullYear()===t.getFullYear();
    return true;
  },
  salesIn:(r,uid)=>DB.invoices.filter(i=>S.inRange(i.date,r)&&(!uid||i.salesmanId===uid)).reduce((a,i)=>a+i.total,0),
  /* Collection rate has to compare an invoice cohort against itself. Dividing
     cash received this month by value invoiced this month passes 100% the
     moment an old debt is settled, which reads as a broken number. */
  collRate:(r,uid)=>{
    const inv=DB.invoices.filter(i=>S.inRange(i.date,r)&&(!uid||i.salesmanId===uid));
    const t=inv.reduce((a,i)=>a+i.total,0);
    return t>0?Math.round(inv.reduce((a,i)=>a+i.paid,0)/t*100):0;
  },
  /* The SO is the record that a sale happened, so every count of orders,
     units and outlets traded reads from it. There is no separate ORD. */
  ordersIn:(r,uid)=>DB.sos.filter(o=>S.inRange(o.date,r)&&(!uid||o.salesmanId===uid)).length,
  qtyIn:(r,uid)=>DB.sos.filter(o=>S.inRange(o.date,r)&&(!uid||o.salesmanId===uid)).reduce((a,o)=>a+o.lines.reduce((x,l)=>x+l.qty,0),0),
  paidIn:(r,uid)=>DB.payments.filter(p=>S.inRange(p.date,r)&&(!uid||p.salesmanId===uid)).reduce((a,p)=>a+p.amount,0),
  custIn:(r,uid)=>new Set(DB.sos.filter(o=>S.inRange(o.date,r)&&(!uid||o.salesmanId===uid)).map(o=>o.customerId)).size,
  /* What this salesman still has money sitting in, worst overdue first. */
  myDue:()=>DB.invoices.filter(i=>i.salesmanId===ME.id&&i.status!=="paid")
    .map(i=>({i,late:dbet(i.due,TODAY)})).sort((a,b)=>b.late-a.late),
  soPending:()=>DB.sos.filter(s=>!s.invoiceId),
  ranking:r=>SALESMEN.map(s=>({...s,sales:S.salesIn(r,s.id),ord:S.ordersIn(r,s.id),paid:S.paidIn(r,s.id)})).sort((a,b)=>b.sales-a.sales),
  openConsign:cid=>DB.consign.filter(c=>(!cid||c.customerId===cid)&&c.balance===null),
  /* debt ageing buckets, the number a boss actually asks for */
  ageing:()=>{
    const b=[{l:"0–30",v:0},{l:"31–60",v:0},{l:"61–90",v:0},{l:"90+",v:0}];
    DB.invoices.filter(i=>i.status!=="paid").forEach(i=>{
      const d=dbet(i.due,TODAY), o=i.total-i.paid;
      if(d<=30) b[0].v+=o; else if(d<=60) b[1].v+=o; else if(d<=90) b[2].v+=o; else b[3].v+=o;
    });
    return b;
  },
  histOf:cid=>{
    const h=[];
    DB.dos.filter(x=>x.customerId===cid).forEach(x=>h.push({t:"DO",id:x.id,d:x.date,amt:x.total,k:"k-blue"}));
    DB.sos.filter(x=>x.customerId===cid).forEach(x=>h.push({t:"SO",id:x.id,d:x.date,amt:x.total,k:"k-blue"}));
    DB.invoices.filter(x=>x.customerId===cid).forEach(x=>h.push({t:"Invoice",id:x.id,d:x.date,amt:x.total,k:"k-amb"}));
    DB.receipts.filter(x=>x.customerId===cid).forEach(x=>h.push({t:"Receipt",id:x.id,d:x.date,amt:x.amount,k:"k-grn"}));
    DB.returns.filter(x=>x.customerId===cid).forEach(x=>h.push({t:"Return",id:x.id,d:x.date,amt:0,k:"k-red"}));
    return h.sort((a,b)=>b.d-a.d);
  },
  docCount:()=>DB.dos.length+DB.sos.length+DB.invoices.length+DB.receipts.length+DB.returns.length
};

/* ==========================================================================
   AI LAYER — every reading below is computed from the data on screen.
   Nothing is scripted; change the data and the AI copy changes with it.
   ========================================================================== */
const AI={
  /* route order: overdue money first, then consignment due a check, then value */
  route(){
    return S.myCust().map(c=>{
      const od=S.overdue(c.id), open=S.openConsign(c.id).length, val=S.totalSales(c.id);
      let score=val/1000 + od/400 + open*22;
      const why=[];
      if(od>0) why.push({k:"k-red",t:RM(od)+" "+T("ai.od")});
      if(open) why.push({k:"k-vio",t:open+" "+T("ai.chk")});
      if(!why.length) why.push({k:"k-mut",t:T("ai.routine")});
      return {c,score,od,open,why};
    }).sort((a,b)=>b.score-a.score);
  },
  /* which outlets have gone quiet relative to their own rhythm */
  quiet(){
    return CUSTOMERS.map(c=>{
      const inv=S.invOf(c.id);
      if(inv.length<2) return null;
      const gaps=[]; for(let i=0;i<inv.length-1;i++) gaps.push(dbet(inv[i+1].date,inv[i].date));
      const avg=gaps.reduce((a,b)=>a+b,0)/gaps.length;
      const since=dbet(inv[0].date,TODAY);
      return since>avg*1.6&&since>25 ? {c,since,avg:Math.round(avg),risk:Math.min(99,Math.round(since/avg*45))} : null;
    }).filter(Boolean).sort((a,b)=>b.risk-a.risk);
  },
  /* payment behaviour, read off actual receipt lag */
  payer(cid){
    const paid=DB.invoices.filter(i=>i.customerId===cid&&i.status==="paid");
    if(!paid.length) return null;
    const lags=paid.map(i=>{const r=DB.receipts.find(x=>x.invoiceId===i.id);return r?dbet(i.date,r.date):null}).filter(x=>x!=null);
    if(!lags.length) return null;
    const avg=Math.round(lags.reduce((a,b)=>a+b,0)/lags.length);
    const c=cust(cid), term=c.months*30||0;
    return {avg,onTime:term?avg<=term:true,term};
  },
  /* the boss briefing — one paragraph, all of it derived */
  brief(r){
    const sales=S.salesIn(r), paid=S.paidIn(r), out=S.outstanding(), od=S.overdue();
    const rank=S.ranking(r), top=rank[0], low=rank[rank.length-1];
    const q=AI.quiet().length, oc=S.openConsign().length;
    return {sales,paid,out,od,top,low,quiet:q,openConsign:oc,
      rate:S.collRate(r),
      gap:top&&low?top.sales-low.sales:0};
  }
};

  const foot = LIVE() ? `

function statusChip(i){
  if(i.status==="paid") return `<span class="chip k-grn">${T("l.paid")}</span>`;
  if(i.status==="partial") return `<span class="chip k-amb">${T("l.partial")}</span>`;
  if(i.due<TODAY) return `<span class="chip k-red">${T("k.overdue")} ${dbet(i.due,TODAY)}d</span>`;
  return `<span class="chip k-mut">${T("l.pending")}</span>`;
}

/* ---------- MANAGEMENT: DOCUMENTS ---------- */
function mDocs(){
  const tab=ST.docTab;
  const all=[];
  const add=(arr,t,k)=>arr.forEach(x=>all.push({t,k,id:x.id,d:x.date,amt:x.total!=null?x.total:x.amount||0,cid:x.customerId,sid:x.salesmanId}));
  if(tab==="all"||tab==="DO")  add(DB.dos,"DO","k-blue");
  if(tab==="all"||tab==="SO")  add(DB.sos,"SO","k-cy");
  if(tab==="all"||tab==="INV") add(DB.invoices,"Invoice","k-amb");
  if(tab==="all"||tab==="REC") add(DB.receipts,"Receipt","k-grn");
  if(tab==="all"||tab==="RET") add(DB.returns,"Return","k-red");
  all.sort((a,b)=>b.d-a.d);

function mReports(){
  const r=ST.mrange;
  const byTerm=["consign","biltobil","cash"].map(t=>({t,
    v:DB.invoices.filter(i=>S.inRange(i.date,r)&&i.kind===t).reduce((a,i)=>a+i.total,0),
    n:DB.invoices.filter(i=>S.inRange(i.date,r)&&i.kind===t).length}));
  const tmax=Math.max(...byTerm.map(x=>x.v),1);
  const byProd=PRODUCTS.map(p=>{
    let qty=0,val=0;
    DB.sos.filter(o=>S.inRange(o.date,r)).forEach(o=>o.lines.forEach(l=>{
      if(l.productId===p.id){qty+=l.qty;val+=l.qty*l.price}}));
    return {p,qty,val};
  }).sort((a,b)=>b.val-a.val);
  const pmax=Math.max(...byProd.map(x=>x.val),1);
  const byZone={};
  DB.invoices.filter(i=>S.inRange(i.date,r)).forEach(i=>{
    const c=cust(i.customerId); byZone[c.dist]=(byZone[c.dist]||0)+i.total;});
  const zones=Object.entries(byZone).sort((a,b)=>b[1]-a[1]);
  const zmax=zones[0]?zones[0][1]:1;
  return M("reports",`
    <div class="pgh"><div><h1>${T("m.reports")}</h1><p>${T("k.sales")} ${RM(S.salesIn(r))}</p></div>
      <div class="ra">${rangeTabs(r,"mrange")}</div></div>
    <div class="g g2">
      <div class="card p">
        <h3>${T("m.bymodel")}</h3><div class="sub">${T("m.bymodelb")}</div>
        <div style="margin-top:17px">${byTerm.map(x=>`
          <div style="margin-bottom:15px">
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px">
              <span><span class="chip ${TERM[x.t].k}">${TERM[x.t].t}</span> <span style="color:var(--dim)">${x.n} invoice</span></span>
              <b class="num">${RM(x.v)}</b></div>
            <div class="prog"><i data-w="${Math.round(x.v/tmax*100)}%" style="background:var(--${x.t==="consign"?"vio":x.t==="biltobil"?"blue":"grn"})"></i></div>
          </div>`).join("")}</div>
      </div>
      <div class="card p">
        <h3>${T("m.byarea")}</h3><div class="sub">${T("m.byareab")}</div>
        <div style="margin-top:17px">${zones.slice(0,7).map(([z,v])=>`
          <div style="margin-bottom:13px">
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px">
              <b>${esc(z)}</b><b class="num">${RM(v)}</b></div>
            <div class="prog"><i data-w="${Math.round(v/zmax*100)}%"></i></div>
          </div>`).join("")||`<div class="empty"><b>${T("l.none")}</b></div>`}</div>
      </div>
    </div>
    <div class="sec">${T("m.byprod")}</div>
    <div class="tw"><table>
      <thead><tr><th>SKU</th><th>${T("l.product")}</th><th class="r">${T("l.qty")}</th><th class="r">${T("l.value")}</th>
        <th class="r">${T("l.price")}</th><th style="width:180px">—</th></tr></thead>
      <tbody>${byProd.map(x=>`<tr>
        <td class="mono" style="color:var(--dim)">${x.p.sku}</td>
        <td><b>${esc(x.p.name)}</b></td>
        <td class="r num">${x.qty}</td>
        <td class="r"><b>${RM(x.val)}</b></td>
        <td class="r num">${RM2(x.p.price)}</td>
        <td><div class="prog"><i data-w="${Math.round(x.val/pmax*100)}%"></i></div></td></tr>`).join("")}</tbody>
    </table></div>`);
}

function sCustomer(id){
  const c=cust(id); if(!c) return sCust();
  const inv=S.invOf(id), open=S.openConsign(id), od=S.overdue(id), pay=AI.payer(id);
  const hist=S.histOf(id);
  const tabs=["All","DO","SO","Invoice","Receipt","Return"];
  const h=ST.histTab==="All"?hist:hist.filter(x=>x.t===ST.histTab);
  const cmd=[["Ambil Order",I.cart,"#/s/order/"+id,"var(--blue-lo)","#2743D8"],
    ...(c.term==="consign"?[["Consignment",I.box,"#/s/consign/"+id,"var(--vio-lo)","#8B5CF6"]]:[]),
    ["Payment",I.cash,"#/s/payment/"+id,"var(--grn-lo)","#0E9F6E"],
    ["Return",I.ret,"#/s/return/"+id,"var(--red-lo)","#DC2626"],
    ["Dokumen",I.doc,"#/s/docs/"+id,"var(--amb-lo)","#D97706"],
    ["Navigate",I.pin,"#/s/nav/"+id,"var(--s3)","#57678A"],
    ["WhatsApp",I.wa,"#/s/wa/"+id,"var(--grn-lo)","#0E9F6E"]];
  return SM("cust",`
    <div class="pgh"><div>
      <a href="#/s/cust" style="font-size:12.5px;color:var(--blue);font-weight:700">‹ ${T("s.cust")}</a>
      <h1 style="margin-top:5px">${esc(c.name)}</h1>
      <p><span class="mono">${c.code}</span> · ${esc(c.type)} · ${esc(c.dist)}, ${esc(c.state)}</p></div>
      <div class="ra"><span class="chip ${TERM[c.term].k}" style="font-size:12.5px;padding:6px 13px">${TERM[c.term].t}${c.months?` · ${c.months} bulan`:""}</span></div></div>
    <div class="g g4" style="margin-bottom:18px">
      ${kpi(T("k.sales"),RM(S.totalSales(id)),inv.length+" invoice",I.chart,"#3B5BFF")}
      ${kpi(T("k.outstanding"),RM(S.outstanding(id)),inv.filter(i=>i.status!=="paid").length+" belum jelas",I.doc,"#D97706")}
      ${kpi(T("k.overdue"),RM(od),od>0?T("k.needcoll"):T("k.clean"),I.shield,od>0?"#DC2626":"#0E9F6E")}
      ${kpi("Consignment",open.length,"belum semak baki",I.box,"#8B5CF6")}
    </div>
    <div class="sec">Tindakan</div>
    <div class="g g4" style="gap:10px">${cmd.map(([t,i,h2,bg,col])=>
      `<a class="card p" href="${h2}" style="display:flex;align-items:center;gap:11px;padding:13px">
        <span style="width:34px;height:34px;border-radius:10px;background:${bg};display:grid;place-items:center;flex:none">${ic(i,col)}</span>
        <b style="font-size:13px">${t}</b></a>`).join("")}</div>
    <div class="g g23" style="margin-top:22px">
      <div class="card p">
        <h3>${T("l.dochist")}</h3>
        <div class="tabs" style="margin:12px 0">${tabs.map(t=>
          `<button data-a="hist" data-v="${t}" class="${ST.histTab===t?"on":""}">${t}</button>`).join("")}</div>
        <div style="max-height:430px;overflow-y:auto">${h.length?h.slice(0,40).map(x=>`
          <a href="#/s/doc/${x.t}/${x.id}" style="display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)">
            <span class="chip ${x.k}" style="width:66px;justify-content:center">${x.t}</span>
            <span style="flex:1;min-width:0"><b class="mono" style="font-size:12.5px">${x.id}</b><br>
              <span style="font-size:11.5px;color:var(--dim)">${fd(x.d)}</span></span>
            <b class="num">${x.amt?RM2(x.amt):"—"}</b>
          </a>`).join(""):`<div class="empty"><b>${T("l.none")}</b></div>`}</div>
      </div>
      <div class="g" style="gap:14px;align-content:start">
        <div class="card p">
          <h3>Maklumat</h3>
          <div style="margin-top:11px;font-size:13px;line-height:2">
            ${[["PIC",c.pic],["Telefon",c.phone],["WhatsApp",c.wa],["SSM",c.ssm],
               ["Alamat",c.addr+", "+c.pos],["GPS",c.lat+", "+c.lng],
               ["Salesman",sm(c.salesmanId).name],["Daftar",fd(c.regAt)]].map(([l,v])=>
              `<div style="display:flex;gap:12px"><span style="color:var(--dim);width:82px;flex:none">${l}</span>
                <span style="flex:1;min-width:0;font-weight:600">${esc(v)}</span></div>`).join("")}
          </div>
        </div>
        ${pay?`<div class="aip">
          <span class="ai-pill"><span class="dot"></span>${T("ai.k")}</span>
          <h3>${T("l.paybeh")}</h3>
          <p>${TF("f.lagdays",{n:`<b style="color:#fff">${pay.avg}</b>`})}${pay.term?TF("f.termdays",{n:pay.term}):"."}
          ${pay.onTime?T("p.ontime"):T("p.late")}</p>
        </div>`:""}
        ${open.length?`<div class="warn">${TF("f.cgopen",{n:`<b>${open.length}</b>`})}
          ${T("cg.blocked")} <a href="#/s/consign/${id}" style="color:var(--amb);font-weight:800">${T("s.checknow")}</a></div>`:""}
      </div>
    </div>`);
}

function sOrder(cid){
  if(!cid) return SM("order",`
    <div class="pgh"><div><h1>${T("s.order")}</h1><p>${T("o.pick")}</p></div></div>
    <div class="g g3">${S.myCust().map(c=>{
      /* A consignment outlet is not ordered from — stock is dropped and billed
         later from the balance. Sending it to the right screen here is better
         than letting an order be built that will be refused on submit. */
      const cg=c.term==="consign";
      return `<a class="card p" href="#/s/${cg?"consign":"order"}/${c.id}">
        <b style="font-size:14.5px;display:block">${esc(c.name)}</b>
        <span style="font-size:12px;color:var(--mut)">${c.code} · ${esc(c.dist)}</span><br>
        <span class="chip ${TERM[c.term].k}" style="margin-top:9px">${TERM[c.term].t}</span>
        ${cg?`<span class="chip k-mut" style="margin-top:9px">${T("o.tocg")}</span>`:""}</a>`}).join("")}</div>`);
  const c=cust(cid); if(!c) return sOrder();
  /* Someone who lands here by link or by typing the address gets the screen that
     can actually serve this outlet, rather than a refusal at the end. */
  if(c.term==="consign") return sConsign(cid);
  if(!ST.draft||ST.draft.cid!==cid) ST.draft={cid,lines:PRODUCTS.map(p=>({productId:p.id,qty:0,price:p.price}))};
  const d=ST.draft, total=money(d.lines.reduce((a,l)=>a+money(l.qty*l.price),0));
  const n=d.lines.filter(l=>l.qty>0).length;
  return SM("order",`
    <div class="pgh"><div><a href="#/s/customer/${cid}" style="font-size:12.5px;color:var(--blue);font-weight:700">‹ ${esc(c.name)}</a>
      <h1 style="margin-top:5px">${T("s.order")}</h1>
      <p><span class="chip ${TERM[c.term].k}">${TERM[c.term].t}</span> ${c.months?` · bayar dalam ${c.months} bulan`:" · bayar di tempat"}</p></div></div>
    <div class="g g23" style="align-items:start">
      <div class="card p">
        <h3>${T("l.product")}</h3>
        <div class="sub">${T("o.floorn")}</div>
        <div style="margin-top:8px">${d.lines.map(l=>{const p=prod(l.productId);
          const below=l.price<p.floor;
          return `<div class="li">
            <span class="n"><b>${esc(p.name)}</b><span>${p.sku} · ${TF("f.invan",{n:vanOf(p.id)})}</span></span>
            <span style="width:104px;flex:none">
              <input data-a="price" data-p="${p.id}" type="text" inputmode="decimal" value="${l.price.toFixed(2)}"
                style="width:100%;padding:7px 9px;border:1px solid ${below?"var(--red)":"var(--line2)"};border-radius:8px;font-size:13px;font-weight:700;text-align:right">
              ${below?`<span style="font-size:10px;color:var(--red);font-weight:700">${TF("f.below",{a:RM2(p.floor)})}</span>`
                     :`<span style="font-size:10px;color:var(--dim)">lantai ${RM2(p.floor)}</span>`}</span>
            <span class="stp"><button data-a="q-" data-p="${p.id}">−</button>
              <span class="q num">${l.qty}</span><button data-a="q+" data-p="${p.id}">+</button></span>
            <span style="width:88px;text-align:right;flex:none"><b class="num">${l.qty?RM2(l.qty*l.price):"—"}</b></span>
          </div>`}).join("")}</div>
        <div class="tot"><span style="font-size:13px;color:var(--mut)">${n} item</span><b>${RM2(total)}</b></div>
      </div>
      <div class="g" style="gap:14px;align-content:start">
        ${d.lines.some(l=>l.qty>0&&l.price<prod(l.productId).floor)
          ?`<div class="warn"><b>${T("o.below")}</b> Order masih boleh dihantar tetapi ditandakan untuk semakan pengurusan.</div>`:""}
        <div class="card p">
          <h3>${T("o.chain")}</h3>
          <div class="sub">${TF("o.nodoline",{t:TERM[c.term].t})}</div>
          <div class="flow" style="margin-top:12px">
            <div>${nn("SO",DB.seq.SO+1)}</div><div class="hi">${nn("INV",DB.seq.INV+1)}</div>
            ${c.term==="cash"?`<div class="gd">${nn("REC",DB.seq.REC+1)}</div>`:""}
          </div>
        </div>
        <button class="btn btn-p btn-w" data-a="submit-order" data-c="${cid}" ${n?"":"disabled"}>
          Hantar Order · ${RM2(total)}</button>
      </div>
    </div>`);
}

/* ---------- SALESMAN: PAYMENT & COLLECTIONS ----------
   The payment screen always existed, but only from inside an outlet profile.
   A salesman starting his round needs the opposite view: who owes me, worst
   first, and one tap into the payment screen from each row. */
function sCollect(){
  const due=S.myDue();
  const late=due.filter(x=>x.late>0);
  const out=due.reduce((a,x)=>a+(x.i.total-x.i.paid),0);
  const lateAmt=late.reduce((a,x)=>a+(x.i.total-x.i.paid),0);
  const today=DB.payments.filter(p=>p.salesmanId===ME.id&&sameDay(p.date,TODAY))
    .reduce((a,p)=>a+p.amount,0);
  const mine=DB.receipts.filter(r=>r.salesmanId===ME.id)
    .slice().sort((a,b)=>b.date-a.date);
  return SM("collect",`
    <div class="pgh"><div><h1>${T("s.collect")}</h1><p>${T("s.collect.d")}</p></div></div>
    <div class="g g3" style="margin-bottom:18px">
      ${kpi(T("k.outstanding"),RMk(out),TF("f.ninv",{n:due.length}),I.doc,"#D97706")}
      ${kpi(T("k.overdue"),RMk(lateAmt),late.length+" "+T("l.late").toLowerCase(),I.shield,"#DC2626")}
      ${kpi(T("l.collected"),RMk(today),fd(TODAY),I.cash,"#0E9F6E")}
    </div>
    ${due.length?`<div class="tw"><table>
      <thead><tr><th>${T("l.customer")}</th><th>${T("l.invoice")}</th><th>${T("l.due")}</th>
        <th>${T("l.late")}</th><th class="r">${T("l.balance")}</th><th></th></tr></thead>
      <tbody>${due.map(({i,late:L})=>{const c=cust(i.customerId);return `<tr>
        <td><a class="lk" href="#/s/customer/${c.id}">${esc(c.name)}</a>
          <div style="font-size:11.5px;color:var(--dim)">${esc(c.dist)} · ${TERM[c.term].t}</div></td>
        <td><a class="lk mono" href="#/s/doc/Invoice/${i.id}">${i.id}</a></td>
        <td>${fd(i.due)}</td>
        <td>${L>0?`<span class="chip k-red">${TF("f.days",{n:L})}</span>`:`<span class="chip k-mut">${TF("f.daysleft",{n:-L})}</span>`}</td>
        <td class="r"><b>${RM2(i.total-i.paid)}</b>${i.paid>0?`<div style="font-size:11px;color:var(--dim)">separa · ${RM2(i.paid)} dibayar</div>`:""}</td>
        <td class="r"><a class="btn btn-s" href="#/s/payment/${c.id}/${i.id}">${ic(I.cash)} ${T("l.record")}</a></td>
      </tr>`}).join("")}</tbody>
    </table></div>`
    :`<div class="empty"><b>${T("col.none")}</b>
       <div>${DB.invoices.length
         ? T("col.allpaid")
         : T("col.noinvyet")}</div></div>`}

    <div class="sec">Kutipan diterima (${mine.length})</div>
    ${mine.length?`<div class="tw"><table>
      <thead><tr><th>${T("l.date")}</th><th>${T("l.customer")}</th><th>${T("col.rec")}</th><th>${T("col.inv")}</th>
        <th>${T("col.meth")}</th><th class="r">${T("l.amount")}</th></tr></thead>
      <tbody>${mine.slice(0,40).map(r=>{const c=cust(r.customerId);return `<tr>
        <td>${fd(r.date)}</td>
        <td>${c?`<a class="lk" href="#/s/customer/${c.id}">${esc(c.name)}</a>`:"—"}</td>
        <td><a class="lk mono" href="#/s/doc/Receipt/${r.id}">${r.id}</a></td>
        <td><a class="lk mono" href="#/s/doc/Invoice/${r.invoiceId}">${r.invoiceId||"—"}</a></td>
        <td>${esc(r.method||"—")}</td>
        <td class="r"><b>${RM2(r.amount)}</b></td></tr>`}).join("")}</tbody>
    </table></div>`
    /* The collections worklist shows what is still owed, so it empties as the
       money comes in. Without this list a salesman who had collected everything
       saw a blank screen and no evidence any payment had ever been recorded. */
    :`<div class="empty"><b>${T("col.nocol")}</b>
       <div>${T("col.nocolb")}</div></div>`}
    <div class="note" style="margin-top:13px">${T("col.autorec")}</div>`);
}

function sConsign(cid){
  const list=cid?DB.consign.filter(g=>g.customerId===cid):DB.consign.filter(g=>g.salesmanId===ME.id);
  const c=cid?cust(cid):null;
  const openL=list.filter(g=>g.balance===null), doneL=list.filter(g=>g.balance!==null);
  return SM("consign",`
    <div class="pgh"><div>${c?`<a href="#/s/customer/${cid}" style="font-size:12.5px;color:var(--blue);font-weight:700">‹ ${esc(c.name)}</a>`:""}
      <h1 style="margin-top:5px">${T("s.consign")}</h1>
      <p>${T("cg.sub")}</p></div></div>
    ${c?`<div class="card p" style="margin-bottom:18px">
      <h3>${T("cg.new")}</h3>
      <div class="f2" style="margin-top:13px">
        <div class="f"><label>${T("l.product")}</label><select id="cgp">
          ${PRODUCTS.map(p=>`<option value="${p.id}">${esc(p.name)} — ${RM2(p.price)} (${TF("f.invan",{n:vanOf(p.id)})})</option>`).join("")}</select></div>
        <div class="f"><label>${T("l.qty")}</label><input id="cgq" type="number" value="${Math.min(100,Math.max(1,vanOf(PRODUCTS[0]&&PRODUCTS[0].id)))}" min="1"></div></div>
      <button class="btn btn-p" data-a="send-stock" data-c="${cid}">${ic(I.truck)} ${T("l.sendstock")}</button>
    </div>`
    /* Reached from the rail there is no outlet yet, and the drop form needs one.
       Without this the screen was two empty lists and no way to start — which is
       exactly how a stock drop ended up being entered as an ordinary sale. */
    :(()=>{ const mine=S.myCust().filter(x=>x.term==="consign");
      return `<div class="card p" style="margin-bottom:18px">
        <h3>${T("cg.pick")}</h3>
        <p style="color:var(--mut);font-size:13.5px;margin-top:6px">
          ${T("cg.onlycg")}
          <a href="#/s/order" style="color:var(--blue);font-weight:700">Ambil Order</a>.</p>
        ${mine.length?`<div class="g g3" style="margin-top:14px">${mine.map(x=>{
          const open=DB.consign.filter(g=>g.customerId===x.id&&g.balance===null).length;
          return `<a class="card p" href="#/s/consign/${x.id}" style="border-color:var(--line)">
            <b style="font-size:14.5px;display:block">${esc(x.name)}</b>
            <span style="font-size:12px;color:var(--mut)">${x.code} · ${esc(x.dist)}</span><br>
            <span class="chip k-vio" style="margin-top:9px">${TERM.consign.t}</span>
            ${open?`<span class="chip k-amb" style="margin-top:9px">${TF("f.notchecked",{n:open})}</span>`:""}
          </a>`}).join("")}</div>`
        :`<div class="empty" style="margin-top:14px"><b>${T("cg.nocg")}</b>
           <span>Tiada outlet anda yang menggunakan term Consignment. Tukar term outlet, atau
           daftar outlet baru dengan term Consignment.</span></div>`}
      </div>`})()}
    <div class="sec">${TF("f.openbal",{n:openL.length})}</div>
    <div class="g g2">${openL.map(g=>{const cc=cust(g.customerId),p=prod(g.productId);
      const bal=g.tmp, ok=bal!=null&&bal>=0&&bal<=g.qty, sold=ok?g.qty-bal:null;
      return `<div class="card p cg-open">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
          <div><b style="font-size:14.5px">${esc(cc.name)}</b>
            <div style="font-size:12.5px;color:var(--mut);margin-top:2px">${esc(p.name)} · ${fd(g.date)} · ${TF("f.days",{n:dbet(g.date,TODAY)})}</div></div>
          <span class="chip k-vio">${TF("f.units",{n:g.qty})}</span></div>
        <div class="f" style="margin-top:14px"><label>${T("cg.bal")}</label>
          <input data-a="bal" data-g="${g.id}" type="number" min="0" max="${g.qty}" value="${bal!=null?bal:""}" placeholder="${T("cg.balph")}">
          <div class="hint">${TF("f.sentq",{n:g.qty,p:RM2(g.price)})}</div></div>
