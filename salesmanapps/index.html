<meta charset="utf-8">
<title>Salesman Apps</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Retail Sales & Distribution Management App — 16 modules, 3 transaction models: Consignment, Bil to Bil, Cash.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* ============================================================
   SALESMAN APPS — Retail Sales & Distribution Management
   Built to the KOBIS MASTER FINAL requirement: 16 modules,
   3 transaction models. Salesman-mobile-first.
   ============================================================ */
:root{
  --blue:#2B5CE6; --blue-d:#1E47C4; --blue-lo:#EAF0FE;
  --violet:#7C3AED; --violet-lo:#F1EAFE;
  --green:#0E9F6E; --green-lo:#E3F7EF;
  --amber:#D97706; --amber-lo:#FDF1E1;
  --red:#DC2626; --red-lo:#FDECEC;
  --ink:#0F172A; --mut:#5A6A85; --dim:#94A3B8;
  --page:#F4F7FC; --card:#FFFFFF; --s2:#F8FAFD; --s3:#EEF3FA;
  --line:#E3EAF3; --line2:#CFDAE8;
  --paper:#FEFDFB; --pink:#1A1712;
  --ui:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:12px; --r-s:9px; --r-l:18px; --pill:100px;
  --sh:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.06);
  --sh2:0 8px 30px rgba(15,23,42,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--page);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{line-height:1.2;letter-spacing:-.02em;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* shell */
.wrap{display:flex;justify-content:center;gap:28px;padding:24px 20px 60px;align-items:flex-start}
.phone{width:404px;flex:none;background:#fff;border:1px solid var(--line2);border-radius:38px;padding:10px;box-shadow:0 30px 70px rgba(15,23,42,.18);position:sticky;top:20px}
.scr{background:var(--page);border-radius:29px;overflow:hidden;height:788px;display:flex;flex-direction:column;position:relative}
.sb{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:10.5px;font-family:var(--mono);color:var(--dim);flex:none;background:#fff}
.view{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.view::-webkit-scrollbar{width:4px}.view::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
.side{width:330px;flex:none;position:sticky;top:20px;display:flex;flex-direction:column;gap:14px}
@media(max-width:920px){.wrap{padding:0;display:block}.phone{width:100%;border:none;border-radius:0;padding:0;box-shadow:none;position:static}.scr{border-radius:0;height:auto;min-height:100vh}.sb{display:none}.side{display:none}}

/* top bar */
.tb{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:11px;flex:none;position:sticky;top:0;z-index:20}
.tb .bk{width:32px;height:32px;border-radius:9px;background:var(--s3);display:grid;place-items:center;flex:none;font-size:17px;color:var(--mut)}
.tb .ti{flex:1;min-width:0}
.tb .ti b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb .ti span{font-size:11.5px;color:var(--mut)}
.tb .av{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}

/* bottom nav */
.nav{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);padding:7px 4px 10px;position:sticky;bottom:0;z-index:20}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;font-size:10px;font-weight:700;color:var(--dim)}
.nav a.on{color:var(--blue)}
.nav svg{width:21px;height:21px}

/* blocks */
.pad{padding:14px 16px}
.hero{background:linear-gradient(160deg,var(--blue) 0%,#1B44B8 100%);padding:16px 16px 26px;color:#fff}
.hero .gr{font-size:12.5px;opacity:.85}
.hero h2{font-size:19px;margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:-16px 16px 0;position:relative;z-index:2}
.st{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px 10px;box-shadow:var(--sh)}
.st .l{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);font-weight:800;line-height:1.3}
.st .v{font-size:16px;font-weight:800;margin-top:5px;letter-spacing:-.03em}
.st.w{grid-column:span 3}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.qa a{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px 5px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--ink);text-align:center;box-shadow:var(--sh);transition:.15s}
.qa a:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.qa .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.qa svg{width:17px;height:17px}

.sec{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);font-weight:800;margin:18px 0 9px;display:flex;align-items:center;gap:8px}
.sec .mo{margin-left:auto;color:var(--blue);font-size:11px;text-transform:none;letter-spacing:0}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:11px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;box-shadow:var(--sh);width:100%;text-align:left;transition:.15s}
.row:hover{border-color:var(--line2);transform:translateY(-1px)}
.row .sq{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.row .in{flex:1;min-width:0}
.row .in b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .in span{font-size:11.5px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{text-align:right;flex:none}
.row .rt b{display:block;font-size:13px;font-weight:800}
.row .rt span{font-size:10.5px;color:var(--dim)}

.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:var(--pill);font-size:10.5px;font-weight:800;white-space:nowrap}
.k-blue{background:var(--blue-lo);color:var(--blue-d)}
.k-vio{background:var(--violet-lo);color:var(--violet)}
.k-grn{background:var(--green-lo);color:var(--green)}
.k-amb{background:var(--amber-lo);color:var(--amber)}
.k-red{background:var(--red-lo);color:var(--red)}
.k-mut{background:var(--s3);color:var(--mut)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:var(--r-s);font-weight:700;font-size:14px;background:#fff;border:1px solid var(--line2);color:var(--ink);transition:.15s}
.btn:hover{background:var(--s2)}
.btn-p{background:var(--blue);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(43,92,230,.3)}
.btn-p:hover{background:var(--blue-d)}
.btn-g{background:var(--green);color:#fff;border-color:transparent}
.btn-w{width:100%;padding:14px;font-size:15px;border-radius:var(--r)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn svg{width:16px;height:16px}

.f{margin-bottom:13px}
.f label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);font-weight:800;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;background:#fff;border:1px solid var(--line2);border-radius:var(--r-s);font-size:14px;font-weight:600}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-lo)}
.f .hint{font-size:11px;color:var(--dim);margin-top:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.search{position:relative;margin-bottom:12px}
.search input{width:100%;padding:11px 12px 11px 36px;background:#fff;border:1px solid var(--line2);border-radius:var(--pill);font-size:13.5px;font-weight:600}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--dim)}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:6px 13px;border-radius:var(--pill);font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line);color:var(--mut);white-space:nowrap;flex:none}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* customer profile command center */
.cp{background:linear-gradient(160deg,var(--blue),#1B44B8);color:#fff;padding:16px}
.cp .cc{font-family:var(--mono);font-size:11px;opacity:.8;letter-spacing:.06em}
.cp h2{font-size:19px;margin:3px 0 6px}
.cp .meta{font-size:12px;opacity:.9;line-height:1.6}
.cp .kpi{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.cp .kpi>div{background:rgba(255,255,255,.14);border-radius:10px;padding:9px 11px}
.cp .kpi .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;opacity:.8;font-weight:800}
.cp .kpi .v{font-size:15px;font-weight:800;margin-top:2px}
.cmd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cmd a{background:#fff;border:1px solid var(--line);border-radius:var(--r-s);padding:10px 3px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:9.5px;font-weight:800;box-shadow:var(--sh)}
.cmd a:hover{transform:translateY(-2px)}
.cmd .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.cmd svg{width:15px;height:15px}

/* line items */
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.li .n{flex:1;min-width:0}
.li .n b{display:block;font-size:13px;font-weight:700}
.li .n span{font-size:10.5px;color:var(--dim);font-family:var(--mono)}
.stp{display:flex;align-items:center;background:var(--s3);border-radius:var(--r-s);flex:none}
.stp button{width:30px;height:30px;font-size:17px;font-weight:700;color:var(--mut);display:grid;place-items:center}
.stp .q{width:30px;text-align:center;font-weight:800;font-size:13.5px}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-top:2px solid var(--line2);margin-top:8px}
.tot b{font-size:24px;font-weight:800}

/* thermal document */
.thm{background:var(--paper);color:var(--pink);font-family:var(--mono);font-size:11px;line-height:1.6;padding:16px 14px;border-radius:6px;box-shadow:var(--sh2);border:1px solid #E8E2D6;margin:0 auto;max-width:302px}
.thm.w80{max-width:302px}
.thm.w58{max-width:220px;font-size:10px}
.thm .c{text-align:center}
.thm .hd{text-align:center;padding-bottom:9px;border-bottom:1px dashed #B9B0A0}
.thm .hd b{font-size:14px;display:block;font-family:var(--ui);font-weight:800}
.thm .hd span{font-size:9.5px;color:#6B6455}
.thm .r{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.thm .r span{color:#6B6455}
.thm .sc{padding:9px 0;border-bottom:1px dashed #B9B0A0}
.thm .gt{display:flex;justify-content:space-between;padding:9px 0 0;font-weight:700;font-size:13px;border-top:1px solid #8C8474;margin-top:8px}
.thm .st{margin-top:12px;text-align:center;font-weight:700;letter-spacing:.14em;padding:7px;border:2px solid var(--green);color:#0A6E4C;border-radius:5px}
.thm .ft{text-align:center;font-size:9px;color:#6B6455;margin-top:11px;line-height:1.5}
.dact{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:13px}
.dact button{padding:11px 6px;border-radius:var(--r-s);font-size:11.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:5px;border:1px solid var(--line2);background:#fff}
.dact svg{width:16px;height:16px}
.wsel{display:flex;gap:6px;justify-content:center;margin-bottom:11px}
.wsel button{padding:5px 12px;border-radius:var(--pill);font-size:11px;font-weight:800;border:1px solid var(--line2);background:#fff;color:var(--mut)}
.wsel button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.note{background:var(--blue-lo);border-left:3px solid var(--blue);border-radius:0 var(--r-s) var(--r-s) 0;padding:11px 13px;font-size:12.5px;color:#1A3A8F;line-height:1.55}
.warn{background:var(--amber-lo);border-left:3px solid var(--amber);border-radius:0 var(--r-s) var(--r-s) 0;padding:11px 13px;font-size:12.5px;color:#7A4A08;line-height:1.55}
.okbox{background:var(--green-lo);border:1px solid #A7E3CB;border-radius:var(--r);padding:13px;font-size:13px;color:#0A6E4C;display:flex;gap:10px;align-items:center}
.empty{text-align:center;padding:40px 20px;color:var(--dim)}
.empty b{display:block;font-size:15px;color:var(--mut);margin-bottom:5px}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);z-index:200;display:grid;place-items:end center;padding:0}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:404px;max-height:86vh;overflow-y:auto;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet h3{font-size:17px;margin-bottom:5px}
.grip{width:38px;height:4px;background:var(--line2);border-radius:2px;margin:0 auto 14px}

.sd{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);padding:17px;box-shadow:var(--sh)}
.sd h3{font-size:15px;margin-bottom:7px}
.sd p{font-size:12.5px;color:var(--mut);line-height:1.6}
.sd .lk{display:block;margin-top:10px;padding:9px 12px;background:var(--s2);border:1px solid var(--line);border-radius:var(--r-s);font-size:12.5px;font-weight:700}
.sd .lk:hover{border-color:var(--blue);color:var(--blue)}
.modlist{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.modlist span{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:var(--pill);background:var(--green-lo);color:var(--green)}

.prog{height:7px;background:var(--s3);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.spark{display:flex;align-items:flex-end;gap:3px;height:52px;margin-top:10px}
.spark i{flex:1;background:var(--blue-lo);border-radius:2px 2px 0 0;position:relative}
.spark i.hi{background:var(--blue)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>

<div id="app"></div>
<div id="modal"></div>

<script>
"use strict";
/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RM=n=>"RM "+Math.round(n).toLocaleString("en-MY");
const RM2=n=>"RM "+Number(n).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});
const ini=n=>n.split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase();
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(77001122); const pick=a=>a[Math.floor(R()*a.length)]; const bt=(a,b)=>a+Math.floor(R()*(b-a+1));
const DAY=864e5, TODAY=new Date(2026,7,24);
const ago=n=>new Date(TODAY.getTime()-n*DAY);
const fd=d=>d.toLocaleDateString("en-MY",{day:"2-digit",month:"short",year:"numeric"});
const fds=d=>d.toLocaleDateString("en-MY",{day:"2-digit",month:"short"});
const ft=d=>d.toLocaleTimeString("en-MY",{hour:"2-digit",minute:"2-digit",hour12:false});
const dbet=(a,b)=>Math.round((b-a)/DAY);
const sameDay=(a,b)=>a&&new Date(a).toDateString()===new Date(b).toDateString();

const I={
  home:'<path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-7h6v7"/>',
  user:'<circle cx="12" cy="8" r="3.6"/><path d="M4.5 21c0-4 3.4-6.5 7.5-6.5S19.5 17 19.5 21"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>',
  cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.4 12.4a2 2 0 002 1.6h8.7a2 2 0 002-1.6L22 7H6"/>',
  more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
  doc:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/>',
  truck:'<rect x="1" y="6" width="14" height="11" rx="1.5"/><path d="M15 9h4l3 3.5V17h-7z"/><circle cx="6" cy="19" r="1.8"/><circle cx="18" cy="19" r="1.8"/>',
  cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/>',
  ret:'<path d="M3 10h12a5 5 0 010 10h-6"/><path d="M7 6l-4 4 4 4"/>',
  box:'<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/>',
  rank:'<path d="M4 20v-6M12 20V5M20 20v-9"/>',
  gift:'<rect x="3" y="9" width="18" height="12" rx="1.5"/><path d="M3 13h18M12 9v12"/><path d="M12 9S9 3 6.5 5s2 4 5.5 4c3.5 0 8-2 5.5-4S12 9 12 9z"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1116 0z"/><circle cx="12" cy="10" r="2.5"/>',
  wa:'<path d="M20 12a8 8 0 01-11.9 7L4 20l1.1-4A8 8 0 1120 12z"/>',
  srch:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  prn:'<path d="M6 9V3h12v6"/><rect x="4" y="9" width="16" height="8" rx="1.5"/><path d="M7 17h10v5H7z"/>',
  pdf:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M9 15h6"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>'
};
const ic=(p,c)=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c||'currentColor'}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

/* ---------- DATA ---------- */
const CO={name:"Syarikat Maju Jaya Sdn Bhd",trade:"Retail Distribution",ssm:"202201009876 (1456789-T)",
  addr:"No 12, Jalan Perindustrian 3, 40150 Shah Alam, Selangor",phone:"03-5521 8890"};
const ME={id:"u1",name:"Ahmad Zaki",code:"SM01",phone:"012-345 6789",withStock:true};

const SALESMEN=[["u1","Ahmad Zaki"],["u2","Faiz Rahman"],["u3","Aril Hakim"],["u4","Hafiz Omar"],["u5","Siti Nurhaliza"]]
  .map(([id,name],i)=>({id,name,code:"SM0"+(i+1)}));

const PRODUCTS=[
  ["Milo 1kg","MLO-1K",18.00,220],["Nescafe 200g","NES-200",14.60,180],
  ["Biskut Cream 400g","BIS-C400",7.50,300],["Air Mineral 1.5L","AIR-15",1.60,480],
  ["Minyak Masak 5kg","MYK-5K",42.00,95],["Beras Wangi 10kg","BRS-10",38.00,60],
  ["Gula Halus 1kg","GUL-1K",3.20,400],["Susu Tin 390g","SUS-390",4.80,260]
].map(([name,sku,price,stock],i)=>({id:"p"+(i+1),name,sku,price,floor:+(price*0.85).toFixed(2),van:stock,low:40}));

/* build a full chain: order -> DO -> SO -> invoice (-> payment) */
function mkChain(c,date,lines,salesmanId,payNow){
  const total=lines.reduce((a,l)=>a+l.qty*l.price,0);
  const o={id:nn("ORD",++DB.seq.ORD),customerId:c.id,salesmanId,date,lines,total,remark:""};
  DB.orders.push(o);
  const d={id:nn("DO",++DB.seq.DO),orderId:o.id,customerId:c.id,salesmanId,date,lines,total};
  DB.dos.push(d);
  const s={id:nn("SO",++DB.seq.SO),doId:d.id,orderId:o.id,customerId:c.id,salesmanId,date,lines,total};
  DB.sos.push(s);
  const due=new Date(date.getTime()+(c.term==="cash"?0:c.months*30)*DAY);
  const inv={id:nn("INV",++DB.seq.INV),soId:s.id,doId:d.id,orderId:o.id,customerId:c.id,salesmanId,
    date,due,total,paid:0,status:"pending",kind:c.term};
  DB.invoices.push(inv);
  if(payNow) payInvoice(inv,total,"Cash",date);
  return {o,d,s,inv};
}
function payInvoice(inv,amt,method,date){
  inv.paid+=amt;
  inv.status = inv.paid>=inv.total-0.01?"paid":"partial";
  const p={id:"PAY"+String(DB.payments.length+1).padStart(4,"0"),invoiceId:inv.id,customerId:inv.customerId,
    amount:amt,method,date,salesmanId:inv.salesmanId};
  DB.payments.push(p);
  const r={id:nn("REC",++DB.seq.REC),paymentId:p.id,invoiceId:inv.id,customerId:inv.customerId,
    amount:amt,method,date,salesmanId:inv.salesmanId};
  DB.receipts.push(r);
  return r;
}
/* seed 120 days of trading */
CUSTOMERS.forEach(c=>{
  if(c.term==="consign"){
    // consignment placements
    for(let k=3;k>=1;k--){
      const date=ago(k*30+bt(0,4));
      const p=pick(PRODUCTS), qty=bt(60,140);
      const cg={id:"CG"+(DB.consign.length+1),customerId:c.id,productId:p.id,qty,price:p.price,date,
        balance:null,checkedAt:null,sold:0,invoiceId:null,salesmanId:c.salesmanId};
      DB.consign.push(cg);
      if(k>1){ // already reconciled
        const bal=bt(10,Math.floor(qty*0.45));
        cg.balance=bal; cg.checkedAt=ago((k-1)*30); cg.sold=qty-bal;
        const {inv}=mkChain(c,cg.checkedAt,[{productId:p.id,qty:cg.sold,price:p.price}],c.salesmanId,false);
        inv.kind="consign"; cg.invoiceId=inv.id;
        if(R()<0.7) payInvoice(inv,inv.total,pick(["Cash","Bank Transfer"]),new Date(cg.checkedAt.getTime()+bt(3,20)*DAY));
      }
    }
  } else {
    const n=bt(3,6);
    for(let k=n;k>=1;k--){
      const date=ago(k*bt(14,26)+bt(0,3));
      const lines=[],used=new Set();
      for(let j=0;j<bt(2,4);j++){ const p=pick(PRODUCTS); if(used.has(p.id))continue; used.add(p.id);
        lines.push({productId:p.id,qty:bt(6,40),price:p.price}); }
      if(!lines.length) continue;
      const {inv}=mkChain(c,date,lines,c.salesmanId,c.term==="cash");
      if(c.term==="biltobil"&&R()<0.62&&!sameDay(date,TODAY))
        payInvoice(inv,inv.total,pick(["Bank Transfer","Cheque","Cash"]),new Date(date.getTime()+bt(10,50)*DAY));
    }
  }
});
/* Today's trading, so the dashboard is never empty when the app is opened
   in front of a client. Every salesman gets activity today, which also gives
   the real-time ranking something to rank. */
SALESMEN.forEach(s=>{
  const mine=CUSTOMERS.filter(c=>c.salesmanId===s.id&&c.term!=="consign");
  const pool=mine.length?mine:CUSTOMERS.filter(c=>c.term!=="consign");
  pool.slice(0,bt(2,3)).forEach(c=>{
    const lines=[],used=new Set();
    for(let j=0;j<bt(2,4);j++){ const p=pick(PRODUCTS); if(used.has(p.id))continue; used.add(p.id);
      lines.push({productId:p.id,qty:bt(8,45),price:p.price}); }
    if(!lines.length) return;
    const {inv}=mkChain(c,new Date(TODAY.getTime()+bt(9,15)*36e5),lines,s.id,c.term==="cash");
    if(c.term==="biltobil"&&R()<0.4) payInvoice(inv,inv.total,"Bank Transfer",TODAY);
  });
});

/* ---------- SELECTORS ---------- */
const S={
  myCust:()=>CUSTOMERS.filter(c=>c.salesmanId===ME.id),
  invOf:cid=>DB.invoices.filter(i=>i.customerId===cid).sort((a,b)=>b.date-a.date),
  outstanding:cid=>DB.invoices.filter(i=>(!cid||i.customerId===cid)&&i.status!=="paid").reduce((a,i)=>a+(i.total-i.paid),0),
  overdue:cid=>DB.invoices.filter(i=>(!cid||i.customerId===cid)&&i.status!=="paid"&&i.due<TODAY).reduce((a,i)=>a+(i.total-i.paid),0),
  totalSales:cid=>DB.invoices.filter(i=>!cid||i.customerId===cid).reduce((a,i)=>a+i.total,0),
  inRange:(d,r)=>{
    const t=TODAY, x=new Date(d);
    if(r==="today") return sameDay(x,t);
    if(r==="yest") return sameDay(x,ago(1));
    if(r==="week") return dbet(x,t)<7&&x<=t;
    if(r==="lweek") return dbet(x,t)>=7&&dbet(x,t)<14;
    if(r==="month") return x.getMonth()===t.getMonth()&&x.getFullYear()===t.getFullYear();
    if(r==="lmonth"){const m=new Date(t.getFullYear(),t.getMonth()-1,1);return x.getMonth()===m.getMonth()&&x.getFullYear()===m.getFullYear();}
    if(r==="year") return x.getFullYear()===t.getFullYear();
    return true;
  },
  salesIn:(r,uid)=>DB.invoices.filter(i=>S.inRange(i.date,r)&&(!uid||i.salesmanId===uid)).reduce((a,i)=>a+i.total,0),
  ordersIn:(r,uid)=>DB.orders.filter(o=>S.inRange(o.date,r)&&(!uid||o.salesmanId===uid)).length,
  qtyIn:(r,uid)=>DB.orders.filter(o=>S.inRange(o.date,r)&&(!uid||o.salesmanId===uid)).reduce((a,o)=>a+o.lines.reduce((x,l)=>x+l.qty,0),0),
  paidIn:(r,uid)=>DB.payments.filter(p=>S.inRange(p.date,r)&&(!uid||p.salesmanId===uid)).reduce((a,p)=>a+p.amount,0),
  custIn:(r,uid)=>new Set(DB.orders.filter(o=>S.inRange(o.date,r)&&(!uid||o.salesmanId===uid)).map(o=>o.customerId)).size,
  ranking:r=>SALESMEN.map(s=>({...s,sales:S.salesIn(r,s.id)})).sort((a,b)=>b.sales-a.sales),
  openConsign:cid=>DB.consign.filter(c=>c.customerId===cid&&c.balance===null),
  histOf:cid=>{
    const h=[];
    DB.orders.filter(x=>x.customerId===cid).forEach(x=>h.push({t:"Order",id:x.id,d:x.date,amt:x.total,k:"k-mut"}));
    DB.dos.filter(x=>x.customerId===cid).forEach(x=>h.push({t:"DO",id:x.id,d:x.date,amt:x.total,k:"k-blue"}));
    DB.sos.filter(x=>x.customerId===cid).forEach(x=>h.push({t:"SO",id:x.id,d:x.date,amt:x.total,k:"k-blue"}));
    DB.invoices.filter(x=>x.customerId===cid).forEach(x=>h.push({t:"Invoice",id:x.id,d:x.date,amt:x.total,k:"k-amb"}));
    DB.receipts.filter(x=>x.customerId===cid).forEach(x=>h.push({t:"Receipt",id:x.id,d:x.date,amt:x.amount,k:"k-grn"}));
    DB.returns.filter(x=>x.customerId===cid).forEach(x=>h.push({t:"Return",id:x.id,d:x.date,amt:0,k:"k-red"}));
    return h.sort((a,b)=>b.d-a.d);
  }
};

/* thermal document renderer */
function vDoc(type,id){
  let rec,lines,title,extra="";
  if(type==="DO"){rec=DB.dos.find(x=>x.id===id);title="DELIVERY ORDER";lines=rec&&rec.lines;}
  else if(type==="SO"){rec=DB.sos.find(x=>x.id===id);title="SALES ORDER";lines=rec&&rec.lines;}
  else if(type==="Invoice"){rec=DB.invoices.find(x=>x.id===id);title="INVOICE";lines=rec&&(DB.sos.find(s=>s.id===rec.soId)||{}).lines;}
  else if(type==="Receipt"){rec=DB.receipts.find(x=>x.id===id);title="PAYMENT RECEIPT";}
  else if(type==="Return"){rec=DB.returns.find(x=>x.id===id);title="RETURN NOTE";}
  else if(type==="Order"){rec=DB.orders.find(x=>x.id===id);title="ORDER";lines=rec&&rec.lines;}
  if(!rec) return vDocuments();
  const c=cust(rec.customerId);
  const w=ST.width;
  let body="";
  if(lines) body=lines.filter(l=>l.qty>0).map(l=>{const p=prod(l.productId);
    return `<div class="r"><span style="flex:1">${esc(p.name)}<br>${l.qty} x ${RM2(l.price)}</span><b>${RM2(l.qty*l.price)}</b></div>`}).join("");
  if(type==="Receipt"){const inv=DB.invoices.find(i=>i.id===rec.invoiceId);
    body=`<div class="r"><span>Invoice</span><b>${inv.id}</b></div>
      <div class="r"><span>Invoice Total</span><b>${RM2(inv.total)}</b></div>
      <div class="r"><span>Paid (${esc(rec.method)})</span><b>${RM2(rec.amount)}</b></div>
      <div class="r"><span>Baki</span><b>${RM2(inv.total-inv.paid)}</b></div>`;
    extra=`<div class="st">${inv.status==="paid"?"PAID IN FULL":"PART PAYMENT"}</div>`;}
  if(type==="Return"){const p=prod(rec.productId);
    body=`<div class="r"><span style="flex:1">${esc(p.name)}<br>Qty ${rec.qty}</span></div>
      <div class="r"><span>Sebab</span><b>${esc(rec.reason)}</b></div>`;}
  const totalLine=lines?`<div class="gt"><span>TOTAL</span><span>${RM2(rec.total)}</span></div>`:"";
  return shell(`<div class="pad">
    <div class="wsel"><button data-a="w" data-v="58" class="${w==="58"?"on":""}">58mm</button>
      <button data-a="w" data-v="80" class="${w==="80"?"on":""}">80mm</button></div>
    <div class="thm w${w}">
      <div class="hd"><b>${esc(CO.name)}</b><span>${esc(CO.addr)}<br>${esc(CO.ssm)} · ${esc(CO.phone)}</span></div>
      <div class="sc">
        <div class="r"><span>${title}</span><b>${rec.id}</b></div>
        <div class="r"><span>TARIKH</span><b>${fd(rec.date)} ${ft(rec.date)}</b></div>
        <div class="r"><span>CUSTOMER</span><b>${esc(c.code)}</b></div>
        <div class="r"><span></span><b>${esc(c.name)}</b></div>
        ${type==="Invoice"?`<div class="r"><span>TERM</span><b>${TERM[c.term].s}${c.months?" "+c.months+" BLN":""}</b></div>
          <div class="r"><span>DUE</span><b>${fd(rec.due)}</b></div>`:""}
        <div class="r"><span>SALESMAN</span><b>${esc(sm(rec.salesmanId).name)}</b></div>
      </div>
      <div class="sc">${body}</div>
      ${totalLine}${extra}
      <div class="ft">Terima kasih.<br>Dokumen dijana oleh Salesman Apps.</div>
    </div>
    <div class="dact">
      <button data-a="pdf">${ic(I.pdf)}PDF</button>
      <button data-a="wa-doc" data-id="${rec.id}" data-c="${c.id}">${ic(I.wa)}WhatsApp</button>
      <button data-a="print">${ic(I.prn)}Print</button>
    </div>
    <div class="note" style="margin-top:12px">Direct print ke thermal printer <b>58mm</b> atau <b>80mm</b>. Tiada A4/A5.</div>
    ${type==="Invoice"&&rec.status!=="paid"?`<a class="btn btn-g btn-w" style="margin-top:12px" href="#/payment/${c.id}/${rec.id}">Record Payment</a>`:""}
  </div>`,"more",bar(title,rec.id,"#/customer/"+c.id));
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  if(el.dataset.a==="close"&&e.target.closest("[data-stop]")&&e.target.dataset.a!=="close") return;
  if(el.tagName!=="INPUT"&&el.tagName!=="SELECT"&&el.tagName!=="TEXTAREA"){
    // Links keep their navigation. A link may also carry data-a="close" so the
    // sheet dismisses on the way out — preventing default there would swallow
    // the href and strand the user on the modal.
    if(el.tagName!=="A") e.preventDefault();
    A[el.dataset.a]&&A[el.dataset.a](el);
  }
});
document.addEventListener("input",e=>{
  const el=e.target.closest('[data-a="price"],[data-a="q"],[data-a="bal"]');
  if(el) A[el.dataset.a](el);
});

        <div style="font-size:12.5px;margin-top:5px">${esc(c.addr)}, ${esc(c.pos)} ${esc(c.dist)}</div></div></div>
    <a class="btn btn-p btn-w" href="https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}" target="_blank" rel="noopener">${ic(I.pin)} Buka Google Maps</a>
    <div class="note" style="margin-top:12px">Lokasi GPS disimpan semasa registration, jadi salesman lain boleh terus cari outlet ini.</div>
  </div>`,"cust",bar("Navigate",c.code,"#/customer/"+id));
}
function vWa(id){const c=cust(id);
  return shell(`<div class="pad">
    <div style="background:#ECE5DD;border-radius:var(--r);padding:15px;margin-bottom:13px">
      <div style="background:#D9FDD3;border-radius:9px 9px 2px 9px;padding:11px 13px;font-size:13px;line-height:1.55;margin-left:auto;max-width:88%">
        Salam ${esc(c.pic.split(" ")[0])}, saya ${esc(ME.name)} dari ${esc(CO.name)}. Boleh saya singgah hari ini?
        <span style="display:block;font-size:10px;color:rgba(17,27,33,.5);text-align:right;margin-top:4px">09:41 ✓✓</span></div></div>
    <div class="f"><label>Mesej</label><textarea rows="3">Salam ${esc(c.pic.split(" ")[0])}, saya ${esc(ME.name)} dari ${esc(CO.name)}.</textarea></div>
    <a class="btn btn-g btn-w" href="https://wa.me/6${c.wa.replace(/[^0-9]/g,"")}" target="_blank" rel="noopener">${ic(I.wa)} Buka WhatsApp</a>
  </div>`,"cust",bar("WhatsApp",c.name,"#/customer/"+id));
}

/* ---------- RENDER ---------- */
function render(){
  const p=parts(); let h;
  switch(p[0]){
    case "customers": h=vCustomers(); break;
    case "customer": h=vCustomer(p[1]); break;
    case "register": h=vRegister(); break;
    case "jadual": h=vJadual(); break;
    case "order": h=vOrder(p[1]); break;
    case "consign": h=vConsign(p[1]); break;
    case "documents": h=vDocuments(); break;
    case "docs": h=vDocuments(p[1],p[2]); break;
    case "doc": h=vDoc(p[1],p[2]); break;
    case "payment": h=vPayment(p[1],p[2]); break;
    case "return": h=vReturn(p[1]); break;
    case "stock": h=vStock(); break;
    case "stockorder": h=vStockOrder(); break;
    case "ranking": h=vRanking(); break;
    case "report": h=vReport(); break;
    case "refer": h=vRefer(); break;
    case "nav": h=vNav(p[1]); break;
    case "wa": h=vWa(p[1]); break;
    case "more": h=vMore(); break;
    default: h=vHome();
  }
  $("#app").innerHTML=h;
  requestAnimationFrame(()=>document.querySelectorAll("[data-w]").forEach(i=>i.style.width=i.dataset.w));
}
render();
</script>
