/* ---------- SHARED: THERMAL DOCUMENT ---------- */
/* wa.me needs a number in international form with no punctuation. Malaysian
   numbers are written every possible way on a customer card — 012-345 6789,
   +6012 3456789, 60123456789 — so they are all reduced to the same thing.
   A placeholder like "—" has no digits and yields nothing, which is what tells
   the caller there is no number to send to. */
function waNumber(raw){
  const n=String(raw||"").replace(/\D/g,"");
  if(n.length<8) return "";
  if(n.startsWith("60")) return n;
  if(n.startsWith("0"))  return "60"+n.slice(1);
  return "60"+n;
}

/* The document as a WhatsApp message. Plain text, because that is what arrives
   readable on a shop owner's phone without them having to open anything. */
function docText(m){
  const L=[];
  L.push("*"+CO.name+"*");
  L.push(m.type.toUpperCase()+"  "+m.id);
  L.push("");
  m.rows.filter(([l])=>l!=="No").forEach(([l,v])=>L.push(l+": "+v));
  if(m.lines.length){
    L.push("");
    m.lines.forEach(l=>{ const p=prod(l.productId);
      L.push("• "+(p?p.name:"—")+"  "+l.qty+(l.price?" x "+RM2(l.price)+"  = "+RM2(l.qty*l.price):" unit")); });
  }
  if(m.amt){ L.push(""); L.push("*"+m.totalLabel+": "+RM2(m.amt)+"*"); }
  m.extra.forEach(([l,v])=>L.push(l+": "+v));
  if(m.stamp) L.push("["+m.stamp+"]");
  L.push("");
  L.push("Terima kasih atas sokongan anda.");
  return L.join("\n");
}

/* A real PDF file, drawn at the selected roll width so it prints at its true
   size. The text is drawn rather than screenshotted: the file stays a few KB,
   the figures stay selectable, and no second library is needed. */
let PDFLIB=null;
function loadPDF(){
  if(PDFLIB) return Promise.resolve(PDFLIB);
  if(self.jspdf&&self.jspdf.jsPDF) return Promise.resolve(PDFLIB=self.jspdf.jsPDF);
  return new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload=()=>{ if(self.jspdf&&self.jspdf.jsPDF) res(PDFLIB=self.jspdf.jsPDF);
                   else rej(new Error("Pustaka PDF tidak dapat dimuatkan.")); };
    s.onerror=()=>rej(new Error("Tiada sambungan untuk memuatkan pustaka PDF."));
    document.head.appendChild(s);
  });
}
async function docPDF(m){
  const jsPDF=await loadPDF();
  const W = ST.width==="58" ? 58 : 80;      /* roll width in mm */
  const PAD=4, CW=W-PAD*2, LH=4;

  /* A receipt's height depends on its own content — how many lines, how far a
     long outlet name wraps. A page cannot be resized once drawn, so the whole
     receipt is laid out twice: once on a scratch page to find where it ends,
     then on a page cut to exactly that length. On a thermal roll the
     difference is paper. */
  function layout(doc){
    let y=8;
    const line=(t,o)=>{ o=o||{};
      doc.setFontSize(o.size||7.5);
      doc.setFont("courier",o.bold?"bold":"normal");
      doc.splitTextToSize(String(t),CW).forEach(p=>{
        doc.text(p, o.center?W/2:PAD, y, o.center?{align:"center"}:undefined); y+=LH; });
    };
    const pair=(l,v)=>{ doc.setFontSize(7.5);
      doc.setFont("courier","normal"); doc.text(String(l),PAD,y);
      doc.setFont("courier","bold");   doc.text(String(v),W-PAD,y,{align:"right"});
      y+=LH; };
    const rule=()=>{ doc.setLineDashPattern([0.6,0.6],0); doc.setLineWidth(0.15);
      doc.line(PAD,y-2.4,W-PAD,y-2.4); doc.setLineDashPattern([],0); y+=1.4; };

    line(CO.name,{bold:true,size:9,center:true});
    line(CO.addr,{size:6,center:true});
    line(CO.phone+"  SSM "+CO.ssm,{size:6,center:true});
    y+=1.6; rule();
    line(m.type.toUpperCase(),{bold:true,center:true});
    y+=1.6; rule();
    m.rows.forEach(([l,v])=>pair(l,v));
    if(m.lines.length){
      y+=1.6; rule();
      m.lines.forEach(l=>{ const p=prod(l.productId);
        line(p?p.name:"—");
        pair(l.qty+(l.price?" x "+RM2(l.price):" unit"), l.price?RM2(l.qty*l.price):""); });
    }
    if(m.amt){ y+=1.6; rule();
      doc.setFontSize(9); doc.setFont("courier","bold");
      doc.text(m.totalLabel,PAD,y); doc.text(RM2(m.amt),W-PAD,y,{align:"right"}); y+=LH+1; }
    m.extra.forEach(([l,v])=>pair(l,v));
    if(m.stamp){ y+=1.4; line(m.stamp,{bold:true,center:true,size:9}); }
    y+=2.4; rule();
    line("Terima kasih atas sokongan anda.",{size:6,center:true});
    line("Dokumen dijana oleh "+CO.name,{size:6,center:true});
    line(fd(TODAY)+"  e-Invoice ready (LHDN)",{size:6,center:true});
    return y;
  }

  const H=Math.max(50,layout(new jsPDF({unit:"mm",format:[W,600]}))+6);
  const doc=new jsPDF({unit:"mm",format:[W,H],compress:true});
  layout(doc);
  doc.setProperties({title:m.type+" "+m.id, author:CO.name, subject:m.c?m.c.name:""});
  doc.save(m.type+"-"+m.id+".pdf");
}

const DOCSET={DO:"dos",SO:"sos",Invoice:"invoices",Receipt:"receipts",Return:"returns"};
function docFind(type,id){ const k=DOCSET[type]; return k?DB[k].find(x=>x.id===id):null; }

/* One description of a document, read by the receipt on screen, the PDF and the
   WhatsApp message. Three renderings of the same paperwork must not be allowed
   to disagree about what is on it, so none of them builds its own. */
function docModel(type,d){
  const c=cust(d.customerId);
  /* An invoice holds a total, not a line list — the goods are described once,
     on the SO it was raised from. The customer being charged has to see what
     for, so the lines are read back through that link rather than left off the
     one document they actually receive. A receipt reaches them the same way. */
  let own=d.lines;
  if(!own&&type==="Invoice"&&d.soId){ const so=DB.sos.find(x=>x.id===d.soId); own=so&&so.lines; }
  if(!own&&type==="Receipt"&&d.invoiceId){
    const inv=DB.invoices.find(x=>x.id===d.invoiceId);
    const so=inv&&inv.soId&&DB.sos.find(x=>x.id===inv.soId);
    own=so&&so.lines;
  }
  const lines=own||(d.productId?[{productId:d.productId,qty:d.qty,price:0}]:[]);
  const rows=[["No",d.id],[T("l.date"),fd(d.date)],[T("l.customer"),c?c.name:"—"],["Kod",c?c.code:"—"]];
  /* Show where each document came from. Under this model a document's parents
     differ by payment term, so the trail is worth printing on the paperwork. */
  if(type==="DO")      rows.push([T("l.term"),"Consignment"]);
  if(type==="SO"){     if(d.doId) rows.push(["Dari DO",d.doId]);
                       rows.push(["Invoice",d.invoiceId||"Menunggu invoice"]); }
  if(type==="Invoice"){rows.push([T("l.due"),fd(d.due)],[T("l.term"),TERM[d.kind]?TERM[d.kind].t:"—"]);
                       if(d.doId) rows.push(["Dari DO",d.doId]);
                       rows.push(["Dari SO",d.soId]); }
  if(type==="Receipt") rows.push(["Kaedah",d.method],["Invoice",d.invoiceId]);
  if(type==="Return")  rows.push(["Sebab",d.reason]);
  if(d.salesmanId)     rows.push([T("l.salesman"),sm(d.salesmanId).name]);
  const amt=d.total!=null?d.total:d.amount||0;
  const extra=[];
  if(type==="Invoice"&&d.paid>0){ extra.push(["Dibayar",RM2(d.paid)],["Baki",RM2(d.total-d.paid)]); }
  const stamp = type==="Receipt" ? "SAH / PAID"
              : (type==="Invoice"&&d.status==="paid") ? "SETTLED" : "";
  return {type,id:d.id,d,c,rows,lines,amt,extra,stamp,
    totalLabel: type==="Receipt"?"DITERIMA":"JUMLAH"};
}

/* ==========================================================================
   AI HELP 24/7 — the left bubble. Answers are read off the live data, so the
   figures it quotes always agree with whatever panel is behind it.
   ========================================================================== */
/* The suggested questions are matched on keywords, so the chip has to carry the
   keyword the matcher looks for as well as the label the reader sees. */
const CHIPS=()=>[[T("chip.sales"),"sales"],[T("chip.top"),"top"],[T("chip.od"),"overdue"],
             [T("chip.cg"),"consign"],[T("chip.quiet"),"quiet"],[T("chip.btb"),"bil"]];
function aiAnswer(q){
  const s=q.toLowerCase();
  const has=(...w)=>w.some(x=>s.includes(x));
  if(has("jualan","sales","hari ini","today","revenue"))
    return TF("q.sales",{d:T("t.today").toLowerCase(),a:`<b>${RM2(S.salesIn("today"))}</b>`,
      n:S.ordersIn("today"),m:RM2(S.salesIn("month"))});
  if(has("top","nombor satu","terbaik","best","ranking","rank")){
    const r=S.ranking(ST.mrange);
    return TF("q.rank",{r:T(RANGES.find(x=>x[0]===ST.mrange)[1]).toLowerCase(),
      a:esc(r[0].name),av:RM(r[0].sales),b:esc(r[1].name),bv:RM(r[1].sales),
      c:esc(r[2].name),cv:RM(r[2].sales)});
  }
  if(has("tertunggak","overdue","hutang","debt","outstanding","belum bayar")){
    const ag=S.ageing();
    return TF("q.debt",{o:RM2(S.outstanding()),d:RM2(S.overdue()),
      ag:ag.map(a=>`${a.l}d ${RM(a.v)}`).join(" · ")});
  }
  if(has("consign","konsain","baki"))
    return TF("q.cg",{n:S.openConsign().length});
  if(has("senyap","quiet","risk","hilang","churn")){
    const q2=AI.quiet();
    return q2.length
      ? TF("q.quiet",{n:q2.length,c:esc(q2[0].c.name),s:q2[0].since,a:q2[0].avg})
      : T("q.quiet0");
  }
  if(has("bil to bil","biltobil","term"))  return T("q.btb");
  if(has("cash","tunai"))                  return T("q.cash");
  if(has("order","pesanan","macam mana order")) return TF("q.howorder",{o:T("s.order")});
  if(has("stock","stok","van"))
    return TF("q.stock",{v:RM2(PRODUCTS.reduce((a,p)=>a+vanOf(p.id)*p.price,0)),
      n:PRODUCTS.length,l:PRODUCTS.filter(p=>vanOf(p.id)<=p.low).length});
  if(has("dokumen","document","invoice","resit","receipt","running"))
    return TF("q.docs",{n:S.docCount(),
      d:`${DB.dos.length} DO · ${DB.sos.length} SO · ${DB.invoices.length} Invoice · ${DB.receipts.length} Receipt · ${DB.returns.length} Return`});
  if(has("bahasa","language","语言"))      return T("q.lang");
  if(has("modul","module","apa boleh"))    return T("q.modules");
  if(has("ai","kecerdasan"))               return T("q.ai");
  if(has("hello","hai","hi","salam","assalam")) return T("q.hello");
  return T("q.fallback");
}

function modal(h){$("#modal").innerHTML=`<div class="mask" data-a="close"><div class="sheet" data-stop>${h}</div></div>`;}
const A={
  lang(e){setLang(e.dataset.v)},
  async login(el){
    const em=($("#lgE")||{}).value||"", pw=($("#lgP")||{}).value||"";
    /* Answer an empty form ourselves. Asking the server produces "missing
       email or phone", which is its vocabulary, not the user's. */
    if(!em.trim()||!pw){ AUTH.email=em; AUTH.err=T("lg.need"); return render(); }
    const b=$("#lgB"); if(b){b.disabled=true;b.textContent=T("lg.going")}
    /* Kept so a wrong password does not also cost the person their email. */
    AUTH.email=em;
    const ok=await signIn(em,pw);
    if(ok){ AUTH.email=""; const t=el.dataset.t; location.hash = t&&t!=="#/" ? t : "#/s/home"; render(); }
    else render();
  },
  async signout(){
    ST.userMenu=false; setDemo(false);
    /* Clear our own state first. Waiting on the auth event would leave someone
       looking signed in after their token is already gone if it never fires. */
    AUTH.session=null; AUTH.profile=null; AUTH.err="";
    try{ if(sb) await sb.auth.signOut(); }catch(_){}
    location.hash="#/"; location.reload();
  },
  /* A button that says it opens the Public panel opens the Public panel. It
     used to carry the visitor on to whichever private panel they had been
     trying to reach, and with no such target it landed them on the Salesman
     panel with a seeded salesman's name in the top bar — which reads as being
     signed in as that person. Sample mode stays on, so from the public page
     they can still walk into Management or Salesman and see the whole system;
     every one of those screens carries the Sample data badge. */
  demo(){ setDemo(true); location.hash="#/"; render(); },
  leavedemo(){ setDemo(false); ST.userMenu=false; location.hash="#/"; render(); },
  usermenu(){ST.userMenu=!ST.userMenu;render()},
  user(e){
    const v=e.dataset.v;
    ST.userMenu=false;
    ST.draft=null;              /* a half-typed order belongs to the old user */
    /* Management is a panel, not a person: the signed-in salesman is kept so
       switching back lands you where you were. */
    if(v==="mgmt"){ render(); location.hash="#/m/dash"; return; }
    setUser(v,"#/s/home");
  },
  rail(){document.body.classList.toggle("railopen")},
  range(e){ST.range=e.dataset.v;render()},
  mrange(e){ST.mrange=e.dataset.v;render()},
  rank(e){ST.rankRange=e.dataset.v;render()},
  doctab(e){ST.docTab=e.dataset.v;render()},
  hist(e){ST.histTab=e.dataset.v;render()},
  w(e){ST.width=e.dataset.v;setPaper();render()},
  q(e){ST.q=e.value;render();const i=$('[data-a="q"]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},
  mq(e){ST.mq=e.value;render();const i=$('[data-a="mq"]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},
  chat(e){
    ST.chat=e.dataset.side;
    if(e.dataset.side==="left"&&!ST.chatLog.length) ST.chatLog=[{t:aiAnswer("salam")}];
    paintChrome();
  },
  closechat(){ST.chat=null;paintChrome()},
  /* The chip shows a translated question but matches on its own keyword, so the
     matcher keeps working whichever language the reader picked. */
  ask(e){ST.chatLog.push({u:1,t:e.dataset.l||e.dataset.q},{t:aiAnswer(e.dataset.q)});paintChrome();scrollChat()},
  send(e){
    const i=$("#cin"); if(!i||!i.value.trim()) return;

  "q+"(e){const l=ST.draft.lines.find(x=>x.productId===e.dataset.p);

document.addEventListener("click",e=>{
  /* Any click that is not on the picker itself closes it. Runs before the
     action dispatch so choosing an entry still works. */
  if(ST.userMenu&&!e.target.closest(".whosw")){ ST.userMenu=false; render(); }
  const el=e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a;
  if((a==="close"||a==="closechat")&&e.target.closest("[data-stop]")&&e.target.dataset.a!==a) return;
  if(el.tagName==="INPUT"||el.tagName==="SELECT"||el.tagName==="TEXTAREA") return;
  /* A form's data-a is its SUBMIT action and belongs to the submit listener
     only. Without this, clicking anything inside a form — the input, its
     label, the padding — bubbles up to the form and runs the action with the
     fields still empty, and clicking the submit button runs it twice: once
     here and once on the real submit. */
  if(el.tagName==="FORM") return;
  // Links keep their navigation. A link may also carry data-a="close" so the
  // sheet dismisses on the way out — preventing default there would swallow
  // the href and strand the user on the modal.
  if(el.tagName!=="A") e.preventDefault();
  if(!A[a]) return;
  /* The posting actions are async. A rejected promise here would otherwise be
     swallowed, leaving the salesman looking at a screen that never changed and
     no reason why. */
  const r=A[a](el);
  if(r&&typeof r.catch==="function") r.catch(err=>postErr(err));
});
document.addEventListener("submit",e=>{
  const lg=e.target.closest('[data-a="login"]');
  if(lg){ e.preventDefault(); A.login(lg); return; }
  const el=e.target.closest('[data-a="send"]'); if(!el) return;
  e.preventDefault(); A.send(el);
});
document.addEventListener("input",e=>{
  const el=e.target.closest('[data-a="price"],[data-a="q"],[data-a="mq"],[data-a="bal"]');

addEventListener("keydown",e=>{if(e.key==="Escape"){if(ST.userMenu){ST.userMenu=false;render();return}if(ST.chat){ST.chat=null;paintChrome()}else A.close()}});

function paintChrome(){ $("#chrome").innerHTML=chrome()+chatDrawer(); }

/* @page cannot be written from a stylesheet variable, so the rule carrying the
   roll width is swapped out whenever the width changes. Without it the browser
   prints the receipt onto A4 and a 58mm layout arrives a third of the page
   wide with two thirds of it blank. */
let PAPER=null;
function setPaper(){
  if(!PAPER){ PAPER=document.createElement("style"); document.head.appendChild(PAPER); }
  const w = ST.width==="58" ? "58mm" : "80mm";
  PAPER.textContent="@media print{@page{size:"+w+" auto;margin:3mm 2mm}}";
}

   allowed to see. Row level security does the filtering, so this is the same
   query for everyone — a salesman simply gets fewer rows back. */
async function loadLive(){
  const {data:prof,error:pe}=await sb.from("profiles")
    .select("id,role,name,code,zone,phone,with_stock,active").eq("id",AUTH.session.user.id).maybeSingle();
  if(pe||!prof){ AUTH.err="No profile is linked to this account."; return false; }
  /* The auth ban stops a new sign-in; this stops a session that was already
     open from carrying on after access was revoked. */
  if(prof.active===false){ AUTH.err=T("lg.revoked"); return false; }

  const [{data:co},{data:prods},{data:custs},{data:van},{data:team}]=await Promise.all([
    sb.from("company").select("*").maybeSingle(),
    sb.from("products").select("*").eq("active",true).order("name"),
    sb.from("customers").select("*").eq("active",true).order("code"),
    sb.from("van_stock").select("salesman_id,product_id,qty"),
    sb.from("profiles").select("id,name,code,zone,phone,with_stock,role,active").eq("role","salesman").order("code")
  ]);

  AUTH.profile=prof;
  ME={id:prof.id,name:prof.name,code:prof.code||"",zone:prof.zone||"",
      phone:prof.phone||"",withStock:prof.with_stock!==false};

  if(co){ CO.name=co.name; CO.trade=co.trade; CO.ssm=co.ssm; CO.addr=co.address; CO.phone=co.phone; }

  /* Replace the seeded arrays in place: every view and selector below reads
     these same structures, so nothing downstream needs to know the difference. */
  /* The team roster has to come across too. Leaving the seeded u1..u5 in place
     meant every sm() lookup missed once outlets carried real ids, and reading
     .name off the miss took the management outlet table down. */
  SALESMEN.length=0;
  /* Revoked salesmen stay in the roster: their name is on documents already
     issued, and a document that cannot name who raised it is worse than one
     naming someone who has left. Screens that hand out new work filter them. */
  (team||[]).forEach(r=>SALESMEN.push({id:r.id,name:r.name,code:r.code||"",zone:r.zone||"",
    phone:r.phone||"",withStock:r.with_stock!==false,active:r.active!==false}));

  PRODUCTS.length=0;
  (prods||[]).forEach(r=>PRODUCTS.push({id:r.id,name:r.name,sku:r.sku,
    price:+r.price,floor:+r.floor_price,low:r.low_at}));

  CUSTOMERS.length=0;
  (custs||[]).forEach(r=>CUSTOMERS.push({id:r.id,code:r.code,name:r.name,pic:r.pic,
    phone:r.phone,wa:r.whatsapp,addr:r.address,dist:r.district,state:r.state,pos:r.postcode,
    ssm:r.ssm,type:r.outlet_type,term:r.term,months:r.term_months,
    lat:r.lat,lng:r.lng,salesmanId:r.salesman_id,regAt:new Date(r.registered_at),status:"Active"}));

  Object.keys(VAN).forEach(k=>delete VAN[k]);
  (van||[]).forEach(r=>{ VAN[r.salesman_id]=VAN[r.salesman_id]||{}; VAN[r.salesman_id][r.product_id]=r.qty; });
  VAN[ME.id]=VAN[ME.id]||{};

  await loadLedger();
  await loadEmails();
  return true;
}

/* The transaction tables, read back into the same arrays the panels already
   use. Two things make that possible without touching a single view:

   - The local id stays the running number, because that is what the screens
     print, what the document routes address, and what a person reads off a
     printed invoice. The database uuid is carried alongside as .uuid, and the
     posting functions are the only things that need it.
   - Cross-references are rewritten from uuid to running number on the way in,
     so inv.soId is still "SO000002" exactly as the seeded data had it.

   Every post re-reads this, so what is on screen is what is in the database
   rather than a local guess at it. */
async function loadLedger(){
  const [{data:dos},{data:sos},{data:lines},{data:invs},{data:pays},{data:recs},{data:rets},{data:cgs},{data:sched},{data:sreq},{data:refs}]
    = await Promise.all([
      sb.from("delivery_orders").select("*").order("issued_at"),
      sb.from("sales_orders").select("*").order("issued_at"),
      sb.from("doc_lines").select("kind,doc_id,product_id,qty,unit_price"),
      sb.from("invoices").select("*").order("issued_at"),
      sb.from("payments").select("*").order("paid_at"),
      sb.from("receipts").select("*").order("issued_at"),
      sb.from("returns").select("*").order("issued_at"),
      sb.from("consignments").select("*").order("sent_at"),
      sb.from("visit_schedule").select("*").eq("visit_on",new Date().toISOString().slice(0,10)).order("position"),
      sb.from("stock_requests").select("*").order("requested_at",{ascending:false}).limit(200),
      sb.from("referrals").select("*").order("created_at",{ascending:false}).limit(200)
    ]);

  /* Lines are fetched once for every document and bucketed here, rather than a
     query per document — a day's paperwork is one request, not ninety. */
  const byDoc={};
  (lines||[]).forEach(l=>{ (byDoc[l.doc_id]=byDoc[l.doc_id]||[])
    .push({productId:l.product_id,qty:l.qty,price:+l.unit_price}); });

  const noOf={};                                    /* uuid → running number */
  (dos||[]).forEach(r=>noOf[r.id]=r.doc_no);
  (sos||[]).forEach(r=>noOf[r.id]=r.doc_no);
  (invs||[]).forEach(r=>noOf[r.id]=r.doc_no);
  const put=(arr,rows)=>{ arr.length=0; (rows||[]).forEach(x=>arr.push(x)); };

  put(DB.dos,(dos||[]).map(r=>({id:r.doc_no,uuid:r.id,customerId:r.customer_id,
    salesmanId:r.salesman_id,date:new Date(r.issued_at),lines:byDoc[r.id]||[],total:+r.total})));

  const invBySo={};
  (invs||[]).forEach(r=>invBySo[r.so_id]=r.doc_no);
  put(DB.sos,(sos||[]).map(r=>({id:r.doc_no,uuid:r.id,doId:r.do_id?noOf[r.do_id]||null:null,
    customerId:r.customer_id,salesmanId:r.salesman_id,date:new Date(r.issued_at),
    lines:byDoc[r.id]||[],total:+r.total,invoiceId:invBySo[r.id]||null})));

  put(DB.invoices,(invs||[]).map(r=>({id:r.doc_no,uuid:r.id,soId:noOf[r.so_id]||null,
    doId:r.do_id?noOf[r.do_id]||null:null,customerId:r.customer_id,salesmanId:r.salesman_id,
    date:new Date(r.issued_at),due:new Date(r.due_at),total:+r.total,paid:+r.paid,
    status:r.status,kind:r.term})));

  put(DB.payments,(pays||[]).map(r=>({id:r.id,uuid:r.id,invoiceId:noOf[r.invoice_id]||null,
    customerId:r.customer_id,amount:+r.amount,method:r.method,
    date:new Date(r.paid_at),salesmanId:r.salesman_id})));

  put(DB.receipts,(recs||[]).map(r=>({id:r.doc_no,uuid:r.id,paymentId:r.payment_id,
    invoiceId:noOf[r.invoice_id]||null,customerId:r.customer_id,amount:+r.amount,
    method:r.method,date:new Date(r.issued_at),salesmanId:r.salesman_id})));

  put(DB.returns,(rets||[]).map(r=>({id:r.doc_no,uuid:r.id,customerId:r.customer_id,
    productId:r.product_id,qty:r.qty,reason:r.reason,remark:r.remark||"",
    date:new Date(r.issued_at),salesmanId:r.salesman_id})));

  /* A consignment keeps its uuid as its local id: it is a stock position, not a
     document, so no running number was ever issued for it. */
  put(DB.consign,(cgs||[]).map(r=>({id:r.id,uuid:r.id,customerId:r.customer_id,
    productId:r.product_id,qty:r.qty_sent,price:+r.unit_price,date:new Date(r.sent_at),
    doId:r.do_id?noOf[r.do_id]||null:null,balance:r.balance,
    checkedAt:r.checked_at?new Date(r.checked_at):null,sold:r.qty_sold||0,
    invoiceId:r.invoice_id?noOf[r.invoice_id]||null:null,salesmanId:r.salesman_id})));

  put(DB.schedule,(sched||[]).map((r,i)=>({id:r.id,customerId:r.customer_id,
    salesmanId:r.salesman_id,date:new Date(r.visit_on+"T00:00:00"),order:r.position??i,
    remark:r.remark||"",doneAt:r.done_at?new Date(r.done_at):null})));

  /* Nobody has planned a route for today, which is the normal state until the
     planning screen exists. Order the day the way the AI panel already does —
     outstanding money first — rather than showing an empty schedule. This is
     derived from live figures, not stored, so it is rebuilt on every load. */
  if(!DB.schedule.some(s=>s.salesmanId===ME.id))
    AI.route().slice(0,6).forEach((r,i)=>DB.schedule.push({
      id:"auto-"+r.c.id,customerId:r.c.id,salesmanId:ME.id,date:TODAY,order:i,
      remark:r.od>0?T("ai.od"):r.open?T("ai.chk"):"",doneAt:null,derived:true}));

  put(DB.stockReq,(sreq||[]).map(r=>({id:r.id,uuid:r.id,salesmanId:r.salesman_id,
    productId:r.product_id,qty:r.qty,issued:r.qty_issued||0,status:r.status,
    note:r.note||"",date:new Date(r.requested_at)})));

  put(DB.referrals,(refs||[]).map(r=>({id:r.id,uuid:r.id,salesmanId:r.salesman_id,
    name:r.outlet_name,phone:r.phone||"",district:r.district||"",note:r.note||"",
    status:r.status,value:+r.value,commission:+r.commission,
    customerId:r.customer_id||null,date:new Date(r.created_at)})));
}

async function authBoot(){
  if(!sb){ AUTH.ready=true; return render(); }
  const {data}=await sb.auth.getSession();
  AUTH.session=data.session||null;
  if(AUTH.session){ try{ await loadLive(); }catch(e){ AUTH.err=e.message||String(e); } }
  AUTH.ready=true;
  render();
  sb.auth.onAuthStateChange((evt,sess)=>{
    if(evt==="SIGNED_OUT"){ location.reload(); }
  });
}

/* The server's wording is written for whoever integrated it, not for a salesman
   at a counter. The two messages that actually reach a person in normal use get
   a sentence in their own language; anything unexpected is passed through
   rather than flattened, so a real fault stays diagnosable. */
function authMsg(m){
  const s=(m||"").toLowerCase();
  if(s.includes("invalid login credentials")) return T("lg.bad");
  if(s.includes("missing email")||s.includes("missing phone")) return T("lg.need");
  if(s.includes("email not confirmed")) return T("lg.unconfirmed");
  /* A salesman whose access was revoked gets told that, not the server's
     word for it. "User is banned" reads like an accusation. */
  if(s.includes("banned"))          return T("lg.revoked");
  if(s.includes("failed to fetch")||s.includes("networkerror")) return T("lg.net");
  if(s.includes("too many requests")||s.includes("rate limit")) return T("lg.rate");
  return m;
}

/* ==========================================================================
   POSTING
   ==========================================================================
   Six business events, one database function each, each one a single
   transaction. The client does not insert rows: an order is four inserts and a
   stock movement, and doing that over five requests means a van can be
   decremented for an invoice that was never written. These are money
   documents, so the event either lands completely or not at all.

   The running numbers also have to come off a shared counter rather than this
   device, or two salesmen both issue INV000042 on the same afternoon.

   post() returns the function's result, or null if it refused — in which case
   it has already told the user why. Every caller re-reads the ledger after a
   success, so the screen shows what the database holds rather than a local
   guess at it. */
const POST_MSG={
  insufficient_van_stock:  ["Stok van tidak mencukupi.","Not enough stock on the van.","车载库存不足。","Stock van enda chukup."],
  below_floor_price:       ["Harga di bawah harga minimum.","That price is below the floor price.","价格低于最低限价。","Rega baruh ari rega pemadu baruh."],
  already_billed:          ["Consignment ini sudah dibil.","This consignment has already been billed.","此寄售已开单。","Consignment tu udah dibil."],
  already_paid:            ["Invoice ini sudah dijelaskan.","This invoice is already settled.","此发票已结清。","Invois tu udah dibayar abis."],
  over_payment:            ["Jumlah melebihi baki tertunggak.","The amount is more than the outstanding balance.","金额超过未付余额。","Jumlah lebih ari baki."],
  wrong_term_for_sale:     ["Outlet consignment dibil selepas semak baki, bukan dari order.","A consignment outlet is billed after its balance check, not from an order.","寄售门店在盘点余额后开单，而非下单时。","Outlet consignment dibil udah semak baki."],
  wrong_term_for_delivery: ["Hanya outlet consignment menerima hantaran stock.","Only a consignment outlet takes a stock drop.","只有寄售门店可收寄售库存。","Semina outlet consignment nerima stock."]
};
function postErr(e){
  /* The database raises a stable detail code alongside its message, so the
     wording a person reads is ours and translated, while anything unforeseen
     still surfaces verbatim instead of being swallowed. */
  const key=(e&&(e.details||e.detail))||"";
  const t=POST_MSG[key] ? POST_MSG[key][LI()] : null;
  const body=t||(e&&e.message)||T("post.unknown");
  modal(`<h3>${T("post.failed")}</h3>
    <p style="color:var(--mut);font-size:13.5px;margin:11px 0">${esc(body)}</p>
    <button class="btn btn-p btn-w" data-a="close">OK</button>`);
  return null;
}
let POSTING=false;
async function post(fn,args){
  if(POSTING) return null;          /* a double tap must not post twice */
  POSTING=true;
  try{
    const {data,error}=await sb.rpc(fn,args);
    if(error) return postErr(error);
    await loadLedger();
    const {data:van}=await sb.from("van_stock").select("salesman_id,product_id,qty");
    Object.keys(VAN).forEach(k=>delete VAN[k]);
    (van||[]).forEach(r=>{ VAN[r.salesman_id]=VAN[r.salesman_id]||{}; VAN[r.salesman_id][r.product_id]=r.qty; });
    VAN[ME.id]=VAN[ME.id]||{};
    return data;
  }catch(e){ return postErr(e); }
  finally{ POSTING=false; }
}
/* Mark the button busy, so a slow connection looks like work in progress
   rather than a dead screen. */
function busy(sel){
  const b=typeof sel==="string"?$(sel):sel;
  if(b){ b.disabled=true; b.dataset.was=b.textContent; b.textContent=T("post.saving"); }
  return b;
}
function unbusy(b){ if(b){ b.disabled=false; if(b.dataset.was) b.textContent=b.dataset.was; } }


/* The account functions live behind an Edge Function because they need the
   service role key. supabase-js reports any non-2xx as "Edge Function returned
   a non-2xx status code" and keeps the body on the error, so the reason the
   server actually gave is read back out — otherwise every refusal, from a
   duplicate code to a weak password, would read identically. */
const ADMIN_MSG={
  management_only: ["Hanya pengurusan boleh mengurus akaun.","Only management can manage accounts.","只有管理层可以管理账户。","Semina pengurusan ulih ngurus akaun."],
  weak_password:   ["Kata laluan mesti sekurang-kurangnya 8 aksara.","The password must be at least 8 characters.","密码至少需要 8 个字符。","Kata laluan patut sekurang-kurang 8 aksara."],
  bad_email:       ["Alamat e-mel tidak sah.","That email address is not valid.","电邮地址无效。","Alamat e-mel enda ngena."],
  code_taken:      ["Kod salesman itu sudah digunakan.","That salesman code is already in use.","该业务员代码已被使用。","Kod salesman nya udah dikena."],
  no_name:         ["Nama diperlukan.","The name is required.","必须填写姓名。","Nama beguna."]
};
async function adminCall(body){
  if(!LIVE()){
    modal(`<h3>${T("u.failed")}</h3>
      <p style="color:var(--mut);font-size:13.5px;margin:11px 0">${T("lg.demobody")}</p>
      <button class="btn btn-p btn-w" data-a="close">${T("msg.ok")}</button>`);
    return null;
  }
  let data,error;
  try{ ({data,error}=await sb.functions.invoke("admin-users",{body})); }
  catch(e){ error=e; }
  if(!error && data && !data.error) return data;

  let detail=data&&data.detail, msg=data&&data.error;
  if(error&&error.context&&typeof error.context.json==="function"){
    try{ const j=await error.context.json(); msg=j.error||msg; detail=j.detail||detail; }catch(_){}
  }
  const t=ADMIN_MSG[detail] ? ADMIN_MSG[detail][LI()] : null;
  modal(`<h3>${T("u.failed")}</h3>
    <p style="color:var(--mut);font-size:13.5px;margin:11px 0">${esc(t||msg||(error&&error.message)||T("post.unknown"))}</p>
    <button class="btn btn-p btn-w" data-a="close">${T("msg.ok")}</button>`);
  return null;
}

/* Emails live in the auth record, not in profiles, so the accounts screen asks
   the same function for them. Management only; empty for everyone else. */
const USER_EMAIL={};
async function loadEmails(){
  Object.keys(USER_EMAIL).forEach(k=>delete USER_EMAIL[k]);
  if(!LIVE()||!AUTH.profile||AUTH.profile.role!=="management") return;
  try{
    const {data,error}=await sb.functions.invoke("admin-users",{body:{action:"list"}});
    if(!error&&data&&data.emails) Object.assign(USER_EMAIL,data.emails);
  }catch(_){}
}

async function signIn(email,pw){
  AUTH.err="";
  const {data,error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw});
  if(error){ AUTH.err=authMsg(error.message); return false; }
  AUTH.session=data.session;
  if(!await loadLive()){ await sb.auth.signOut(); AUTH.session=null; return false; }
  return true;
}

/* A panel that is not the public one needs a session. Not a screen hiding
   things — the database returns nothing to an anonymous caller either. */
function vLogin(target,offline){
  const form = offline ? `
    <div class="lg-err">${T("lg.offline")}</div>
    <button class="btn btn-p btn-w" onclick="location.reload()">${T("lg.retry")}</button>`
  : `
    ${AUTH.err?`<div class="lg-err">${esc(AUTH.err)}</div>`:""}
    <form data-a="login" data-t="${esc(target||"")}" novalidate>
      <div class="f"><label for="lgE">${T("lg.email")}</label>
        <input id="lgE" type="email" autocomplete="username" inputmode="email"
               autocapitalize="off" spellcheck="false"
               value="${esc(AUTH.email||"")}" placeholder="nama@syarikat.com"></div>
      <div class="f"><label for="lgP">${T("lg.pw")}</label>
        <input id="lgP" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <button class="btn btn-p btn-w" type="submit" id="lgB">${T("lg.go")}</button>
    </form>`;
  return `<div class="lgwrap"><div class="lgcard">
    <a class="brand" href="#/"><span class="mk">SP</span>
      <span>${T("app.name")}<small>${T("app.tag")}</small></span></a>
    <h1>${offline?T("lg.offtitle"):T("lg.title")}</h1>
    <p class="sub">${offline?T("lg.offsub"):T("lg.sub")}</p>
    ${form}
    <div class="lg-demo">
      <b>${T("lg.demoh")}</b>
      <span>${T("lg.demod")}</span>
      <button class="btn btn-s" data-a="demo">${T("lg.demob")}</button>
    </div>
  </div></div>`;
}

function render(){
  const p=parts();
  let h;
  const priv = p[0]==="m"||p[0]==="s";

  if(priv && !DEMO()){
    /* The library failed to load. Say so; do not quietly substitute invented
       figures for a person who believes they are looking at their own. */
    if(BACKEND_DOWN()){
      $("#app").innerHTML=vLogin(location.hash,true);
      paintChrome(); return;
    }
    /* Hold until the session is checked, so a signed-in person never sees a
       login flash on reload. */
    if(!AUTH.ready){
      $("#app").innerHTML=`<div class="lgwrap"><div class="lgcard" style="text-align:center">
        <div class="spin"></div><p class="sub" style="margin-top:14px">${T("lg.wait")}</p></div></div>`;
      return;
    }
    if(!LIVE()){
      $("#app").innerHTML=vLogin(location.hash);
      paintChrome();
      /* Land the cursor where the work is: the password, once the email is
         already filled in from a failed attempt. */
      const f=$("#lgE")&&$("#lgE").value ? $("#lgP") : $("#lgE");
      if(f) f.focus();
      return;
    }
  }

  if(p[0]==="m"){
    /* A salesman who types a management URL is sent back to his own panel.
       Cosmetic only — the database already refuses him the rows. */
    if(LIVE() && AUTH.profile.role!=="management"){ location.hash="#/s/home"; return; }
    switch(p[1]){
      case "team":    h=mTeam(); break;
      case "cust":    h=mCust(); break;
      case "customer":h=mCustomer(p[2]); break;
      case "collect": h=mCollect(); break;
      case "stock":   h=mStock(); break;
      case "docs":    h=mDocs(); break;
      case "reports": h=mReports(); break;
      case "ai":      h=mAI(); break;
      case "users":   h=mUsers(); break;
      case "doc":     h=vDoc("m",p[2],p[3]); break;
      default:        h=mDash();
    }
  } else if(p[0]==="s"){
    switch(p[1]){
      case "sched":    h=sSched(); break;
      case "cust":     h=sCust(); break;
      case "customer": h=sCustomer(p[2]); break;
      case "register": h=sRegister(); break;
      case "order":    h=sOrder(p[2]); break;
      case "consign":  h=sConsign(p[2]); break;
      case "collect":  h=sCollect(); break;
      case "docs":     h=sDocs(p[2]); break;
      case "doc":      h=vDoc("s",p[2],p[3]); break;
      case "payment":  h=sPayment(p[2],p[3]); break;
      case "return":   h=sReturn(p[2]); break;
      case "stock":    h=sStock(); break;
      case "rank":     h=sRank(); break;
      case "refer":    h=sRefer(); break;
      case "nav":      h=sNav(p[2]); break;
      case "wa":       h=sWa(p[2]); break;
      default:         h=sHome();
    }
  } else h=vPublic();
  $("#app").innerHTML=h;
  paintChrome();
  requestAnimationFrame(()=>{
    document.querySelectorAll("[data-w]").forEach(i=>i.style.width=i.dataset.w);
    document.querySelectorAll("[data-h]").forEach(i=>i.style.height=i.dataset.h);
  });
}
document.body.dataset.lang=LANG;
setPaper();
render();
authBoot();
</script>
