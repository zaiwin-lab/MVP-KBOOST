# Salesman Apps — static, nothing to build.
# Its own Netlify project, completely separate from the earlier demo at the
# repo root.
#
# Only the three client-facing pages are published. README.md stays in the
# repository for the engineer and is never served — it documents which parts
# of the demo are simulated, which is not something to leave at a guessable
# URL during a pitch.
[build]
  command = "mkdir -p _site && cp index.html proposal.html gap.html _site/"
  publish = "_site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
