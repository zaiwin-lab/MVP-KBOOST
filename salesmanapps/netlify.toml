# Sales Portal — static, nothing to build.
# Its own Netlify project, completely separate from the earlier demo at the
# repo root.
#
# Only client-facing files are published. README.md stays in the repository for
# the engineer and is never served — it documents which parts of the portal are
# simulated, which is not something to leave at a guessable URL during a pitch.
#
# The asset list is explicit rather than a wildcard copy, so adding a file to
# the repository never publishes it by accident. It must stay in step with what
# the pages reference: og.png and favicon.svg are named in the social tags,
# robots.txt and sitemap.xml are fetched by crawlers.
# The build stamp is injected here rather than typed into the source, because
# a file cannot contain its own commit hash: the hash is computed from the
# file. COMMIT_REF is set by Netlify on a git-linked build; `app/.commit` is
# written by `deploy.sh` at the moment of deploy, from the real HEAD, and is
# deliberately untracked. Either way the published page names the commit it
# was built from, which is what makes a deployed build auditable.
[build]
  command = """
    mkdir -p _site/share _site/app && \
    cp index.html playbook.html og.png favicon.svg robots.txt sitemap.xml _site/ && \
    cp share/index.html _site/share/ && \
    cp app/index.html app/sw.js app/manifest.webmanifest _site/app/ && \
    cp app/icon-192.png app/icon-512.png app/icon-maskable.png _site/app/ && \
    REF="${COMMIT_REF:-$(cat app/.commit 2>/dev/null)}" && \
    REF="$(printf '%s' "${REF:-unknown}" | cut -c1-7)" && \
    sed -i "s|__BUILD__|$REF · $(date -u +%Y-%m-%d)|" _site/app/index.html && \
    echo "build stamp: $REF"
  """
  publish = "_site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Long cache for the social image — it is content-addressed by the ?v= query
# the meta tags carry, so a new image means a new query string.
[[headers]]
  for = "/og.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The installable app lives under /app/. Two headers there are not cosmetic.
#
# The service worker must never be cached. If a phone holds an old sw.js, it
# keeps serving an old shell and a deploy never reaches the salesman — the one
# failure mode of an installed app that the user cannot clear themselves.
[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/app/"

# Netlify serves an unknown extension as octet-stream, and a manifest served
# that way is ignored, which means no install prompt and no home-screen icon.
[[headers]]
  for = "/app/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# The proposal page was renamed to the playbook; keep the old link alive.
[[redirects]]
  from = "/proposal.html"
  to = "/playbook.html"
  status = 301
