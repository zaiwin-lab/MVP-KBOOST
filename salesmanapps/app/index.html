/* ===========================================================================
   Permohonan Saya — the other half of the approval loop
   ===========================================================================
   Four things a salesman does are decided by somebody else: a price change
   (Mohon), a credit note, a stock request, and the money he collects. Until
   now the answer went only to the office and he had to telephone to find out.
   This is one list of all four, because a salesman wondering "did that go
   through?" does not think in terms of which table it was in.

   A payment appears here only while it is waiting or if it was rejected. An
   approved payment is not news — the invoice reads Paid, which is what he
   wanted — and listing every one of them would bury the three kinds of
   request that genuinely need an answer. */

const RQSTAT = {
  pending:  ["Menunggu",   "part"],
  approved: ["Diluluskan", "paid"],
  issued:   ["Diluluskan", "paid"],
  rejected: ["Ditolak",    "unpaid"],
};

function myRequests() {
  const me = (S.me || {}).id;
  const out = [];

  DB.priceReqs.filter(r => r.salesman_id === me).forEach(r => {
    const c = custOf(r.customer_id);
    out.push({ kind: "Tukar Harga", status: r.status,
      at: r.requested_at, decided: r.decided_at,
      code: c ? rcode(c) : "", who: c ? c.name : "—",
      sub: prodOf(r.product_id).name,
      /* Struck through, as on the office's own screen: two prices stacked
         without it do not say which one he is asking for. */
      amt: `<s style="color:var(--dim);font-weight:400">${RM(r.old_price)}</s><br>${RM(r.new_price)}`,
      mine: r.note, reply: r.decide_note,
      act: c ? ["cust", c.id] : null });
  });

  DB.creditNotes.filter(r => r.salesman_id === me).forEach(r => {
    const c = custOf(r.customer_id), inv = DB.invoices.find(v => v.id === r.invoice_id);
    out.push({ kind: "Credit Note", status: r.status,
      at: r.requested_at, decided: r.decided_at,
      code: c ? rcode(c) : "", who: c ? c.name : "—",
      sub: [inv ? inv.doc_no : "", r.doc_no, r.reason].filter(Boolean).join(" · "),
      amt: RM(r.amount),
      mine: r.note, reply: r.decide_note,
      act: inv ? ["order", inv.id] : null });
  });

  DB.reqs.filter(r => r.salesman_id === me).forEach(r => {
    const p = prodOf(r.product_id);
    /* The warehouse may issue fewer than were asked for, and that difference
       is the whole answer — so it is shown rather than just the figure. */
    const short = r.status === "issued" && r.qty_issued != null && r.qty_issued !== r.qty;
    out.push({ kind: "Request Stok", status: r.status,
      at: r.requested_at, decided: r.decided_at,
      code: p.sku, who: p.name,
      sub: short ? `Diminta ${N(r.qty)}, dikeluarkan ${N(r.qty_issued)}` : "",
      amt: N(short ? r.qty_issued : r.qty),
      mine: r.note, reply: r.decide_note, act: null });
  });

  DB.payments.filter(p => p.salesman_id === me && (p.rejected_at || !p.approved_at))
    .forEach(p => {
      const c = custOf(p.customer_id), inv = DB.invoices.find(v => v.id === p.invoice_id);
      out.push({ kind: "Bayaran", status: p.rejected_at ? "rejected" : "pending",
        at: p.paid_at, decided: p.rejected_at,
        code: c ? rcode(c) : "", who: c ? c.name : "—",
        sub: [inv ? inv.doc_no : "", METH[p.method] || p.method].filter(Boolean).join(" · "),
        amt: RM(p.amount),
        mine: null, reply: p.reject_note,
        act: inv ? ["order", inv.id] : null });
    });

  /* Newest movement first: a request answered this morning belongs above one
     raised last week and still waiting. */
  return out.sort((a, b) => new Date(b.decided || b.at) - new Date(a.decided || a.at));
}

/* `S.seenAt` is a snapshot taken when the screen opens, not the live value.
   Opening the screen is what marks everything read, and if the flags were
   measured against the live value they would vanish in the same frame that
   showed them. The bell's count uses the live value, so that does clear. */
const unseen = r => !!(r.decided && S.seenAt && new Date(r.decided) > new Date(S.seenAt));
const alertCount = () => {
  /* A profile restored from the offline cache may predate this column. No
     stamp means "assume seen" — a badge that cannot be cleared is worse than
     no badge. */
  if (!S.me || isMgmt() || !S.loaded || !S.me.alerts_seen_at) return 0;
  const seen = new Date(S.me.alerts_seen_at);
  return myRequests().filter(r => r.decided && new Date(r.decided) > seen).length;
};

function vRequests() {
  const all = myRequests();
  const waiting = all.filter(r => r.status === "pending").length;
  const f = S.rqf || "all";

                            data-a="${r.act[0]}" data-id="${r.act[1]}">`
                        : `<div class="row rq${unseen(r) ? " nw" : ""}">`;
      return tag + `
        <div class="rqtop"><span class="k">${esc(r.kind)}</span>
          ${unseen(r) ? `<span class="baru">Baru</span>` : ""}
          <span class="st ${cls}">${lbl}</span></div>
        <div class="main">
          <span class="who">${r.code ? `<span class="code">${esc(r.code)}</span>` : ""}
            <span class="nm">${esc(r.who)}</span>
            ${r.sub ? `<div class="rqsub">${esc(r.sub)}</div>` : ""}</span>
          <span class="amt">${r.amt}</span>
        </div>
        <div class="when">Dimohon ${esc(fDay(new Date(r.at)))}${r.decided
          ? ` · Dijawab ${esc(fDay(new Date(r.decided)))}` : ""}</div>
        ${r.mine ? `<div class="note2"><b>Nota saya:</b> ${esc(r.mine)}</div>` : ""}
        ${r.reply ? `<div class="note2 off"><b>Pejabat:</b> ${esc(r.reply)}</div>` : ""}
      ` + (r.act ? `</button>` : `</div>`);
    }).join("")}</div>`
    : `<div class="empty"><b>Tiada permohonan</b>
        <span>${f === "all"
          ? "Mohon tukar harga, credit note dan request stok akan muncul di sini."
          : "Tiada apa-apa dalam bahagian ini."}</span></div>`}
    <p class="hint">Bayaran hanya tersenarai selagi pejabat belum mengesahkannya, atau
      jika ia ditolak. Bayaran yang diluluskan tidak disenaraikan di sini kerana
      invois itu sendiri sudah bertukar kepada <b>Paid</b>.</p>
  </div>`;
}

function vNearest() {
  const me = S.here;
  const rows = DB.customers.filter(c => c.lat && c.lng).map(c => {
    let d = null;
    if (me) {
      const R = 6371, t = x => x * Math.PI / 180;
      const dLat = t(c.lat - me.lat), dLng = t(c.lng - me.lng);
      const a = Math.sin(dLat/2) ** 2 + Math.cos(t(me.lat)) * Math.cos(t(c.lat)) * Math.sin(dLng/2) ** 2;
      d = 2 * R * Math.asin(Math.sqrt(a));
    }
    return { c: c, d: d };
  }).sort((a, b) => (a.d == null ? 1 : b.d == null ? -1 : a.d - b.d));

/* Swap two stops and persist both. Positions are rewritten from 1 upward each
   time rather than nudged, so a list that has been reordered and had rows
   removed for weeks cannot drift into ties or gaps. */
async function moveStop(id, dir) {
  const rows = schedFor(S.day);
  const i = rows.findIndex(r => r.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= rows.length) return;
  const order = rows.slice();
  order[i] = rows[j]; order[j] = rows[i];
  for (let k = 0; k < order.length; k++) {
    if (order[k].position === k + 1) continue;
    const { error } = await sb.from("visit_schedule")
      .update({ position: k + 1 }).eq("id", order[k].id);
    if (error) return toast(friendly(error.message), "bad");
  }
  await loadSched();
  draw();
}

async function loadSched() {
  const { data, error } = await sb.from("visit_schedule")
    .select("*").eq("salesman_id", S.me.id).order("position");
  if (!error) DB.sched = data || [];
}

   Four of the client's screens put a request in front of somebody who is not

   his forty screenshots showed the person doing the approving. This is that

/* One path for every decision, so the four workflows cannot drift apart in how
   they report success or failure. */
async function doDecide(kind, id, yes, note, qty) {
  const btn = document.querySelector("[data-a='dogo']");
  if (btn) { btn.textContent = "Menghantar…"; btn.disabled = true; }
  let res;
  if (kind === "pay")
    res = yes ? await sb.rpc("approve_payment", { p_payment: id })
              : await sb.rpc("reject_payment", { p_payment: id, p_note: note });
  else if (kind === "price")
    res = await sb.rpc("decide_price_request",
            { p_request: id, p_approve: yes, p_note: note || null });
  else if (kind === "cn")
    res = await sb.rpc("decide_credit_note",
            { p_note_id: id, p_approve: yes, p_note: note || null });
  else if (kind === "stock") {
    const r = DB.reqs.find(x => x.id === id);
    res = yes ? await sb.rpc("issue_stock", { p_salesman: r.salesman_id, p_product: r.product_id,
                   p_qty: parseInt(qty, 10) || r.qty, p_request: id })
              /* The argument is p_reason, not p_note. PostgREST resolves an
                 overload by argument name, so the wrong one does not fall back
                 to the default — it fails to find the function at all, and
                 rejecting a stock request never worked. */
              : await sb.rpc("reject_stock_request", { p_request: id, p_reason: note });
  } else return;

  $("#over").innerHTML = "";
  if (res.error) return toast(friendly(res.error.message), "bad");
  await loadAll();
  draw();
  const d = res.data || {};
  toast(yes ? (d.doc_no ? `Diluluskan · ${d.doc_no}` : "Diluluskan.") : "Ditolak.",
        yes ? "good" : "bad");
}

/* ===========================================================================
   Sejarah Kelulusan — what the office decided
   ===========================================================================
   The queue screen shows only what is still waiting, so the moment a decision
   is made it vanishes. There was no way to check whether something had already
   been handled, no way to see who decided it, and nothing to answer "why was
   that price approved in March" six months later.

   Same four workflows as the queue, read the other way round. */
function decidedWork() {
  const out = [];
  const who = id => { const p = DB.profiles.find(x => x.id === id); return p ? p.code : ""; };

  DB.payments.filter(p => p.rejected_at).forEach(p => {
    const c = custOf(p.customer_id), inv = DB.invoices.find(v => v.id === p.invoice_id);
    out.push({ kind: "Bayaran", ok: false, at: p.rejected_at, sm: who(p.salesman_id),
      code: c ? rcode(c) : "", who: c ? c.name : "—",
      sub: [inv ? inv.doc_no : "", METH[p.method] || p.method].filter(Boolean).join(" · "),
      amt: RM(p.amount), reply: p.reject_note, act: inv ? ["order", inv.id] : null });
  });
  /* Approved payments are not listed: there are hundreds, every one of them
     routine, and they would bury the decisions that were actually judgements. */

  DB.priceReqs.filter(r => r.decided_at).forEach(r => {
    const c = custOf(r.customer_id);
    out.push({ kind: "Tukar Harga", ok: r.status === "approved", at: r.decided_at,
      sm: who(r.salesman_id), code: c ? rcode(c) : "", who: c ? c.name : "—",
      sub: prodOf(r.product_id).name, by: who(r.decided_by),
      amt: `<s style="color:var(--dim);font-weight:400">${RM(r.old_price)}</s><br>${RM(r.new_price)}`,
      reply: r.decide_note, act: c ? ["cust", c.id] : null });
  });

  DB.creditNotes.filter(r => r.decided_at).forEach(r => {
    const c = custOf(r.customer_id), inv = DB.invoices.find(v => v.id === r.invoice_id);
    out.push({ kind: "Credit Note", ok: r.status === "approved", at: r.decided_at,
      sm: who(r.salesman_id), code: c ? rcode(c) : "", who: c ? c.name : "—",
      sub: [inv ? inv.doc_no : "", r.doc_no, r.reason].filter(Boolean).join(" · "),
      by: who(r.decided_by), amt: RM(r.amount), reply: r.decide_note,
      act: inv ? ["order", inv.id] : null });
  });

  DB.reqs.filter(r => r.decided_at).forEach(r => {
    const p = prodOf(r.product_id);
    const short = r.status === "issued" && r.qty_issued != null && r.qty_issued !== r.qty;
    out.push({ kind: "Request Stok", ok: r.status === "issued", at: r.decided_at,
      sm: who(r.salesman_id), code: p.sku, who: p.name, by: who(r.decided_by),
      sub: short ? `Diminta ${N(r.qty)}, dikeluarkan ${N(r.qty_issued)}` : "",
      amt: N(short ? r.qty_issued : r.qty), reply: r.decide_note, act: null });
  });

  /* Cancelling a document is a decision the office makes too, and the one most
     worth being able to look up afterwards. */
  const voided = (rows, kind, open) => rows.filter(d => d.voided_at).forEach(d => {
    const c = custOf(d.customer_id);
    out.push({ kind: kind, ok: false, at: d.voided_at, sm: "", by: who(d.voided_by),
      code: c ? rcode(c) : "", who: c ? c.name : "—", sub: d.doc_no,
      amt: d.total != null ? RM(d.total) : N(d.qty), reply: d.void_reason,
      act: open ? open(d) : null });
  });
  voided(DB.invoices, "Invois Dibatal", d => ["order", d.id]);
  voided(DB.dos, "D/O Dibatal", d => ["dodet", d.id]);
  voided(DB.returns, "Pulangan Dibatal", null);

  return out.sort((a, b) => new Date(b.at) - new Date(a.at));
}

/* ===========================================================================
   Jadual Harian
   Built to the written requirement, which is unusually explicit about what
   this is NOT: not attendance, not visit tracking, no pending or completed
   state. It is a list of the shops a salesman means to call on, in the order
   he means to call on them. Nothing records whether he went.

   His own app contradicts that in three places (a Kerja Harian report, GPS
   route recording, a per-shop daily log), and the screen itself was never
   shared. The spec is followed here and the contradiction stays an open
   question in the report — question 32.
   =========================================================================== */
const ymd = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const dayOf = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };

function schedFor(day) {
  return DB.sched.filter(r => r.visit_on === day)
    .sort((a, b) => a.position - b.position);
}

/* Outlets worth calling on that are not yet on the list: money outstanding, or
   consignment stock sitting long enough to be worth counting. Derived, never
   stored — the salesman decides, this only saves him looking it up. */
function schedSuggest(day) {
  const on = schedFor(day).map(r => r.customer_id);
  const out = [];
  DB.customers.forEach(c => {
    if (on.indexOf(c.id) >= 0 || c.active === false) return;
    const owed = INVS().filter(v => v.customer_id === c.id && v.status !== "paid")
      .reduce((a, v) => a + (+v.total - +v.paid), 0);
    const oldest = SHELF().filter(g => g.customer_id === c.id)
      .map(g => new Date(g.sent_at)).sort((a, b) => a - b)[0];
    const days = oldest ? Math.floor((Date.now() - oldest) / 864e5) : 0;
    const due = c.term === "consign" && oldest &&
                days >= (c.service_days || 30);
    if (owed > 0.004 || due)
      out.push({ c: c, why: (c.vip ? "VIP · " : "") +
                   (due ? `Baki ${days} hari — perlu disemak` : `Hutang ${RM(owed)}`),
                 rank: (c.vip ? 0 : 2) + (due ? 1 : 2), owed: owed });
  });
  return out.sort((a, b) => a.rank - b.rank || b.owed - a.owed).slice(0, 8);
}

    </div>

/* ===========================================================================
   Dokumen — Lihat, PDF, WhatsApp, Cetak
   One description of a document, read by the screen, the PDF and the WhatsApp
   message. Three renderings of the same paperwork must not be allowed to
   disagree about what is on it, so none of them builds its own.
   =========================================================================== */
const DOC_TITLE = { DO: "Delivery Order", SO: "Sales Order", INV: "Invois",
                    REC: "Resit Bayaran", RET: "Pulangan" };

function docFind(type, id) {
  if (type === "DO")  return DB.dos.find(x => x.id === id);
  if (type === "SO")  return DB.sos.find(x => x.id === id);
  if (type === "INV") return DB.invoices.find(x => x.id === id);
  if (type === "REC") return DB.receipts.find(x => x.id === id);
  if (type === "RET") return DB.returns.find(x => x.id === id);
  return null;
}

function docModel(type, d) {
  const c = custOf(d.customer_id);
  /* An invoice holds a total, not a line list — the goods are described once,
     on the SO it was raised from. The customer being charged has to see what
     for, so the lines are read back through that link rather than left off the
     one document they actually receive. A receipt reaches them the same way. */
  let lines = linesOf(d.id);
  if (!lines.length && type === "INV" && d.so_id) lines = linesOf(d.so_id);
  if (!lines.length && type === "REC" && d.invoice_id) {
    const inv = DB.invoices.find(x => x.id === d.invoice_id);
    if (inv && inv.so_id) lines = linesOf(inv.so_id);
  }
  if (!lines.length && type === "RET" && d.product_id)
    lines = [{ product_id: d.product_id, qty: d.qty, unit_price: 0 }];

  const rows = [["No", d.doc_no], ["Tarikh", fLong(new Date(d.issued_at))],
                ["Reseller", c ? c.name : "—"], ["Kod", c ? rcode(c) : "—"]];
  if (type === "DO")  rows.push(["Terma", "Konsainan"]);
  if (type === "SO") {
    if (d.do_id) { const o = DB.dos.find(x => x.id === d.do_id); if (o) rows.push(["Dari D/O", o.doc_no]); }
    const inv = DB.invoices.find(x => x.so_id === d.id);
    rows.push(["Invois", inv ? inv.doc_no : "Menunggu invois"]);
  }
  if (type === "INV") {
    /* The buyer's TIN belongs on a B2B invoice under LHDN e-Invoicing. It is
       printed when the office has recorded one; the validation QR is not,
       because only LHDN issues that and a QR we generated ourselves would
       look like one without being one. */
    if (c && c.tin) rows.push(["TIN Pembeli", c.tin]);
    rows.push(["Tempoh", TERM[d.term] || d.term], ["Perlu Jelas", fLong(new Date(d.due_at))]);
    const so = soOf(d.so_id); if (so) rows.push(["Dari SO", so.doc_no]);
    if (d.do_id) { const o = DB.dos.find(x => x.id === d.do_id); if (o) rows.push(["Dari D/O", o.doc_no]); }
  }
  if (type === "REC") {
    rows.push(["Cara Bayaran", METH[d.method] || d.method || "—"]);
    const inv = DB.invoices.find(x => x.id === d.invoice_id);
    if (inv) rows.push(["Invois", inv.doc_no]);
  }
  if (type === "RET") rows.push(["Sebab", RETR[d.reason] || d.reason || "—"]);

  const amt = d.total != null ? +d.total : (d.amount != null ? +d.amount : 0);
  const extra = [];
  if (type === "INV" && +d.paid > 0) {
    extra.push(["Dibayar", RM(d.paid)], ["Baki", RM(+d.total - +d.paid)]);
  }
  /* Cancellation overrides every other stamp, and goes on the PDF and the
     WhatsApp text as well as the screen — those three must never disagree
     about whether a document still stands. */
  if (d.voided_at) {
    extra.push(["Dibatalkan", fLong(new Date(d.voided_at))]);
    if (d.void_reason) extra.push(["Sebab batal", d.void_reason]);
  }
  const stamp = d.voided_at ? "** DIBATALKAN **"
              : type === "REC" ? "SAH / PAID"
              : (type === "INV" && d.status === "paid") ? "SETTLED" : "";
  return { type: type, id: d.doc_no, d: d, c: c, rows: rows, lines: lines, amt: amt,
           extra: extra, stamp: stamp,
           totalLabel: type === "REC" ? "DITERIMA" : type === "DO" ? "NILAI STOK" : "JUMLAH",
           noBill: type === "DO" };
}
const METH = { tunai: "Tunai", cek: "Cek", pindahan: "Pindahan Bank", gaji: "Gaji", qr: "QR Code" };
const RETR = { damaged: "Rosak", expired: "Luput", wrong_product: "Produk salah",
               wrong_qty: "Kuantiti salah", defective: "Cacat", customer_request: "Permintaan pelanggan" };

/* The same paperwork as plain text. A web page cannot attach a file to a
   WhatsApp message — only the operating system can — so the document travels
   as text, which is what a shop owner reads off their phone anyway. */
function docText(m) {
  const L = [];
  L.push("*" + CO.name + "*");
  L.push(CO.address);
  L.push(CO.phone + "  SSM " + CO.ssm, "");
  L.push("*" + (DOC_TITLE[m.type] || m.type).toUpperCase() + "*", "");
  m.rows.forEach(([k, v]) => L.push(k + ": " + v));
  if (m.lines.length) {
    L.push("", "----------------------------");
    m.lines.forEach(l => {
      const p = prodOf(l.product_id);
      L.push(p.name);
      L.push("  " + l.qty + (l.unit_price ? " x " + RM(l.unit_price) + " = " + RM(l.qty * l.unit_price)
                                          : " unit"));
    });
    L.push("----------------------------");
  }
  if (m.amt) L.push("*" + m.totalLabel + ": " + RM(m.amt) + "*");
  m.extra.forEach(([k, v]) => L.push(k + ": " + v));
  if (m.stamp) L.push("", "*" + m.stamp + "*");
  L.push("", "Terima kasih atas sokongan anda.");
  return L.join("\n");
}

/* A real PDF file, drawn at the selected roll width so it prints at its true
   size. The text is drawn rather than screenshotted: the file stays a few KB
   and the figures stay selectable. */
let PDFLIB = null;
function loadPDF() {
  if (PDFLIB) return Promise.resolve(PDFLIB);
  if (self.jspdf && self.jspdf.jsPDF) return Promise.resolve(PDFLIB = self.jspdf.jsPDF);
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload = () => { if (self.jspdf && self.jspdf.jsPDF) res(PDFLIB = self.jspdf.jsPDF);
                       else rej(new Error("Pustaka PDF tidak dapat dimuatkan.")); };
    s.onerror = () => rej(new Error("Tiada sambungan untuk memuatkan pustaka PDF."));
    document.head.appendChild(s);
  });
}
async function docPDF(m) {
  const jsPDF = await loadPDF();
  const W = S.roll === "58" ? 58 : 80;
  const PAD = 4, CW = W - PAD * 2, LH = 4;

  /* A receipt's height depends on its own content — how many lines, how far a
     long outlet name wraps. A page cannot be resized once drawn, so the whole
     receipt is laid out twice: once on a scratch page to find where it ends,
     then on a page cut to exactly that length. On a thermal roll the
     difference is paper. */
  function layout(doc) {
    let y = 8;
    const line = (t, o) => { o = o || {};
      doc.setFontSize(o.size || 7.5);
      doc.setFont("courier", o.bold ? "bold" : "normal");
      doc.splitTextToSize(String(t), CW).forEach(p => {
        doc.text(p, o.center ? W / 2 : PAD, y, o.center ? { align: "center" } : undefined);
        y += LH; });
    };
    const pair = (l, v) => { doc.setFontSize(7.5);
      doc.setFont("courier", "normal"); doc.text(String(l), PAD, y);
      doc.setFont("courier", "bold");   doc.text(String(v), W - PAD, y, { align: "right" });
      y += LH; };
    const rule = () => { doc.setLineDashPattern([0.6, 0.6], 0); doc.setLineWidth(0.15);
      doc.line(PAD, y - 2.4, W - PAD, y - 2.4); doc.setLineDashPattern([], 0); y += 1.4; };

    line(CO.name, { bold: true, size: 9, center: true });
    line(CO.address, { size: 6, center: true });
    line(CO.phone + "  SSM " + CO.ssm, { size: 6, center: true });
    y += 1.6; rule();
    line((DOC_TITLE[m.type] || m.type).toUpperCase(), { bold: true, center: true });
    y += 1.6; rule();
    m.rows.forEach(([l, v]) => pair(l, v));
    if (m.lines.length) {
      y += 1.6; rule();
      m.lines.forEach(l => { const p = prodOf(l.product_id);
        line(p.name);
        pair(l.qty + (l.unit_price ? " x " + RM(l.unit_price) : " unit"),
             l.unit_price ? RM(l.qty * l.unit_price) : ""); });
    }
    if (m.amt) { y += 1.6; rule();
      doc.setFontSize(9); doc.setFont("courier", "bold");
      doc.text(m.totalLabel, PAD, y); doc.text(RM(m.amt), W - PAD, y, { align: "right" });
      y += LH + 1; }
    m.extra.forEach(([l, v]) => pair(l, v));
    if (m.stamp) { y += 1.4; line(m.stamp, { bold: true, center: true, size: 9 }); }
    y += 2.4; rule();
    line("Terima kasih atas sokongan anda.", { size: 6, center: true });
    line("Dokumen dijana oleh " + CO.name, { size: 6, center: true });
    return y;
  }

  const H = Math.max(50, layout(new jsPDF({ unit: "mm", format: [W, 600] })) + 6);
  const doc = new jsPDF({ unit: "mm", format: [W, H], compress: true });
  layout(doc);
  doc.setProperties({ title: m.type + " " + m.id, author: CO.name,
                      subject: m.c ? m.c.name : "" });
  doc.save(m.type + "-" + m.id + ".pdf");
}

    ${CO.ssm.indexOf("[") === 0 ? `<p class="hint">Butiran syarikat belum diisi, jadi

    <div class="g2" style="margin-top:14px">

      <button class="rowbtn g" style="margin:0" data-a="docwa" data-t="${type}" data-id="${id}">WhatsApp</button>

    <button class="rowbtn o" data-a="docprint">Cetak (${esc(S.roll)}mm)</button>

}

/* ===========================================================================

function vTakeOrder(id) {
  const c = custOf(id);

      </tr></thead><tbody>${avail.map(p => {

        /* An approved Tukar Harga is a standing price for this outlet, so it
           is what the order opens at rather than the list price. */
        const own = DB.custPrices.find(x => x.customer_id === id && x.product_id === p.id);
        const base = own ? +own.price : +p.price;
        const pr = d.price[p.id] != null ? d.price[p.id] : base.toFixed(2);
        return `<tr data-ol="${p.id}">
          <td class="pname">${esc(p.name)}
            <div style="font-size:11px;color:var(--dim);font-weight:400">
              Van ${N(van)} · Lantai ${(+p.floor_price).toFixed(2)}</div>
            ${own ? `<div style="font-size:11px;color:var(--grn-d);font-weight:600">
              Harga diluluskan</div>` : ""}</td>
          <td class="r"><input class="qin pin" type="number" step="0.01"
            min="${p.floor_price}" inputmode="decimal" data-op="${p.id}" value="${esc(pr)}"></td>
          <td class="c">${stepper(`<input class="qin" type="number" min="0" max="${van}"
            inputmode="numeric" data-oq="${p.id}" value="${d.lines[p.id] || ""}"
            placeholder="0">`)}</td>
          <td class="r" data-ot="${p.id}"></td></tr>`;
      }).join("")}</tbody></table>
      <div class="tfoot">
        <div><span>Total Kuantiti :</span><b id="ordQty">0</b></div>
        <div><span>Total :</span><b id="ordTotal">${RM(0)}</b></div>
      </div>
    </div>

    ${cash ? `<div class="f"><label>Cara Bayaran</label><div class="chips">
      ${[["tunai","Tunai"],["cek","Cek"],["pindahan","Pindahan Bank"],["gaji","Gaji"],["qr","QR Code"]]
        .map(([k,l]) => `<button data-a="ordmeth" data-v="${k}"
          class="${d.method === k ? "on" : ""}">${l}</button>`).join("")}
    </div></div>` : ""}

/* Totals are rewritten in place rather than by re-rendering, because a form
   that re-renders on every keystroke loses the caret and the phone keyboard
   with it. */
function ordRecalc() {
  let qty = 0, total = 0;
  document.querySelectorAll("[data-ol]").forEach(row => {
    const id = row.dataset.ol;
    const q = parseInt((row.querySelector("[data-oq]") || {}).value, 10) || 0;
    const p = parseFloat((row.querySelector("[data-op]") || {}).value) || 0;
    const cell = row.querySelector("[data-ot]");
    const amt = Math.round(q * p * 100) / 100;
    /* Blank, not a dash: a dash in a money column beside a − button reads as
       another control. */
    if (cell) cell.textContent = q > 0 ? RM(amt) : "";
    qty += q; total += amt;
  });
  const a = $("#ordQty"), b = $("#ordTotal");
  if (a) a.textContent = N(qty);
  if (b) b.textContent = RM(Math.round(total * 100) / 100);
}

/* ===========================================================================
   Semak Baki Stok — the consignment balance check
   The salesman counts what is left on the shelf; the system works out what
   sold and raises one bill for the visit.
   =========================================================================== */

/* Open consignment stock for one outlet, grouped by product, newest drop
   first. The order matters: the balance is assigned to the newest rows, so
   the oldest units are the ones treated as sold. */
function cgOpen(custId) {
  const rows = SHELF().filter(g => g.customer_id === custId)
    .sort((a, b) => new Date(b.sent_at) - new Date(a.sent_at));
  const by = {};
  rows.forEach(r => { (by[r.product_id] = by[r.product_id] || []).push(r); });
  return Object.keys(by).map(pid => ({
    product_id: pid,
    name: prodOf(pid).name,
    rows: by[pid],
    sent: by[pid].reduce((a, r) => a + r.qty_sent, 0),
  })).sort((a, b) => a.name.localeCompare(b.name));
}

/* The same allocation the database performs, so the figure on screen is the
   figure that gets billed. If these two ever disagree the salesman is the one
   who finds out, standing at a counter. */
function cgPlan(custId, counts) {
  const out = { lines: [], total: 0, sold: 0 };
  cgOpen(custId).forEach(g => {
    const bal = counts[g.product_id];
    if (bal == null) return;
    let left = bal;
    g.rows.forEach(r => {
      const rowBal = Math.min(r.qty_sent, left);
      left -= rowBal;
      const sold = r.qty_sent - rowBal;
      if (sold > 0) {
        out.lines.push({ name: g.name, qty: sold, price: +r.unit_price,
                         amount: Math.round(sold * r.unit_price * 100) / 100 });
        out.total += Math.round(sold * r.unit_price * 100) / 100;
        out.sold += sold;
      }
    });
  });
  out.total = Math.round(out.total * 100) / 100;
  return out;
}

function vCgCheck(id) {
  const c = custOf(id);
  if (!c) return backBar(true) + `<div class="body pad"><div class="empty"><b>Tiada rekod</b></div></div>`;

  return backBar(true) + title("Semak Baki Stok") + `

/* ===========================================================================
   Render
   =========================================================================== */
function draw() {
  let h;
  if (!sb)           h = vLogin();
  else if (!S.ready) h = `<div class="boot"><div style="text-align:center"><div class="spin"></div>
      <p style="margin-top:14px;font-size:14px;opacity:.9">Menyemak sesi…</p></div></div>`;
  else if (!S.me)    h = vLogin();
  else if (!S.loaded) h = `<div class="boot"><div style="text-align:center"><div class="spin"></div>
      <p style="margin-top:14px;font-size:14px;opacity:.9">Memuatkan data…</p></div></div>`;
  else {
    const t = cur();
    let v;
    if (!t) v = S.tab === "home" ? (isMgmt() ? vApprovals() : vHome())
            : S.tab === "reseller" ? vReseller()
            : S.tab === "stok" ? vStok() : S.tab === "gps" ? vGps() : vRanking();
    else if (t.name === "sales")     v = vSales();
    else if (t.name === "dolist")    v = vDoList();
    else if (t.name === "hutang")    v = vHutang();
    else if (t.name === "kesimpulan")v = vKesimpulan();
    else if (t.name === "order")     v = vOrder(t.id);
    else if (t.name === "dodet")     v = vDoDet(t.id);
    else if (t.name === "cust")      v = vCust(t.id, t.sub);
    else if (t.name === "stockreq")  v = vStockReq();
    else if (t.name === "reqhist")   v = vReqHist();
    else if (t.name === "requests")  v = vRequests();
    else if (t.name === "decided")   v = vDecided();
    else if (t.name === "docfind")   v = vDocFind();
    else if (t.name === "borang")    v = vBorang(t.id, t.reg);
    else if (t.name === "nearest")   v = vNearest();
    else if (t.name === "register")  v = vRegister();
    else if (t.name === "cgcheck")   v = vCgCheck(t.id);
    else if (t.name === "takeorder") v = vTakeOrder(t.id);
    else if (t.name === "doc")       v = vDoc(t.t, t.id);
    else if (t.name === "return")    v = vReturn(t.id);
    else if (t.name === "jadual")    v = vJadual();
    else if (t.name === "settings")  v = vSettings();
    else v = `<div class="body pad"><div class="empty"><b>Tiada skrin</b></div></div>`;
    h = v + tabBar();
  }
  $("#app").innerHTML = h;
  document.body.dataset.rk = (!cur() && S.tab === "ranking" && S.me && S.loaded) ? "1" : "";
  chrome();
  const q = $("#q"); if (q) { q.oninput = e => { S.q = e.target.value; redrawBody(); }; }
  /* A "Cetak" button promises the print dialog, so opening the document view
     from one goes straight there once the page has settled. */
  const t = cur();
  if (t && t.name === "doc" && t.auto) { t.auto = false; setPaper();
    setTimeout(() => window.print(), 400); }
  if (t && t.name === "borang" && t.auto) { t.auto = false; setPaper("a4");
    setTimeout(() => window.print(), 400); }
  /* A stop's remark saves when the salesman leaves the field. Re-rendering on
     every keystroke would close the keyboard mid-note. */
  document.querySelectorAll("[data-jr]").forEach(i => {
    i.onchange = async () => {
      const { error } = await sb.from("visit_schedule")
        .update({ remark: i.value.trim() || null }).eq("id", i.dataset.jr);
      if (error) return toast(friendly(error.message), "bad");
      const row = DB.sched.find(r => r.id === i.dataset.jr);
      if (row) row.remark = i.value.trim() || null;
      toast("Catatan disimpan.", "good");
    };
  });
  /* Order totals update as the salesman types, without re-rendering. */
  if (document.querySelector("[data-ol]")) {
    document.querySelectorAll("[data-oq],[data-op]").forEach(i => { i.oninput = ordRecalc; });
    ordRecalc();
  }
  /* Photographs are held as File objects with a preview URL until registration
     succeeds and there is a folder to put them in. */
  document.querySelectorAll("[data-rp]").forEach(inp => {
    inp.onchange = e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (file.size > 12 * 1024 * 1024) return toast("Gambar terlalu besar (maksimum 12MB).", "bad");
      const kind = e.target.dataset.rp;
      if (kind === "return" && S.ret) {
        if (S.ret.photo && S.ret.photo.url) URL.revokeObjectURL(S.ret.photo.url);
        retHarvest();
        S.ret.photo = { file: file, url: URL.createObjectURL(file) };
        return draw();
      }
      if (!S.reg) return;
      const old = S.reg.photos[kind];
      if (old && old.url) URL.revokeObjectURL(old.url);
      regHarvest();
      S.reg.photos[kind] = { file: file, url: URL.createObjectURL(file) };
      S.reg.err = "";          /* the complaint is answered; stop showing it */
      draw();
    };
  });
  if (!S.me && !S.busy) { const e = $("#em"); if (e) (e.value ? $("#pw") : e).focus(); }
}
/* Typing in a search box must not steal focus by re-rendering the input, so
   the list is redrawn without touching the field. */
function redrawBody() {
  const q = $("#q"), pos = q ? q.selectionStart : 0, val = q ? q.value : "";
  draw();
  const n = $("#q");
  if (n) { n.value = val; n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {} }
}

        <p style="margin:0 0 14px;font-size:13.5px;color:var(--mut)">${esc(c.name)}</p>
        <div class="f"><label for="mp">Produk</label>
          <select id="mp">${DB.products.map(p => `<option value="${p.id}"
            data-cur="${price(p)}" data-floor="${p.floor_price}">${esc(p.name)} —
            ${RM(price(p))} · lantai ${(+p.floor_price).toFixed(2)}</option>`).join("")}</select></div>
        <div class="f"><label for="mn">Harga Dipohon (RM)</label>
          <input id="mn" type="number" step="0.01" min="0.01" inputmode="decimal"
            placeholder="0.00"></div>
        <div class="f"><label for="mr">Sebab</label>
          <textarea id="mr" placeholder="Kenapa harga perlu diubah"></textarea></div>
        <p class="hint" style="margin:0 0 14px">Permohonan pergi ke pejabat. Harga sekarang

        <button class="rowbtn" style="margin:0" data-a="mohongo" data-id="${c.id}">Hantar Permohonan</button>
      </div></div></div>`;
  },
  async mohongo(el) {
    const prod = ($("#mp") || {}).value, price = parseFloat(($("#mn") || {}).value);
    const note = (($("#mr") || {}).value || "").trim();
    if (!prod) return toast("Pilih produk.", "bad");
    if (!(price > 0)) return toast("Masukkan harga yang dipohon.", "bad");
    /* The floor is enforced in the database for a price request as well as an
       order, so a request below it would be refused after the round trip. */
    const pr = DB.products.find(x => x.id === prod);
    if (pr && price < +pr.floor_price - 0.0001)
      return toast(`${pr.name}: harga lantai ${RM(pr.floor_price)}.`, "bad");
    el.textContent = "Menghantar…"; el.disabled = true;
    const { error } = await sb.rpc("request_price",
      { p_customer: el.dataset.id, p_product: prod, p_price: price, p_note: note || null });
    $("#over").innerHTML = "";
    if (error) return toast(friendly(error.message), "bad");
    await loadAll(); draw();
    toast("Permohonan harga dihantar ke pejabat.", "good");
  },
  creditnote(el) {
    const v = DB.invoices.find(x => x.id === el.dataset.id);
    if (!v) return;
    const out = Number(v.total) - Number(v.paid);
    if (out <= 0.004) return toast("Invois ini sudah dijelaskan — tiada baki untuk dikreditkan.", "bad");
    $("#over").innerHTML = `<div class="modal"><div class="mbox">
      <div class="mh"><b>Request Credit Note</b><button data-a="closeover">&times;</button></div>
      <div class="mi">
        <p style="margin:0 0 14px;font-size:13.5px;color:var(--mut)">
          ${esc(v.doc_no)} · baki ${RM(out)}</p>
        <div class="f"><label for="ca">Jumlah (RM)</label>
          <input id="ca" type="number" step="0.01" min="0.01" max="${out}"
            inputmode="decimal" placeholder="${out.toFixed(2)}"></div>
        <div class="f"><label>Sebab</label><div class="chips">
          ${["Barang rosak","Barang luput","Harga salah","Kuantiti salah","Lain-lain"]
            .map((r, i) => `<button data-a="cnreason" data-v="${esc(r)}"
              class="${i === 0 ? "on" : ""}">${r}</button>`).join("")}
        </div></div>
        <div class="f"><label for="cn">Catatan</label>
          <textarea id="cn" placeholder="Catatan"></textarea></div>
        <p class="hint" style="margin:0 0 14px">Credit note mengurangkan hutang tanpa barang
          bergerak. Pulangan barang guna skrin Pulangan.</p>
        <button class="rowbtn" style="margin:0" data-a="cngo" data-id="${v.id}">Hantar Permohonan</button>
      </div></div></div>`;
    S.cnReason = "Barang rosak";
  },
  cnreason(el) {
    S.cnReason = el.dataset.v;
    document.querySelectorAll('[data-a="cnreason"]').forEach(b =>
      b.classList.toggle("on", b.dataset.v === el.dataset.v));
  },
  async cngo(el) {
    const amt = parseFloat(($("#ca") || {}).value);
    const note = (($("#cn") || {}).value || "").trim();
    if (!(amt > 0)) return toast("Masukkan jumlah.", "bad");
    el.textContent = "Menghantar…"; el.disabled = true;
    const { error } = await sb.rpc("request_credit_note", {
      p_invoice: el.dataset.id, p_amount: amt,
      p_reason: S.cnReason || "Lain-lain", p_note: note || null });
    $("#over").innerHTML = "";
    if (error) return toast(friendly(error.message), "bad");
    await loadAll(); draw();
    toast("Permohonan credit note dihantar ke pejabat.", "good");
  },

  /* ---- jadual harian ---- */
  jadual()    { push("jadual"); },
  jadday(el)  { S.day = el.dataset.v; draw(); },
  jadcal()    { openCal(r => { S.day = ymd(r.from); draw(); }); },
  jadadd() {
    const day = S.day, on = schedFor(day).map(r => r.customer_id);
    const left = DB.customers.filter(c => on.indexOf(c.id) < 0 && c.active !== false);
    if (!left.length) return toast("Semua reseller sudah ada dalam jadual.", "bad");
    $("#over").innerHTML = `<div class="scrim" data-a="closeover"><div class="sheet">
      <div style="padding:4px 20px 10px"><b style="font-size:16px">Tambah Kedai</b></div>
      <div style="padding:0 16px 10px"><div class="srch" style="border:1px solid var(--line)">
        ${ic(I.search)}<input id="jq" type="search" placeholder="Cari nama atau kod"
          autocapitalize="off" autocomplete="off"></div></div>
      <div id="jlist">${left.map(c => `<button class="opt" data-a="jadput" data-id="${c.id}">
        <span style="min-width:0"><b style="display:block;font-size:14px">${esc(c.name)}</b>
        <span style="font-size:12px;color:var(--mut)">#${esc(rcode(c))} · ${esc(TERM[c.term] || c.term)}</span>
        </span></button>`).join("")}</div></div></div>`;
    const q = $("#jq");
    if (q) q.oninput = () => {
      const v = q.value.toLowerCase();
      document.querySelectorAll("#jlist .opt").forEach(b => {
        b.hidden = v && b.innerText.toLowerCase().indexOf(v) < 0;
      });
    };
  },
  async jadput(el) {
    const day = S.day, rows = schedFor(day);
    const { error } = await sb.from("visit_schedule").insert({
      salesman_id: S.me.id, customer_id: el.dataset.id, visit_on: day,
      position: rows.length ? rows[rows.length - 1].position + 1 : 1 });
    $("#over").innerHTML = "";
    if (error) return toast(friendly(error.message), "bad");
    await loadSched(); draw();
  },
  async jadrm(el) {
    const { error } = await sb.from("visit_schedule").delete().eq("id", el.dataset.id);
    if (error) return toast(friendly(error.message), "bad");
    await loadSched(); draw();
  },
  jadup(el) { return moveStop(el.dataset.id, -1); },
  jaddn(el) { return moveStop(el.dataset.id, 1); },

  /* ---- pulangan ---- */
  retstart(el) { S.ret = { product: "", qty: "", reason: "", remark: "", photo: null };
                 push("return", { id: el.dataset.id }); },
  retreason(el) { retHarvest(); S.ret.reason = el.dataset.v; draw(); },
  async retsubmit(el) {
    retHarvest();
    const r = S.ret, id = el.dataset.id;
    if (!r.product)              return toast("Pilih produk.", "bad");
    if (!(parseInt(r.qty, 10) > 0)) return toast("Masukkan kuantiti.", "bad");
    if (!r.reason)               return toast("Pilih sebab pulangan.", "bad");
    el.textContent = "Merekod…"; el.disabled = true;

    const { data, error } = await sb.rpc("post_return", {
      p_customer: id, p_product: r.product, p_qty: parseInt(r.qty, 10),
      p_reason: r.reason, p_remark: r.remark || null });
    if (error) { el.disabled = false; el.textContent = "Rekod Pulangan";
                 return toast(friendly(error.message), "bad"); }

    /* The return is written. A photograph that fails to upload must not undo
       it, so it is attached afterwards and only reported if it fails. */
    let warn = "";
    if (r.photo) {
      try {
        const path = await uploadPhoto(id, "return", r.photo.file);
        await sb.rpc("set_return_photo", { p_return: data.return_id, p_path: path });
      } catch (e) { warn = " Gambar gagal dimuat naik."; }
    }
    S.ret = null;
    await loadAll();
    pop();
    toast(`${data.return_no} direkod. Stok masuk semula ke van.${warn}`, warn ? "bad" : "good");
  },

  /* ---- ambil order ---- */
  takeorder(el) { S.ord = { lines: {}, price: {}, method: "tunai" };
                  push("takeorder", { id: el.dataset.id }); },
  ordmeth(el)   { ordHarvest(); S.ord.method = el.dataset.v; draw(); ordRecalc(); },
  ordcalc(el) {
    ordHarvest();
    const c = custOf(el.dataset.id), d = S.ord;
    const ids = Object.keys(d.lines);
    if (!ids.length) return toast("Masukkan sekurang-kurangnya satu kuantiti.", "bad");
    for (const id of ids) {
      const p = prodOf(id), van = DB.van[id] || 0;
      const price = parseFloat(d.price[id]);
      if (d.lines[id] > van)
        return toast(`${p.name}: van ada ${van} sahaja.`, "bad");
      if (!(price > 0))
        return toast(`${p.name}: harga tidak sah.`, "bad");
      if (price < +p.floor_price - 0.0001)
        return toast(`${p.name}: harga lantai ${RM(p.floor_price)}.`, "bad");
    }
    ordConfirm(el.dataset.id);
  },
  async ordpost(el) {
    const id = el.dataset.id, c = custOf(id), d = S.ord;
    const lines = Object.keys(d.lines).map(pid => ({
      product_id: pid, qty: d.lines[pid], price: parseFloat(d.price[pid]) }));
    el.textContent = "Menghantar…"; el.disabled = true;
    const res = c.term === "consign"
      ? await sb.rpc("post_consign_drop", { p_customer: id, p_lines: lines })
      : await sb.rpc("post_sale", { p_customer: id, p_lines: lines,
          p_pay_now: c.term === "cash", p_method: c.term === "cash" ? d.method : null });
    if (res.error) { $("#over").innerHTML = ""; return toast(friendly(res.error.message), "bad"); }
    const r = res.data || {};
    $("#over").innerHTML = "";
    S.ord = null;
    await loadAll();
    pop();
    toast(r.do_no ? `${r.do_no} · ${RM(r.total)} dihantar.`
                  : `${r.invoice_no} · ${RM(r.total)}${r.receipt_no ? " · dibayar" : ""}.`, "good");
  },

  /* ---- consignment balance check ---- */
  cgcheck(el) { S.cg = {}; push("cgcheck", { id: el.dataset.id }); },
  cgcalc() {
    const t = cur(); if (!t) return;
    S.cg = {};
    let any = false, bad = null;
    document.querySelectorAll("[data-cg]").forEach(i => {
      const v = i.value.trim();
      if (v === "") return;
      const n = parseInt(v, 10), max = +i.getAttribute("max");
      if (!(n >= 0) || n > max) { bad = bad || `Baki mesti antara 0 dan ${max}.`; return; }
      S.cg[i.dataset.cg] = n; any = true;
    });
    if (bad)  return toast(bad, "bad");
    if (!any) return toast("Masukkan baki bagi sekurang-kurangnya satu produk.", "bad");
    const plan = cgPlan(t.id, S.cg);
    if (!plan.lines.length)
      return toast("Tiada unit terjual, jadi tiada apa untuk dibilkan.", "bad");
    cgConfirm(t.id, plan);
  },
  async cgpost(el) {
    const id = el.dataset.id;
    const counts = Object.keys(S.cg).map(p => ({ product_id: p, balance: S.cg[p] }));
    el.textContent = "Menghantar…"; el.disabled = true;
    const { data, error } = await sb.rpc("post_consign_check",
      { p_customer: id, p_counts: counts });
    if (error) { $("#over").innerHTML = ""; return toast(friendly(error.message), "bad"); }
    $("#over").innerHTML = "";
    S.cg = {};
    await loadAll();
    pop();
    toast(`${data.invoice_no} · ${RM(data.total)} — ${data.sold} unit terjual.`, "good");
  },

  /* ---- registration ---- */
  regstart() { regInit(); push("register"); },
  regagain() { regInit(); draw(); scrollTo(0, 0); },
  regpick(el) { regHarvest(); S.reg.f[el.dataset.k] = el.dataset.v; draw(); },
  regoff(el) {
    regHarvest();
    const i = +el.dataset.v, a = S.reg.f.off || (S.reg.f.off = []);
    const at = a.indexOf(i); if (at >= 0) a.splice(at, 1); else a.push(i);
    draw();
  },
  regback() { regHarvest(); S.reg.err = ""; S.reg.step--; draw(); scrollTo(0, 0); },
  regnext() {
    regHarvest();
    const f = S.reg.f, st = S.reg.step;
    const miss = n => { S.reg.err = n; draw(); scrollTo(0, 0); return true; };
    if (st === 0 && !(f.name || "").trim())    return miss("Nama kedai diperlukan.");
    if (st === 1 && !(f.address || "").trim()) return miss("Alamat diperlukan.");
    if (st === 2 && !(f.pic || "").trim())     return miss("Nama penjaga diperlukan.");
    if (st === 2 && !(f.phone || "").trim())   return miss("No. telefon diperlukan.");
    if (st === 4) {
      const need = PHOTOS.filter(p => p[2] && !S.reg.photos[p[0]]);
      if (need.length) return miss("Gambar diperlukan: " + need.map(p => p[1]).join(", ") + ".");
    }
    S.reg.err = ""; S.reg.step++; draw(); scrollTo(0, 0);
  },
  reggps() {
    if (!navigator.geolocation) return toast("Peranti tidak menyokong GPS.", "bad");
    regHarvest();
    toast("Mengambil lokasi…");
    navigator.geolocation.getCurrentPosition(
      p => { S.reg.f.lat = p.coords.latitude; S.reg.f.lng = p.coords.longitude; draw(); },
      () => toast("Tidak dapat lokasi. Semak kebenaran.", "bad"),
      { enableHighAccuracy: true, timeout: 10000 });
  },
  async regsubmit() {
    regHarvest();
    const f = S.reg.f;
    if (S.reg.f.term === "consign" && !S.reg.photos.consign_form)
      { S.reg.err = "Gambar borang konsainan yang ditandatangani diperlukan."; return draw(); }
    S.reg.busy = true; S.reg.err = ""; draw();

    const lines = Object.keys(S.reg.lines).map(id => {
      const p = DB.products.find(x => x.id === id);
      return { product_id: id, qty: S.reg.lines[id], price: p ? p.price : 0 };
    });
    const months = parseInt(f.service_month, 10);
    const payload = {
      name: f.name, app_name: f.app_name, ssm_name: f.ssm_name, ssm: f.ssm,
      reseller_code: f.reseller_code, outlet_type: f.outlet_type,
      address: f.address, postcode: f.postcode, town: f.town, district: f.district,
      state: f.state, country: f.country, lat: f.lat, lng: f.lng,
      pic: f.pic, pic_ic: f.pic_ic, phone: f.phone, whatsapp: f.whatsapp,
      office_phone: f.office_phone, email: f.email,
      pic_off_days: f.off || [], pic_open_time: f.pic_open_time, pic_close_time: f.pic_close_time,
      term: f.term, term_months: f.term_months, credit_limit: f.credit_limit,
      service_days: months > 0 ? months * 30 : null,
      commission_grp: f.commission_grp, excel_grp: f.excel_grp,
      lines: lines,
      /* A cash opening order is paid on the spot, so how it was paid has to be
         recorded with it. Leaving this out made the database fall back to its
         own default and the money arrived under a method nobody chose. */
      method: f.term === "cash" ? (f.method || "tunai") : null,
    };
    const { data, error } = await sb.rpc("register_customer", { p: payload });
    if (error) { S.reg.busy = false; S.reg.err = friendly(error.message); return draw(); }

    /* The customer exists now, so the photographs have a folder to go in.
       A failed upload must not undo a real registration — it is reported and
       the photographs can be added again from the profile. */
    const failed = [];
    for (const kind of Object.keys(S.reg.photos)) {
      try { await uploadPhoto(data.customer_id, kind, S.reg.photos[kind].file); }
      catch (e) { failed.push(kind); }
    }
    const op = data.opening;
    S.reg.busy = false;
    S.reg.done = {
      id: data.customer_id, code: data.code, name: f.name,
      opening: op ? (op.do_no ? `${op.do_no} · ${RM(op.total)}`
                              : `${op.so_no || ""} ${op.invoice_no || ""} · ${RM(op.total)}`.trim())
                  : "",
      photos: failed.length ? "" : `${Object.keys(S.reg.photos).length} gambar dimuat naik.`,
      warn: failed.length
        ? `Reseller sudah didaftarkan, tetapi ${failed.length} gambar gagal dimuat naik ` +
          `(${failed.join(", ")}). Cuba muat naik semula dari Galeri.` : "",
    };
    await loadAll();
    draw(); scrollTo(0, 0);
    toast(`Reseller ${data.code} didaftarkan.`, "good");
  },

  install()  { if (!deferredInstall) return; deferredInstall.prompt();
               deferredInstall.userChoice.finally(() => { deferredInstall = null; chrome(); }); },
  noinstall(){ installDismissed = true;
               try { localStorage.setItem("sa.install", "no"); } catch (_) {} chrome(); },
  async refresh() { await loadMe(); draw(); },
  async reload()  { S.loaded = false; draw(); await loadAll(); draw(); toast("Data dimuat semula.", "good"); },
  async signout() {
    S.me = null; S.data = null; S.stack = []; S.tab = "home"; S.err = ""; S.loaded = false;
    try { localStorage.removeItem(WHO); } catch (_) {}
    try { if (sb) await sb.auth.signOut(); } catch (_) {}
    draw();
  },
  closeover() { $("#over").innerHTML = ""; },
};

/* ===========================================================================
   Overlays — bottom sheet, calendar, payment
   =========================================================================== */
function sheet(opts) {
  $("#over").innerHTML = `<div class="scrim" data-a="closeover"><div class="sheet">
    ${opts.map(([l, g, href]) => `<a class="opt" href="${esc(href)}" target="_blank"
      rel="noopener">${ic(g)}<span>${esc(l)}</span></a>`).join("")}
  </div></div>`;
}
let calFrom = null, calTo = null, calMon = null, calDone = null;
function openCal(done) {
  calFrom = S.range ? S.range.from : null; calTo = S.range ? S.range.to : null;
  calMon = new Date((calFrom || new Date()).getFullYear(), (calFrom || new Date()).getMonth(), 1);
  calDone = done; drawCal();
}
function drawCal() {
  const y = calMon.getFullYear(), m = calMon.getMonth();
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  let cells = "";
  for (let i = 0; i < first; i++) cells += `<button disabled></button>`;
  for (let d = 1; d <= days; d++) {
    const t = new Date(y, m, d).getTime();
    const a = calFrom && calFrom.getTime(), b = calTo && calTo.getTime();
    const pick = t === a || t === b;
    const mid = a && b && t > a && t < b;
    cells += `<button data-cd="${d}" class="${pick ? "pick" : mid ? "in" : ""}">${d}</button>`;
  }
  $("#over").innerHTML = `<div class="modal"><div class="mbox"><div class="mi">
    <div class="cal-h"><button data-cm="-1">&lsaquo;</button>
      <span>${MONS[m]} ${y}</span><button data-cm="1">&rsaquo;</button></div>
    <div class="cal-g">${["S","M","T","W","T","F","S"].map(d => `<span class="dow">${d}</span>`).join("")}
      ${cells}</div>
    <div class="cal-a"><button class="no" data-a="closeover">Cancel</button>
      <button class="yes" data-ok="1">Pengesahan</button></div>
  </div></div></div>`;
}

      <div class="block" style="margin-bottom:14px">
        <table class="t"><thead><tr><th>Produk</th><th class="c">Terjual</th>
          <th class="r">Harga</th><th class="r">Jumlah</th></tr></thead>

          <td class="pname">${esc(l.name)}</td><td class="c">${N(l.qty)}</td>

let payInv = null, payKind = "", payMethod = "";
function openPay(id) {
  payInv = DB.invoices.find(v => v.id === id);
  payKind = ""; payMethod = "";
  drawPay(1);
}
function drawPay(step) {
  if (!payInv) return;
  const bal = Number(payInv.total) - Number(payInv.paid);
  let inner;
  if (step === 1) {
    const kinds = [["partial", "Partial Payment"], ["paid", "Paid"], ["over", "Over Payment"]];
    inner = `<div class="pay-tot">Total Pay : <b>${RM(bal)}</b></div>
      ${kinds.map(([k, l]) => `<button class="ck ${payKind===k?"on":""}" data-pk="${k}">
        <i></i><span>${l}</span></button>`).join("")}
      ${payKind === "over" ? `<div class="err" style="margin:14px 0 0">
        Lebihan bayaran masih ditolak oleh pangkalan data. Keputusan diperlukan: lebihan
        dibawa ke bil berikutnya, atau dipulangkan? Ada dalam laporan.</div>` : ""}
      <button class="rowbtn b" data-pn="1" ${payKind && payKind !== "over" ? "" : "disabled"}>Next</button>`;
  } else {
    const ms = [["tunai","Tunai"],["cek","Cek"],["pindahan","Pindahan Bank"],
                ["gaji","Gaji"],["qr","QR Code"]];
    inner = `<div class="pay-tot">Total Pay : <b>${RM(bal)}</b></div>
      <h5>Cara Bayaran</h5>
      ${ms.map(([k, l]) => `<button class="ck ${payMethod===k?"on":""}" data-pm="${k}">
        <i></i><span>${l}</span></button>`).join("")}
      <h5>Jumlah Bayaran</h5>
      <div class="f" style="margin-bottom:6px"><input id="pamt" type="number" step="0.01" min="0.01"
        inputmode="decimal" value="${payKind === "paid" ? bal.toFixed(2) : ""}"
        placeholder="${bal.toFixed(2)}" ${payKind === "paid" ? "readonly" : ""}></div>
      <h5>Komen</h5>
      <div class="f"><textarea id="pcom" placeholder="Komen"></textarea></div>
      <button class="rowbtn g" data-pc="1">Pengesahan</button>
      <p class="hint" style="margin-top:10px">Komen belum disimpan — tiada ruangan untuk
        catatan pada jadual bayaran. Ada dalam laporan.</p>`;
  }
  $("#over").innerHTML = `<div class="modal"><div class="mbox">
    <div class="mh"><b>Pesanan Terkini</b><button data-a="closeover">&times;</button></div>
    <div class="mi">${inner}</div></div></div>`;
}
async function confirmPay() {
  const amt = parseFloat(($("#pamt") || {}).value || "0");
  const bal = Number(payInv.total) - Number(payInv.paid);
  if (!payMethod) return toast("Pilih cara bayaran.", "bad");
  if (!(amt > 0))  return toast("Masukkan jumlah bayaran.", "bad");
  if (amt > bal + 0.001) return toast("Jumlah melebihi baki. Pilih Partial atau Paid.", "bad");
  const btn = document.querySelector("[data-pc]");
  if (btn) { btn.textContent = "Menghantar…"; btn.disabled = true; }
  const { error } = await sb.rpc("post_payment",
    { p_invoice: payInv.id, p_amount: amt, p_method: payMethod });
  if (error) { drawPay(2); return toast(friendly(error.message), "bad"); }
  $("#over").innerHTML = "";
  toast("Bayaran direkod. Resit dijana.", "good");
  await loadAll();
  draw();
}
function friendly(m) {
  const s = (m || "").toLowerCase();
  if (s.includes("already settled")) return "Invois ini sudah dijelaskan.";
  if (s.includes("exceeds")) return "Jumlah melebihi baki tertunggak.";
  if (s.includes("another salesman")) return "Outlet ini dipegang salesman lain.";
  if (s.includes("failed to fetch")) return "Tiada sambungan. Semak internet anda.";
  if (s.includes("only the office")) return "Hanya pejabat boleh membuat keputusan ini.";
  if (s.includes("already been cancelled")) return "Dokumen ini sudah dibatalkan.";
  if (s.includes("final e-invoice")) return "Invois muktamad sudah dikeluarkan. Guna credit note, bukan pembatalan.";
  if (s.includes("consignment bill cannot be cancelled")) return "Bil konsainan tidak boleh dibatalkan. Guna credit note.";
  if (s.includes("approved credit note")) return "Invois ini sudah ada credit note diluluskan.";
  if (s.includes("decide the credit note")) return "Putuskan credit note pada invois ini dahulu.";
  if (s.includes("already been counted")) return "Stok daripada penghantaran ini sudah dikira dan dibilkan.";
  if (s.includes("van holds")) return "Stok ini sudah tiada dalam van, jadi pulangan itu tidak boleh ditarik balik.";
  if (s.includes("already out of the app")) return "Kedai ini sudah dikeluarkan.";
  if (s.includes("already active")) return "Kedai ini sudah aktif.";
  if (s.includes("reason is required to blacklist")) return "Beri sebab ringkas kenapa kedai ini dikeluarkan.";
  if (s.includes("a tin looks like")) return "Format TIN tidak betul. Contoh: C1234567890 — satu atau dua huruf, kemudian 9 hingga 13 digit.";
  if (s.includes("service month must be")) return "Service month mesti antara 1 dan 12 bulan.";
  if (s.includes("below the floor price")) return "Harga itu di bawah harga lantai produk ini.";

}

/* ===========================================================================
   Events
   =========================================================================== */
/* A − / + tap on a quantity field. The input's own min/max/step are the rule,
   and the synthetic `input` event is what makes the running totals, the draft
   harvesters and everything else already bound to typing fire unchanged. */
function bump(inp, dir) {
  const stp  = parseFloat(inp.getAttribute("step")) || 1;
  const lo   = inp.getAttribute("min") === null ? -Infinity : +inp.getAttribute("min");
  const hi   = inp.getAttribute("max") === null ?  Infinity : +inp.getAttribute("max");
  const had  = inp.value.trim() !== "";
  if (!had && dir < 0) return;            /* empty already means none */
  let n = Math.round(((parseFloat(inp.value) || 0) + dir * stp) * 1000) / 1000;
  if (n > hi) { n = hi; toast(`Maksimum ${N(hi)}.`, "bad"); }
  if (n < lo) n = lo;
  inp.value = String(n);
  inp.dispatchEvent(new Event("input", { bubbles: true }));
}

document.addEventListener("click", e => {
  const qs = e.target.closest("[data-qs]");
  if (qs) {
    e.preventDefault();
    const inp = qs.parentNode.querySelector("input");
    if (inp) bump(inp, +qs.dataset.qs);
    return;
  }
  /* calendar */
  const cd = e.target.closest("[data-cd]");
  if (cd) {
    const d = new Date(calMon.getFullYear(), calMon.getMonth(), +cd.dataset.cd);
    if (!calFrom || (calFrom && calTo)) { calFrom = d; calTo = null; }
    else if (d < calFrom) { calTo = calFrom; calFrom = d; }
    else calTo = d;
    return drawCal();
  }
  const cm = e.target.closest("[data-cm]");
  if (cm) { calMon = new Date(calMon.getFullYear(), calMon.getMonth() + (+cm.dataset.cm), 1);
            return drawCal(); }
  if (e.target.closest("[data-ok]")) {
    if (!calFrom) return;
    S.range = { from: calFrom, to: calTo || calFrom };
    $("#over").innerHTML = "";
    return calDone ? calDone(S.range) : draw();
  }
  /* payment */
  const pk = e.target.closest("[data-pk]");
  if (pk) { payKind = pk.dataset.pk; return drawPay(1); }
  if (e.target.closest("[data-pn]")) return drawPay(2);
  const pm = e.target.closest("[data-pm]");
  if (pm) { payMethod = pm.dataset.pm; const amt = ($("#pamt")||{}).value;
            drawPay(2); const n = $("#pamt"); if (n && amt) n.value = amt; return; }
  if (e.target.closest("[data-pc]")) { confirmPay(); return; }

  const el = e.target.closest("[data-a]");
  if (!el || el.tagName === "FORM") return;
  if (el.tagName === "A") return;                  /* real links open normally */
  e.preventDefault();
  /* a tap on the scrim closes it, a tap inside must not */
  if (el.dataset.a === "closeover" && e.target !== el &&
      !e.target.closest(".cal-a") && !e.target.closest(".mh")) {
    if (e.target.closest(".sheet") && !e.target.closest(".rowbtn")) return;
    if (e.target.closest(".mbox") && !e.target.closest(".mh")) return;
  }
  const fn = A[el.dataset.a];
  if (fn) { const r = fn(el); if (r && r.catch) r.catch(err => toast(friendly(err.message), "bad")); }
});

document.addEventListener("submit", async e => {
  const f = e.target.closest('[data-a="login"]');
  if (!f) return;
  e.preventDefault();
  const em = ($("#em") || {}).value || "", pw = ($("#pw") || {}).value || "";
  S.lastEmail = em;
  if (!em.trim() || !pw) { S.err = "Sila isi e-mel dan kata laluan."; return draw(); }
  S.busy = true; S.err = ""; draw();
  const { data, error } = await sb.auth.signInWithPassword({ email: em.trim(), password: pw });
  S.busy = false;
  if (error) { S.err = authMsg(error.message); return draw(); }
  S.email = data.user.email;
  await loadMe();
  draw();
  if (S.me) loadAll().then(draw);
});
function authMsg(m) {
  const s = (m || "").toLowerCase();
  if (s.includes("invalid login")) return "E-mel atau kata laluan salah. Cuba lagi.";
  if (s.includes("banned")) return "Akses akaun ini sudah ditarik balik. Hubungi pengurusan.";
  if (s.includes("failed to fetch")) return "Tiada sambungan. Semak internet anda.";
  return m;
}

/* ===========================================================================
   Data
   =========================================================================== */
const WHO = "sa.who";
const cacheWho = p => { try { localStorage.setItem(WHO, JSON.stringify(p)); } catch (_) {} };
const cachedWho = id => {
  try { const p = JSON.parse(localStorage.getItem(WHO) || "null");
        return p && p.id === id ? p : null; } catch (_) { return null; }
};

async function loadMe(opts) {
  opts = opts || {};
  let user = opts.session && opts.session.user;
  if (!user) {
    const { data } = await sb.auth.getUser().catch(() => ({ data: {} }));
    user = data && data.user;
  }
  if (!user) { S.me = null; return; }
  S.email = user.email;
  const { data: p, error } = await sb.from("profiles")
    .select("id,name,code,zone,role,active,alerts_seen_at").eq("id", user.id).maybeSingle();
  if (error) {
    /* A token we already hold is evidence enough to open the app. The figures
       inside stay as dashes until the signal returns, so nothing unverified is
       ever shown as fact. */
    const c = cachedWho(user.id);
    if (c) { S.me = c; S.data = null; return; }
    S.me = null; S.err = "Tiada sambungan. Semak internet anda."; return;
  }
  if (!p) { S.me = null; S.err = "Tiada profil untuk akaun ini."; return; }
  if (p.active === false) {
    S.me = null; S.err = "Akses akaun ini sudah ditarik balik.";
    try { localStorage.removeItem(WHO); } catch (_) {}
    await sb.auth.signOut(); return;
  }
  S.me = p; cacheWho(p);
}

async function loadAll() {
  if (!S.me) return;
  try {
    const [prod, cust, inv, so, d_o, lines, pay, cg, req, van, ret, rec, co, sch,
           prq, cnq, cpq, prof] = await Promise.all([
      sb.from("products").select("*").eq("active", true).order("sku"),
      sb.from("customers").select("*").order("code"),
      sb.from("invoices").select("*").order("issued_at", { ascending: false }),
      sb.from("sales_orders").select("*").order("issued_at", { ascending: false }),
      sb.from("delivery_orders").select("*").order("issued_at", { ascending: false }),
      sb.from("doc_lines").select("kind,doc_id,product_id,qty,unit_price"),
      sb.from("payments").select("*").order("paid_at", { ascending: false }),
      sb.from("consignments").select("*").order("sent_at", { ascending: false }),
      sb.from("stock_requests").select("*").order("requested_at", { ascending: false }),
      sb.from("van_stock").select("product_id,qty").eq("salesman_id", S.me.id),
      sb.from("returns").select("*").order("issued_at", { ascending: false }),
      sb.from("receipts").select("*").order("issued_at", { ascending: false }),
      sb.from("company").select("*").maybeSingle(),
      sb.from("visit_schedule").select("*").eq("salesman_id", S.me.id).order("position"),
      sb.from("price_requests").select("*").order("requested_at", { ascending: false }),
      sb.from("credit_notes").select("*").order("requested_at", { ascending: false }),
      sb.from("customer_prices").select("*"),
      /* Not filtered to salesmen any more: Sejarah Kelulusan names whoever
         made each decision, and that is someone in the office. */
      sb.from("profiles").select("id,name,code,zone,role").order("code"),
    ]);
    /* The company row and receipts are not worth failing the whole load over —
       documents degrade to placeholders, everything else still works. */
    const bad = [prod, cust, inv, so, d_o, lines, pay, cg, req, van, ret].find(r => r.error);
    if (bad) { S.loaded = true; S.data = null; return toast(friendly(bad.error.message), "bad"); }
    DB.receipts = (rec && rec.data) || [];
    DB.sched = (sch && sch.data) || [];
    DB.priceReqs   = (prq && prq.data) || [];
    DB.creditNotes = (cnq && cnq.data) || [];
    DB.custPrices  = (cpq && cpq.data) || [];
    DB.profiles    = (prof && prof.data) || [];
    if (co && co.data) CO = {
      name: co.data.name || CO.name, address: co.data.address || CO.address,
      phone: co.data.phone || CO.phone, ssm: co.data.ssm || CO.ssm };

    DB.products = prod.data || [];
    DB.customers = cust.data || [];
    DB.invoices = inv.data || [];
    DB.sos = so.data || [];
    DB.dos = d_o.data || [];
    DB.payments = pay.data || [];
    DB.consign = cg.data || [];
    DB.reqs = req.data || [];
    DB.returns = ret.data || [];
    DB.lines = {};
    (lines.data || []).forEach(l => { (DB.lines[l.doc_id] = DB.lines[l.doc_id] || []).push(l); });
    DB.van = {};
    (van.data || []).forEach(v => { DB.van[v.product_id] = v.qty; });

    const day = dOnly(new Date());
    const todayPay = PAYS().filter(p => new Date(p.paid_at) >= day);
    const todaySo  = SOS().filter(s => new Date(s.issued_at) >= day);
    S.data = {
      received: todayPay.reduce((a, p) => a + Number(p.amount), 0),
      qty: todaySo.reduce((a, s) => a + linesOf(s.id).reduce((b, l) => b + l.qty, 0), 0),
      stock: Object.values(DB.van).reduce((a, n) => a + n, 0),
    };
    S.loaded = true;
    if (S.tab === "ranking") loadRanking();
  } catch (e) {
    S.loaded = true; S.data = null;
    toast(friendly(e.message), "bad");
  }
}

async function loadRanking() {
  const now = new Date();
  let from, to;
  if (S.rkPeriod === "last") {
    from = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    to   = new Date(now.getFullYear(), now.getMonth(), 1);
  } else if (S.rkPeriod === "custom" && S.range) {
    from = S.range.from; to = new Date(S.range.to.getTime() + 864e5);
  } else {
    from = new Date(now.getFullYear(), now.getMonth(), 1);
    to   = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  }
  const { data, error } = await sb.rpc("ranking_board",
    { p_from: from.toISOString(), p_to: to.toISOString() });
  S.rkRows = error ? [] : (data || []);
  if (error) toast(friendly(error.message), "bad");
  draw();
}

/* One photograph, in three steps: ask the edge function to sign a path it has
   judged this salesman entitled to, PUT the file straight at storage, then
   record it. The file never passes through a JSON body, so a 4MB photo on a
   weak signal is one upload rather than a 5.5MB request. */
async function uploadPhoto(customerId, kind, file) {
  const { data: { session } } = await sb.auth.getSession();
  const call = body => fetch(`${SB_URL}/functions/v1/reseller-upload`, {
    method: "POST",
    headers: { "content-type": "application/json",
               authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify(body),
  }).then(async r => {
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `upload failed (${r.status})`);
    return j;
  });

  const signed = await call({ action: "sign-upload", customer_id: customerId, kind: kind,
                              content_type: file.type });
  const put = await fetch(signed.signedUrl, {
    method: "PUT",
    headers: { "content-type": file.type, "x-upsert": "true" },
    body: file,
  });
  if (!put.ok) throw new Error(`storage refused the file (${put.status})`);
  await call({ action: "record", customer_id: customerId, kind: kind, path: signed.path });
  if (S.gal) delete S.gal[customerId];
  return signed.path;
}

/* Registration photographs, fetched through the edge function that signs a
   one-hour read URL. The phone never holds a key that reaches the bucket. */
async function loadGaleri(custId) {
  S.gal = S.gal || {};
  if (S.gal[custId]) return;
  try {
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch(`${SB_URL}/functions/v1/reseller-upload`, {
      method: "POST",
      headers: { "content-type": "application/json",
                 authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ action: "list", customer_id: custId }),
    });
    const j = await r.json();
    S.gal[custId] = (j && j.files) || [];
  } catch (_) { S.gal[custId] = []; }
  draw();
}

async function boot() {
  if (!sb) { S.err = "Tidak dapat menghubungi pelayan."; S.ready = true; return draw(); }
  const { data } = await sb.auth.getSession().catch(() => ({ data: {} }));
  if (data && data.session) {
    try { await loadMe({ session: data.session }); }
    catch (e) { S.err = authMsg(e.message || String(e)); }
  }
  S.ready = true;
  draw();
  if (S.me) { await loadAll(); draw(); }
  sb.auth.onAuthStateChange(evt => { if (evt === "SIGNED_OUT") { S.me = null; S.loaded = false; draw(); } });
}

if ("serviceWorker" in navigator)
  addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));

draw();
boot();
</script>
