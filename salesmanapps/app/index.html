<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the red header run under the notch, which is what
     makes it read as an app rather than a page in a browser. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#E12B24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Salesman">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<title>Salesman App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* ---------------------------------------------------------------------------
   SALESMAN APP
   Rebuilt to the client's own design. Red, five tabs, one column.

   Layout: a fixed red header, a scrolling body, a fixed tab bar. The body is
   the only thing that moves, which is what stops a phone keyboard shoving the
   navigation up the screen.
   --------------------------------------------------------------------------- */
:root{
  --red:#E12B24; --red-d:#C21F19; --red-lo:#FDEBEA;
  --grn:#22A45D; --grn-d:#1B8A4D; --grn-lo:#E3F5EB;
  --amb:#E08A00; --amb-lo:#FDF3E2;
  --blue:#2563EB; --blue-d:#1D4FD7;
  --rank:#2F4FD8;
  --bg:#F2F3F7; --card:#FFFFFF; --inset:#F7F8FB;
  --ink:#14161C; --mut:#5A6275; --dim:#8F97A8;
  --line:#E3E6EE; --line-s:#EDEFF4;
  --r:14px; --r-s:10px;
  --sans:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --top:env(safe-area-inset-top,0px);
  --bot:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;
  line-height:1.5;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{max-width:100%}
[hidden]{display:none!important}

/* ---------- frame ---------- */
#app{min-height:100%;display:flex;flex-direction:column}
.hd{background:var(--red);color:#fff;padding:calc(var(--top) + 18px) 20px 20px;
  position:relative;flex:none}
.hd.sm{padding-bottom:16px}
.hd .salam{font-size:13.5px;opacity:.9}
.hd h1{margin:4px 0 0;font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.25;
  padding-right:92px}
.hd .acts{position:absolute;right:16px;top:calc(var(--top) + 16px);display:flex;gap:6px}
.hd .acts button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  color:#fff;position:relative}
.hd .acts button:active{background:rgba(255,255,255,.16)}
.hd .acts svg{width:21px;height:21px}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;
  background:#fff;border:2px solid var(--red)}
/* The bell used to carry a permanent dot that meant nothing. It now carries a
   count of decisions the salesman has not looked at, and nothing at all when
   there are none. */
.dot.n{top:3px;right:1px;width:auto;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:#fff;border:1.5px solid var(--red);color:var(--red);font-size:10.5px;
  font-weight:800;display:grid;place-items:center;line-height:1}

/* back bar + big red page title, as on his inner screens */
.bar{padding:calc(var(--top) + 10px) 10px 2px;display:flex;align-items:center;gap:8px;flex:none;
  background:var(--bg)}
.bar .back{display:flex;align-items:center;gap:3px;padding:8px 6px;font-size:15.5px;font-weight:600}
.bar .back svg{width:18px;height:18px}
.bar .home{margin-left:auto;background:var(--blue);color:#fff;font-size:13px;font-weight:700;
  padding:9px 14px;border-radius:8px}
.ttl{padding:6px 20px 16px;background:var(--bg);flex:none}
.ttl h2{margin:0;font-size:26px;font-weight:800;color:var(--red);letter-spacing:-.025em}

/* the red band that carries date range + search */
.band{background:var(--red);padding:16px;flex:none}
.band .mrow{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.band .mon{color:#fff;font-size:17px;font-weight:800;line-height:1.15;max-width:5.5em}
.band .cal{color:#fff;display:grid;place-items:center;width:30px;flex:none}
.band .cal svg{width:24px;height:24px}
.range{flex:1;min-width:0;background:#fff;border-radius:9px;display:flex;align-items:center;
  height:46px;overflow:hidden;text-align:left}
.range span{flex:1;min-width:0;padding:0 10px;font-size:12.5px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.range i{width:1.5px;height:26px;background:var(--red);flex:none}
.range .ph{color:var(--dim)}
.srch{background:#fff;border-radius:22px;display:flex;align-items:center;gap:8px;
  padding:0 14px;height:44px}
.srch input{flex:1;min-width:0;border:0;outline:none;font-size:13.5px;background:none}
.srch svg{width:19px;height:19px;color:var(--dim);flex:none}

.body{flex:1;padding:0 16px calc(var(--bot) + 84px)}
.body.pad{padding-top:16px}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:var(--bot);box-shadow:0 -2px 12px rgba(20,22,28,.05)}
.tabs button{padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:600;color:var(--dim)}
.tabs button svg{width:23px;height:23px}
.tabs button.on{color:var(--red)}
.tabs button:active{background:var(--inset)}

/* ---------- blocks ---------- */
.sec{display:flex;align-items:center;gap:9px;margin:4px 0 12px;font-size:17px;font-weight:800;
  color:var(--red)}
.sec svg{width:21px;height:21px}
.sec .more{margin-left:auto;background:var(--red);color:#fff;font-size:13px;font-weight:700;
  padding:8px 15px;border-radius:9px}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--card);border-radius:var(--r);padding:14px;
  box-shadow:0 1px 3px rgba(20,22,28,.07)}

.quick{background:var(--card);border-radius:var(--r);padding:14px 14px 12px;position:relative;
  min-height:124px;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(20,22,28,.07);
  text-align:left}
.quick b{font-size:14px;font-weight:800;line-height:1.3;letter-spacing:-.01em}
.quick .art{margin-top:auto;height:44px;display:flex;align-items:flex-end}
.quick .art svg{width:40px;height:40px;color:var(--red);opacity:.3}
.quick .go{position:absolute;right:12px;bottom:12px;width:30px;height:30px;border-radius:50%;
  background:var(--red);display:grid;place-items:center}
.quick .go svg{width:15px;height:15px;color:#fff}
.quick:active{transform:scale(.985)}

.stat{background:var(--card);border-radius:var(--r);padding:12px 10px;text-align:center;
  box-shadow:0 1px 3px rgba(20,22,28,.07)}
.stat .art{height:52px;display:grid;place-items:center;margin-bottom:6px}
.stat .art svg{width:46px;height:46px;color:var(--red);opacity:.85}
.stat .l{font-size:11.5px;color:var(--mut);font-weight:600}
.stat .v{font-size:15px;font-weight:800;margin-top:2px;letter-spacing:-.01em}

.rowbtn{display:block;width:100%;background:var(--red);color:#fff;font-size:15.5px;font-weight:700;
  padding:15px;border-radius:11px;margin-top:12px;text-align:center}
.rowbtn:active{background:var(--red-d)}
.rowbtn.g{background:var(--grn)} .rowbtn.g:active{background:var(--grn-d)}
.rowbtn.b{background:var(--blue)} .rowbtn.b:active{background:var(--blue-d)}
.rowbtn.o{background:#fff;color:var(--red);border:1.5px solid var(--red);font-size:14px;padding:13px}
.rowbtn.o:active{background:var(--red-lo)}
.rowbtn[disabled]{opacity:.45;pointer-events:none}

/* ---------- list cards, the shape used by every history screen ---------- */
.list{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:14px;
  box-shadow:0 1px 3px rgba(20,22,28,.07)}
.row{display:block;width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid var(--line-s)}
.row:last-child{border-bottom:0}
.row:active{background:var(--inset)}
.row .when{font-size:11.5px;color:var(--dim);margin-bottom:6px}
.row .main{display:flex;align-items:flex-start;gap:10px}
.row .who{flex:1.5;min-width:0}
.row .code{color:var(--red);font-size:12.5px;font-weight:800}
.row .nm{font-size:13.5px;font-weight:700;line-height:1.3;margin-top:1px}
.row .mid{flex:1;min-width:0;font-size:12.5px;color:var(--mut);line-height:1.35}
.row .st{font-size:12.5px;font-weight:700;text-align:right;flex:none;min-width:62px}
.row .amt{font-size:13.5px;font-weight:800;text-align:right;flex:none;min-width:74px}
.row .qty{font-size:15px;font-weight:800;text-align:right;flex:none;min-width:38px}
.paid{color:var(--grn)} .unpaid{color:var(--red)} .part{color:var(--amb)}

/* reseller list */
.rrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;
  border-bottom:1px solid var(--line-s)}
.rrow:last-child{border-bottom:0}
.rrow:active{background:var(--inset)}
.rrow .t{flex:1;min-width:0}
.rrow .code{color:var(--red);font-size:12px;font-weight:800}
.rrow .nm{font-size:14px;font-weight:700;line-height:1.3}
.rrow .chev{color:var(--dim);flex:none}
.rrow .chev svg{width:18px;height:18px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:5px 11px;border-radius:14px;
  margin-top:7px;color:#fff}
.chip.out{background:var(--grn)} .chip.in{background:var(--blue)}

/* ---------- red section header + table, as on his detail screens ---------- */
.block{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:16px;
  box-shadow:0 1px 3px rgba(20,22,28,.07)}
.block > h3{margin:0;background:var(--red);color:#fff;font-size:14.5px;font-weight:700;
  padding:11px 15px}
.block .in{padding:14px 15px}
.kv{display:flex;gap:12px;padding:7px 0;font-size:13.5px;align-items:flex-start}
.kv dt{width:94px;flex:none;color:var(--ink);font-weight:600}
.kv dd{margin:0;flex:1;min-width:0;color:var(--mut);word-break:break-word}
.kv dd b{color:var(--ink)}
dl{margin:0}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t thead th{background:var(--red);color:#fff;font-size:12.5px;font-weight:700;
  padding:10px 8px;text-align:left}
table.t thead th.r{text-align:right}
table.t td{padding:11px 8px;border-bottom:1px solid var(--line-s);vertical-align:top}
table.t td.r{text-align:right}
table.t td[data-ot]{white-space:nowrap}   /* "RM 22.50" must not wrap to two lines */
table.t td.c{text-align:center}
table.t tbody tr:last-child td{border-bottom:0}
/* Four columns and a stepper on a 360px phone: every pixel of cell padding
   comes out of the product name, which is the one thing that must stay
   readable. */
table.t.tight td,table.t.tight thead th{padding-left:5px;padding-right:5px}
table.t .pname{font-weight:700}
table.t .price{color:var(--red);font-weight:700}
.tfoot{padding:12px 15px;border-top:1px solid var(--line-s)}
.tfoot div{display:flex;justify-content:flex-end;gap:14px;font-size:13.5px;padding:3px 0}
.tfoot b{font-weight:800;min-width:92px;text-align:right}

.photo{width:100%;height:190px;object-fit:cover;display:block;background:var(--line-s)}
.ph-ph{width:100%;height:190px;display:grid;place-items:center;background:var(--line-s);color:var(--dim)}
.ph-ph svg{width:40px;height:40px}
.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;flex:none;background:var(--line-s)}
.avatar.ph{display:grid;place-items:center;color:var(--dim)}
.avatar.ph svg{width:28px;height:28px}

.cust{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.cust .t{flex:1;min-width:0}
.cust .code{color:var(--red);font-size:13.5px;font-weight:800}
.cust .nm{font-size:16px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
.cust .ad{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.4}

/* ---------- profile ---------- */
.ptabs{display:flex;gap:4px;overflow-x:auto;background:var(--bg);padding:0 14px;flex:none;
  border-bottom:1px solid var(--line);scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{padding:12px 10px;font-size:14px;font-weight:600;color:var(--mut);
  border-bottom:2.5px solid transparent;white-space:nowrap}
.ptabs button.on{color:var(--red);font-weight:700;border-bottom-color:var(--red)}
.pcard{background:var(--card);border-radius:18px;margin-top:-26px;position:relative;
  padding:18px 16px;box-shadow:0 -2px 14px rgba(20,22,28,.06)}
.prow{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--line-s)}
.prow:last-child{border-bottom:0}
.prow .ic{width:30px;flex:none;color:var(--red);display:grid;place-items:center}
.prow .ic svg{width:22px;height:22px}
.prow .lb{width:78px;flex:none;color:var(--red);font-size:13.5px;font-weight:700;line-height:1.2}
.prow .vl{flex:1;min-width:0;font-size:13px;color:var(--mut);line-height:1.45}
.prow .ac{flex:none}
.sbtn{background:var(--red);color:#fff;font-size:12.5px;font-weight:700;padding:8px 13px;
  border-radius:8px;display:inline-flex;align-items:center;gap:5px}
.sbtn svg{width:14px;height:14px}
.sbtn:active{background:var(--red-d)}
.term{background:var(--blue);color:#fff;font-size:11.5px;font-weight:700;padding:5px 10px;
  border-radius:7px;display:inline-flex;align-items:center;gap:5px;flex:none}
.term svg{width:13px;height:13px}

/* ---------- galeri ---------- */
.gal{margin-bottom:14px}
.gal h4{margin:0;background:var(--red);color:#fff;font-size:13.5px;font-weight:700;
  padding:10px 14px;border-radius:var(--r) var(--r) 0 0}
.gal .in{background:var(--card);border-radius:0 0 var(--r) var(--r);padding:12px 14px;
  box-shadow:0 1px 3px rgba(20,22,28,.07)}
.gal img{width:84px;height:104px;object-fit:cover;border-radius:4px;background:var(--line-s)}
.gal .none{font-size:12.5px;color:var(--dim);padding:10px 0}
.gal .acts{display:flex;gap:10px;margin-top:12px}
.gal .acts button{flex:1}

/* ---------- ranking (his only blue screen) ---------- */
/* The ranking screen is the one place his app leaves red for blue. The blue
   has to reach the bottom of the screen even when the list is short, so the
   page background changes with it rather than the panel alone. */
body[data-rk="1"]{background:var(--rank)}
.rk{background:var(--rank);min-height:100%;margin:0 -16px;padding:0 16px calc(var(--bot) + 84px);
  color:#fff}
.rk .hd2{padding:calc(var(--top) + 18px) 4px 16px;font-size:24px;font-weight:800;
  letter-spacing:-.02em}
.seg{display:flex;background:#fff;border-radius:9px;overflow:hidden;margin-bottom:18px}
.seg button{flex:1;padding:12px 6px;font-size:13px;font-weight:700;color:var(--ink)}
.seg button.on{background:#F0A800;color:#fff}
.allrow{display:flex;align-items:center;justify-content:center;gap:16px;font-size:14px;
  font-weight:700;margin-bottom:18px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin-bottom:22px}
.pod{text-align:center}
.pod .medal{font-size:26px;line-height:1}
.pod .pic{width:72px;height:72px;border-radius:50%;margin:6px auto 0;object-fit:cover;
  background:rgba(255,255,255,.25);border:2.5px solid rgba(255,255,255,.5);display:grid;
  place-items:center;font-size:21px;font-weight:800;color:#fff}
.pod.first .pic{width:86px;height:86px}
.pod .nm{font-size:11.5px;font-weight:700;margin-top:7px;line-height:1.25;word-break:break-word}
.pod .amt{font-size:12.5px;font-weight:800;color:#FFC94A;margin-top:3px}
.rkrow{display:flex;align-items:center;gap:11px;background:#fff;color:var(--ink);
  border-radius:10px;padding:11px 13px;margin-bottom:9px}
.rkrow .n{width:26px;height:26px;border-radius:6px;background:#F0A800;color:#fff;flex:none;
  display:grid;place-items:center;font-size:12.5px;font-weight:800}
.rkrow .t{flex:1;min-width:0}
.rkrow .t b{display:block;font-size:13.5px;font-weight:700}
.rkrow .t span{font-size:11.5px;color:var(--mut)}
.rkrow .v{font-size:13.5px;font-weight:800;text-align:right}
.rkrow.me{outline:2px solid #FFC94A}

/* ---------- states ---------- */
.empty{text-align:center;padding:40px 18px;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:15.5px;margin-bottom:5px}
.empty span{font-size:13.5px;display:block;max-width:30ch;margin:0 auto}
.soon{background:var(--card);border-radius:var(--r);padding:20px 18px;text-align:center;
  box-shadow:0 1px 3px rgba(20,22,28,.07);margin-bottom:14px}
.soon .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);font-weight:800}
.soon b{display:block;font-size:16px;margin:7px 0 6px;letter-spacing:-.01em}
.soon span{font-size:13.5px;color:var(--mut);display:block;max-width:34ch;margin:0 auto}
.hint{font-size:12.5px;color:var(--dim);text-align:center;margin:10px 0 0;line-height:1.5}

/* ---------- forms ---------- */
.f{margin-bottom:14px}
.f label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink);margin-bottom:6px}
.f input,.f textarea,.f select{width:100%;padding:13px;border:1px solid var(--line);
  border-radius:9px;background:#fff;font-size:15px}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f textarea:focus,.f select:focus{outline:none;border-color:var(--red)}
.err{background:var(--red-lo);color:var(--red-d);border-radius:10px;padding:12px 14px;
  font-size:13.5px;font-weight:600;margin-bottom:14px}
.ok{background:var(--grn-lo);color:var(--grn-d);border-radius:10px;padding:12px 14px;
  font-size:13.5px;font-weight:600;margin-bottom:14px}
.qin{width:54px;padding:8px 4px;border:1px solid var(--line);border-radius:6px;text-align:center;
  font-size:14px}
/* A salesman enters these standing in a shop holding a phone in one hand.
   Tapping is the only reasonable way in; the field stays typeable for a big
   number. The spinner the browser puts on a number input is far too small to
   hit, so it is removed and replaced with real buttons. */
/* The unit price, which the salesman may edit down to the floor price. Wide
   enough for "150.00" without clipping, and no stepper: a sen at a time is
   not how anyone negotiates. */
.qin.pin{width:68px;padding:8px 2px;font-size:13.5px}
.step{display:inline-flex;align-items:center;gap:0}
.step button{width:27px;height:34px;border:1px solid var(--line);background:var(--card);
  color:var(--red);font-size:17px;font-weight:700;line-height:1;display:grid;place-items:center}
.step button:first-child{border-radius:7px 0 0 7px}
.step button:last-child{border-radius:0 7px 7px 0}
.step button:active{background:var(--red-lo)}
.step .qin{width:42px;height:34px;border-radius:0;border-left:0;border-right:0;padding:0}
.step .qin::-webkit-outer-spin-button,.step .qin::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0}
.step .qin[type=number]{-moz-appearance:textfield}

/* ---------- login ---------- */
.lg{min-height:100%;display:flex;flex-direction:column;background:var(--red);color:#fff}
.lg .top{padding:calc(var(--top) + 54px) 26px 30px;flex:none}
.lg .mk{width:62px;height:62px;border-radius:17px;background:rgba(255,255,255,.17);
  display:grid;place-items:center;margin-bottom:17px}
.lg .mk svg{width:34px;height:34px}
.lg h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.02em}
.lg p{margin:7px 0 0;opacity:.9;font-size:14.5px;max-width:30ch}
.lg .form{flex:1;background:var(--bg);color:var(--ink);border-radius:24px 24px 0 0;
  padding:26px 22px calc(var(--bot) + 30px)}
.lg .f label{color:var(--mut)}

/* ---------- sheets and modals ---------- */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(20,22,28,.45);display:flex;
  flex-direction:column;justify-content:flex-end}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:10px 0 calc(var(--bot) + 10px);
  max-height:88vh;overflow:auto}
.sheet .opt{display:flex;align-items:center;gap:14px;padding:16px 22px;width:100%;text-align:left;
  font-size:15.5px;font-weight:600}
.sheet .opt:active{background:var(--inset)}
.sheet .opt svg{width:22px;height:22px;color:var(--mut)}
.modal{position:fixed;inset:0;z-index:95;background:rgba(20,22,28,.5);display:grid;
  place-items:center;padding:18px}
.mbox{background:#F3F1F6;border-radius:16px;width:100%;max-width:380px;max-height:86vh;
  overflow:auto}
.mbox .mh{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;
  border-bottom:1px solid var(--line)}
.mbox .mh b{font-size:16px;font-weight:700}
.mbox .mh button{font-size:22px;color:var(--mut);line-height:1;padding:0 4px}
.mbox .mi{padding:20px}
.pay-tot{text-align:center;font-size:15px;font-weight:600;margin-bottom:18px}
.pay-tot b{color:var(--red);font-weight:800}
.ck{display:flex;align-items:center;gap:12px;padding:11px 2px;width:100%;text-align:left;
  font-size:14.5px}
.ck i{width:19px;height:19px;border:1.5px solid var(--dim);border-radius:3px;flex:none;
  display:grid;place-items:center;background:#fff}
.ck.on i{border-color:var(--red)}
.ck.on i::after{content:"";width:5px;height:10px;border:solid var(--red);border-width:0 2.5px 2.5px 0;
  transform:rotate(42deg) translate(-1px,-1px)}
.ck[disabled]{opacity:.45}
.mi h5{margin:16px 0 4px;font-size:14.5px;font-weight:700}
.mi h5:first-child{margin-top:0}

/* ---------- calendar ---------- */
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:10px}
.cal-g .dow{text-align:center;font-size:12px;color:var(--mut);font-weight:600;padding:6px 0}
.cal-g button{aspect-ratio:1;border-radius:50%;font-size:13.5px;display:grid;place-items:center}
.cal-g button.in{background:#E6E1F2;border-radius:0}
.cal-g button.e1{border-radius:50% 0 0 50%}
.cal-g button.e2{border-radius:0 50% 50% 0}
.cal-g button.pick{background:#6B4FD8;color:#fff;border-radius:50%}
.cal-g button[disabled]{visibility:hidden}
.cal-h{display:flex;align-items:center;justify-content:space-between;font-size:15.5px;
  font-weight:700;padding:0 4px}
.cal-h button{width:34px;height:34px;display:grid;place-items:center;font-size:19px;color:var(--mut)}
.cal-a{display:flex;gap:12px;margin-top:18px}
.cal-a button{flex:1;padding:13px;border-radius:9px;font-size:14.5px;font-weight:700}
.cal-a .no{background:#D8D4DC;color:var(--mut)}
.cal-a .yes{background:var(--red);color:#fff}

/* ---------- approvals ---------- */
.decide{display:flex;gap:9px;margin-top:11px}
.decide button{flex:1;padding:10px;border-radius:9px;font-size:13.5px;font-weight:700}
.decide .yes{background:var(--grn);color:#fff}
.decide .yes:active{background:var(--grn-d)}
.decide .no{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.decide .no:active{background:var(--red-lo)}
.note2{margin-top:8px;padding:8px 10px;background:var(--inset);border-radius:7px;
  font-size:12.5px;color:var(--mut);line-height:1.45}
/* What the office wrote back, kept visibly apart from what the salesman
   wrote. On a rejection this line is the whole point of the screen. */
.note2.off{background:var(--red-lo);color:var(--red-d)}
.note2 b{font-weight:800}

/* ---------- permohonan saya ---------- */
.row.rq{padding:14px}
.rq .rqtop{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.rq .rqtop .k{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:var(--dim)}
.rq .rqtop .st{margin-left:auto;min-width:0}
.rq .baru{background:var(--red);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.04em;
  text-transform:uppercase;padding:2px 6px;border-radius:5px}
.rq .rqsub{font-size:12px;color:var(--mut);font-weight:400;margin-top:3px;line-height:1.35}
.rq .when{margin:8px 0 0}
.rq.nw{background:#FFF8F8}

/* ---------- jadual harian ---------- */
.dstrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.dstrip::-webkit-scrollbar{display:none}
.dstrip button{flex:none;width:46px;padding:8px 0;border-radius:10px;background:#fff;
  border:1px solid var(--line);text-align:center;line-height:1.2}
.dstrip button span{display:block;font-size:10.5px;color:var(--mut);font-weight:600}
.dstrip button b{display:block;font-size:16px;font-weight:800;margin-top:1px}
.dstrip button.on{background:var(--red);border-color:var(--red);color:#fff}
.dstrip button.on span{color:rgba(255,255,255,.85)}
.dstrip .cal{width:44px;display:grid;place-items:center;color:var(--red)}
.dstrip .cal svg{width:21px;height:21px}
.dhead{display:flex;align-items:baseline;gap:8px;margin:14px 0 10px;font-size:15px;
  font-weight:800;letter-spacing:-.01em}
.dhead span{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--mut)}
.stop{display:flex;gap:11px;padding:13px 12px;border-bottom:1px solid var(--line-s)}
.stop:last-child{border-bottom:0}
.stop .pos{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;flex:none;
  display:grid;place-items:center;font-size:12.5px;font-weight:800}
.stop .who{flex:1;min-width:0}
.stop .code{color:var(--red);font-size:11.5px;font-weight:800}
.stop .nm{font-size:14px;font-weight:700;line-height:1.3}
.stop .ad{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.4}
.stop .rem{width:100%;margin-top:7px;padding:7px 9px;border:1px solid var(--line);
  border-radius:7px;font-size:12.5px;background:var(--inset)}
.stop .rem:focus{outline:none;border-color:var(--red);background:#fff}
.stop .qa{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.stop .qa button{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;
  color:var(--red);border:1px solid var(--line);border-radius:14px;padding:5px 10px;background:#fff}
.stop .qa svg{width:13px;height:13px}
.stop .ord{display:flex;flex-direction:column;gap:4px;flex:none}
.stop .ord button{width:28px;height:26px;border:1px solid var(--line);border-radius:6px;
  background:#fff;color:var(--mut);font-size:10px;display:grid;place-items:center}
.stop .ord button[disabled]{opacity:.3}
.stop .ord .rm{color:var(--red);font-size:16px;line-height:1}

/* ---------- document on a thermal roll ---------- */
.roll{background:#fff;color:#000;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:11.5px;line-height:1.5;padding:16px 12px;margin:0 auto;
  box-shadow:0 1px 3px rgba(20,22,28,.12)}
.roll.r58{max-width:230px;font-size:10.5px}
.roll.r80{max-width:310px}
.roll .co{text-align:center;margin-bottom:2px}
.roll .co b{display:block;font-size:1.15em;font-weight:700}
.roll .co span{display:block;font-size:.85em;line-height:1.45}
.roll .hr{border-top:1px dashed #000;margin:7px 0;opacity:.6}
.roll .dt{text-align:center;font-weight:700;letter-spacing:.06em}
.roll .pr{display:flex;justify-content:space-between;gap:8px}
.roll .pr span{flex:1;min-width:0}
.roll .pr b{font-weight:700;text-align:right;white-space:nowrap}
.roll .pr.tot{font-size:1.15em;font-weight:700;margin-top:2px}
.roll .ln{margin-top:4px;word-break:break-word}
.roll .stamp{text-align:center;font-weight:700;font-size:1.15em;letter-spacing:.1em;margin-top:8px}

/* Printing: only the receipt goes on the roll, at the roll's real width. The
   @page rule carrying that width is swapped from script, because @page cannot
   read a CSS variable — without it the browser prints onto A4 and a 58mm
   layout arrives a third of the way across the sheet. */
@media print{
  body{background:#fff}
  #app > *:not(.body), .tabs, .bar, .ttl, .hint, .g2, .rowbtn, #chrome, #over{display:none!important}
  .body{padding:0!important}
  .roll{box-shadow:none;max-width:none;width:auto;margin:0;padding:0}
}

/* ---------- registration wizard ---------- */
.steps{display:flex;gap:5px;padding:0 16px 14px;background:var(--bg);flex:none}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--red)}
.stepn{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--dim);padding:0 0 10px}
.ff{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:360px){.ff{grid-template-columns:1fr}}
.f .req{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 14px;border-radius:18px;border:1.5px solid var(--line);background:#fff;
  font-size:13.5px;font-weight:600;color:var(--mut)}
.chips button.on{border-color:var(--red);background:var(--red-lo);color:var(--red)}
.termsel{display:grid;gap:10px}
.termsel button{display:flex;align-items:center;gap:12px;padding:14px;border-radius:11px;
  border:1.5px solid var(--line);background:#fff;text-align:left}
.termsel button.on{border-color:var(--red);background:var(--red-lo)}
.termsel b{display:block;font-size:14.5px}
.termsel span{display:block;font-size:12.5px;color:var(--mut);margin-top:2px}
.termsel i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;
  display:grid;place-items:center}
.termsel button.on i{border-color:var(--red)}
.termsel button.on i::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--red)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcell{border:1.5px dashed var(--line);border-radius:12px;background:#fff;overflow:hidden;
  position:relative;aspect-ratio:3/4;display:grid;place-items:center;text-align:center;padding:10px}
.pcell.has{border-style:solid;border-color:var(--grn)}
.pcell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pcell .lb{position:relative;font-size:12.5px;font-weight:700;color:var(--mut);line-height:1.3}
.pcell .lb svg{width:26px;height:26px;display:block;margin:0 auto 7px;color:var(--dim)}
/* Once there is a photograph behind it the caption needs its own ground, or it
   is grey text on whatever the shopfront happens to look like. */
.pcell.has .lb{position:absolute;left:0;right:0;bottom:0;z-index:2;color:#fff;
  padding:16px 8px 7px;background:linear-gradient(to top,rgba(0,0,0,.72),transparent)}
.pcell .tick{position:absolute;right:7px;top:7px;width:22px;height:22px;border-radius:50%;
  background:var(--grn);color:#fff;display:grid;place-items:center;font-size:13px;z-index:2}
.pcell input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:3}
.navrow{display:flex;gap:12px;margin-top:18px}
.navrow button{flex:1;margin:0}
.agree{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;
  font-size:12.5px;line-height:1.6;color:var(--mut);max-height:230px;overflow:auto}
.agree h5{margin:0 0 8px;font-size:13.5px;color:var(--ink)}
.agree dl{margin:10px 0 0}
.done{text-align:center;padding:26px 10px}
.done .big{width:66px;height:66px;border-radius:50%;background:var(--grn-lo);color:var(--grn);
  display:grid;place-items:center;margin:0 auto 14px}
.done .big svg{width:34px;height:34px}
.done b{display:block;font-size:19px;letter-spacing:-.01em}
.done .code{font-family:ui-monospace,monospace;font-size:22px;font-weight:800;color:var(--red);
  margin:8px 0 4px}

/* ---------- chrome ---------- */
.offline{position:fixed;left:12px;right:12px;bottom:calc(var(--bot) + 70px);z-index:60;
  background:var(--ink);color:#fff;border-radius:11px;padding:11px 14px;font-size:13px;
  font-weight:600;display:flex;align-items:center;gap:9px;box-shadow:0 6px 20px rgba(0,0,0,.26)}
.offline i{width:8px;height:8px;border-radius:50%;background:#FBBF24;flex:none}
.install{position:fixed;left:12px;right:12px;bottom:calc(var(--bot) + 70px);z-index:60;
  background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 14px;
  display:flex;align-items:center;gap:11px;box-shadow:0 8px 24px rgba(20,22,28,.14)}
.install img{width:38px;height:38px;border-radius:9px;flex:none}
.install b{display:block;font-size:14px}
.install span{display:block;font-size:12px;color:var(--mut)}
.install .yes{background:var(--red);color:#fff;font-size:13px;font-weight:700;
  padding:9px 14px;border-radius:9px;margin-left:auto;flex:none}
.install .no{color:var(--dim);padding:9px 4px;flex:none;font-size:18px;line-height:1}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--bot) + 76px);z-index:99;
  background:var(--ink);color:#fff;border-radius:11px;padding:13px 16px;font-size:13.5px;
  font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.good{background:var(--grn-d)}
.toast.bad{background:var(--red-d)}

.spin{width:26px;height:26px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);
  border-top-color:#fff;animation:sp .7s linear infinite;margin:0 auto}
.spin.dark{border-color:var(--line);border-top-color:var(--red)}
@keyframes sp{to{transform:rotate(360deg)}}
.boot{min-height:100%;display:grid;place-items:center;background:var(--red);color:#fff}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
@media (min-width:560px){ /* a phone app on a desktop screen stays phone-width */
  #app{max-width:460px;margin:0 auto;box-shadow:0 0 0 1px var(--line);min-height:100vh}
  .tabs{max-width:460px;margin:0 auto}
  .offline,.install,.toast{max-width:436px;margin:0 auto}
}
</style>
</head>

<div id="app"><div class="boot"><div><div class="spin"></div></div></div></div>

   State

const BUILD = "2026-10-12";

/* Everything the salesman may see, read once at sign-in. At this scale — a

/* @page cannot read a CSS variable, so the rule carrying the roll width is
   swapped out whenever the width changes. Without it the browser prints the
   receipt onto A4 and a 58mm layout arrives a third of the way across. */
let PAPER = null;
function setPaper() {
  if (!PAPER) { PAPER = document.createElement("style"); document.head.appendChild(PAPER); }
  const w = S.roll === "58" ? "58mm" : "80mm";
  PAPER.textContent = "@media print{@page{size:" + w + " auto;margin:3mm 2mm}}";
}

const linesOf = id => DB.lines[id] || [];

/* Our three invoice states, in his words and his colours. He also shows
   "Pending Acc Approval", which is an approval step we have no workflow for —
   it is in the report as an open question, not faked here. */
const STAT = { paid: ["Paid", "paid"], partial: ["Separa Bayar", "part"], pending: ["Unpaid", "unpaid"] };
/* Money a salesman has taken but the office has not yet confirmed. The amount
   already counts against the balance — the shop has paid, after all — so this
   is a state on the paperwork rather than on the money. */
const waiting = v => DB.payments.filter(p => p.invoice_id === v.id && !p.approved_at && !p.rejected_at);
const pendingAmt = v => waiting(v).reduce((a, p) => a + Number(p.amount), 0);
function invStat(v) {
  if (waiting(v).length) return ["Pending Acc Approval", "part"];
  return STAT[v.status] || STAT.pending;
}

let deferredInstall = null, installDismissed = false, toastT = null;
try { installDismissed = localStorage.getItem("sa.install") === "no"; } catch (_) {}

function chrome() {
  let h = "";
  if (!S.online)
    h += `<div class="offline"><i></i><span>Tiada sambungan — angka tidak boleh dimuatkan</span></div>`;
  else if (deferredInstall && !installDismissed)
    h += `<div class="install">
      <img src="./icon-192.png" alt="">
      <span style="min-width:0"><b>Pasang app ini</b><span>Buka terus dari skrin utama telefon</span></span>
      <button class="yes" data-a="install">Pasang</button>
      <button class="no" data-a="noinstall" aria-label="Tutup">&times;</button></div>`;
  $("#chrome").innerHTML = h;
}
function toast(msg, kind) {
  /* The old one goes first. Without this, clearing the previous removal timer
     cancelled the only thing that would ever have removed it, so every message
     stayed on screen and stacked — a salesman would end up reading a refusal
     from ten minutes ago. */
  clearTimeout(toastT);
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.textContent = msg;
  document.body.appendChild(el);
  toastT = setTimeout(() => el.remove(), 3600);
}
addEventListener("online",  () => { S.online = true;  chrome(); });
addEventListener("offline", () => { S.online = false; chrome(); });
addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; chrome(); });
addEventListener("appinstalled", () => { deferredInstall = null; chrome(); });

/* ===========================================================================
   Navigation — a stack over the five tabs
   =========================================================================== */
/* Not `top` — that is `window.top`, and redeclaring it kills the whole script
   with "Identifier 'top' has already been declared" before anything renders. */
const cur = () => S.stack.length ? S.stack[S.stack.length - 1] : null;
/* The search box and the date range belong to the screen, not to the session.
   Each of his list screens carries its own picker, and a range chosen on Sales
   History silently emptying D/O Lepas is the kind of fault nobody reports —
   they just think there are no delivery orders. */
function push(name, p) { S.stack.push(Object.assign({ name: name }, p || {}));
                         S.q = ""; S.range = null; draw(); scrollTo(0, 0); }
function pop()  { S.stack.pop(); S.q = ""; S.range = null; draw(); scrollTo(0, 0); }
function root() { S.stack = []; S.tab = "home"; S.q = ""; S.range = null; draw(); scrollTo(0, 0); }

/* ===========================================================================
   Screens — Kesimpulan
   =========================================================================== */
function vKesimpulan() {
  const r = S.range || { from: dOnly(new Date(Date.now() - 29 * 864e5)), to: dOnly(new Date()) };
  const inR = d => { const t = new Date(d); return t >= r.from && t < new Date(r.to.getTime() + 864e5); };
  const pays = DB.payments.filter(p => inR(p.paid_at));
  const total = pays.reduce((a, p) => a + Number(p.amount), 0);
  /* Grouped by whatever method is actually on the payments, not by a fixed
     list. An earlier version totalled four hardcoded names, so money taken by
     Gaji — or by the web portal, which writes "Cash" rather than "tunai" —
     counted towards the total and appeared under nothing. The parts did not
     add up to the whole, and a salesman reconciling his cash at the end of
     the day would have come up short with no way to see why. */
  const byMethod = {};
  pays.forEach(p => {
    const k = (p.method || "").toLowerCase().trim() || "lain";
    byMethod[k] = (byMethod[k] || 0) + Number(p.amount);
  });
  const methodRows = Object.keys(byMethod)
    .sort((a, b) => byMethod[b] - byMethod[a])
    .map(k => [METH[k] || (k === "cash" ? "Cash" : k === "lain" ? "Lain-lain"
                : k.charAt(0).toUpperCase() + k.slice(1)), byMethod[k]]);
  const hutang = DB.invoices.filter(v => v.status !== "paid")
    .reduce((a, v) => a + Number(v.total) - Number(v.paid), 0);
  const sos = DB.sos.filter(s => inR(s.issued_at));
  const soldBy = {};
  sos.forEach(s => linesOf(s.id).forEach(l => { soldBy[l.product_id] = (soldBy[l.product_id]||0) + l.qty; }));
  const soldTotal = Object.values(soldBy).reduce((a, n) => a + n, 0);
  const newR = DB.customers.filter(c => c.registered_at && inR(c.registered_at)).length;
  const gone = DB.customers.filter(c => c.active === false).length;
  const vanTotal = DB.products.reduce((a, p) => a + (DB.van[p.id] || 0), 0);

  return backBar() + title("Kesimpulan") + `
  <div class="band"><div class="mrow">
    <div class="cal">${ic(I.cal)}</div>
    <div class="mon" style="max-width:none;font-size:15px">Tarikh</div>
  </div>
  <button class="range" data-a="cal">
    <span>${fLong(r.from)}</span><i></i><span>${fLong(r.to)}</span>
  </button></div>
  <div class="body pad">
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;gap:14px;align-items:flex-start">
        <div style="width:58px;flex:none;color:var(--red);opacity:.85">${ic(I.cash)}</div>
        <div style="flex:1;min-width:0">
          <b style="font-size:15px">Wang Terima</b>
          <dl style="margin-top:8px;font-size:13.5px">
            ${li("Total", RM(total))}
            ${methodRows.map(([l, v]) => li(l, RM(v))).join("")}
            ${methodRows.length ? "" : li("Tiada bayaran", "—")}
            ${li("Hutang", RM(hutang))}
            ${li("S/O Issued", N(sos.length))}${li("New Reseller", N(newR))}
            ${li("Reseller Removed", N(gone))}
          </dl></div></div></div>

    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;gap:14px;align-items:flex-start">
        <div style="width:58px;flex:none;color:var(--red);opacity:.85">${ic(I.chart)}</div>
        <div style="flex:1;min-width:0">
          <b style="font-size:15px">Qty Jualan</b>
          <dl style="margin-top:8px;font-size:13.5px">${li("Total", N(soldTotal))}
            ${DB.products.filter(p => soldBy[p.id]).map(p => li(p.name, N(soldBy[p.id]))).join("")}
          </dl></div></div></div>

    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;gap:14px;align-items:flex-start">
        <div style="width:58px;flex:none;color:var(--red);opacity:.85">${ic(I.truck)}</div>
        <div style="flex:1;min-width:0">
          <b style="font-size:15px">Stok Terkini</b>
          <dl style="margin-top:8px;font-size:13.5px">${li("Total", N(vanTotal))}
            ${DB.products.map(p => li(p.name, N(DB.van[p.id] || 0))).join("")}
          </dl></div></div></div>

    <div class="sec" style="justify-content:center">Kesimpulan Tpp &amp; Rtn</div>
    <div class="block"><table class="t">
      <thead><tr><th>Produk</th><th class="c">Tpp</th><th class="c">Rtn</th></tr></thead>
      <tbody><tr><td class="pname">Total</td><td class="c">—</td>
        <td class="c">${N(DB.returns.filter(x => inR(x.issued_at)).reduce((a,x)=>a+x.qty,0))}</td></tr>
      </tbody></table></div>
    <p class="hint">“Rtn” diambil sebagai Pulangan. “Tpp” belum disahkan maksudnya.</p>
  </div>`;
}

/* ===========================================================================
   Permohonan Saya — the other half of the approval loop
   ===========================================================================
   Four things a salesman does are decided by somebody else: a price change
   (Mohon), a credit note, a stock request, and the money he collects. Until
   now the answer went only to the office and he had to telephone to find out.
   This is one list of all four, because a salesman wondering "did that go
   through?" does not think in terms of which table it was in.

   A payment appears here only while it is waiting or if it was rejected. An
   approved payment is not news — the invoice reads Paid, which is what he
   wanted — and listing every one of them would bury the three kinds of
   request that genuinely need an answer. */

const RQSTAT = {
  pending:  ["Menunggu",   "part"],
  approved: ["Diluluskan", "paid"],
  issued:   ["Diluluskan", "paid"],
  rejected: ["Ditolak",    "unpaid"],
};

function myRequests() {
  const me = (S.me || {}).id;
  const out = [];

  DB.priceReqs.filter(r => r.salesman_id === me).forEach(r => {
    const c = custOf(r.customer_id);
    out.push({ kind: "Tukar Harga", status: r.status,
      at: r.requested_at, decided: r.decided_at,
      code: c ? rcode(c) : "", who: c ? c.name : "—",
      sub: prodOf(r.product_id).name,
      /* Struck through, as on the office's own screen: two prices stacked
         without it do not say which one he is asking for. */
      amt: `<s style="color:var(--dim);font-weight:400">${RM(r.old_price)}</s><br>${RM(r.new_price)}`,
      mine: r.note, reply: r.decide_note,
      act: c ? ["cust", c.id] : null });
  });

  DB.creditNotes.filter(r => r.salesman_id === me).forEach(r => {
    const c = custOf(r.customer_id), inv = DB.invoices.find(v => v.id === r.invoice_id);
    out.push({ kind: "Credit Note", status: r.status,
      at: r.requested_at, decided: r.decided_at,
      code: c ? rcode(c) : "", who: c ? c.name : "—",
      sub: [inv ? inv.doc_no : "", r.doc_no, r.reason].filter(Boolean).join(" · "),
      amt: RM(r.amount),
      mine: r.note, reply: r.decide_note,
      act: inv ? ["order", inv.id] : null });
  });

  DB.reqs.filter(r => r.salesman_id === me).forEach(r => {
    const p = prodOf(r.product_id);
    /* The warehouse may issue fewer than were asked for, and that difference
       is the whole answer — so it is shown rather than just the figure. */
    const short = r.status === "issued" && r.qty_issued != null && r.qty_issued !== r.qty;
    out.push({ kind: "Request Stok", status: r.status,
      at: r.requested_at, decided: r.decided_at,
      code: p.sku, who: p.name,
      sub: short ? `Diminta ${N(r.qty)}, dikeluarkan ${N(r.qty_issued)}` : "",
      amt: N(short ? r.qty_issued : r.qty),
      mine: r.note, reply: r.decide_note, act: null });
  });

  DB.payments.filter(p => p.salesman_id === me && (p.rejected_at || !p.approved_at))
    .forEach(p => {
      const c = custOf(p.customer_id), inv = DB.invoices.find(v => v.id === p.invoice_id);
      out.push({ kind: "Bayaran", status: p.rejected_at ? "rejected" : "pending",
        at: p.paid_at, decided: p.rejected_at,
        code: c ? rcode(c) : "", who: c ? c.name : "—",
        sub: [inv ? inv.doc_no : "", METH[p.method] || p.method].filter(Boolean).join(" · "),
        amt: RM(p.amount),
        mine: null, reply: p.reject_note,
        act: inv ? ["order", inv.id] : null });
    });

  /* Newest movement first: a request answered this morning belongs above one
     raised last week and still waiting. */
  return out.sort((a, b) => new Date(b.decided || b.at) - new Date(a.decided || a.at));
}

/* `S.seenAt` is a snapshot taken when the screen opens, not the live value.
   Opening the screen is what marks everything read, and if the flags were
   measured against the live value they would vanish in the same frame that
   showed them. The bell's count uses the live value, so that does clear. */
const unseen = r => !!(r.decided && S.seenAt && new Date(r.decided) > new Date(S.seenAt));
const alertCount = () => {
  /* A profile restored from the offline cache may predate this column. No
     stamp means "assume seen" — a badge that cannot be cleared is worse than
     no badge. */
  if (!S.me || isMgmt() || !S.loaded || !S.me.alerts_seen_at) return 0;
  const seen = new Date(S.me.alerts_seen_at);
  return myRequests().filter(r => r.decided && new Date(r.decided) > seen).length;
};

function vNearest() {
  const me = S.here;
  const rows = DB.customers.filter(c => c.lat && c.lng).map(c => {
    let d = null;
    if (me) {
      const R = 6371, t = x => x * Math.PI / 180;
      const dLat = t(c.lat - me.lat), dLng = t(c.lng - me.lng);
      const a = Math.sin(dLat/2) ** 2 + Math.cos(t(me.lat)) * Math.cos(t(c.lat)) * Math.sin(dLng/2) ** 2;
      d = 2 * R * Math.asin(Math.sqrt(a));
    }
    return { c: c, d: d };
  }).sort((a, b) => (a.d == null ? 1 : b.d == null ? -1 : a.d - b.d));
  return backBar() + title("Nearest Reseller") + `

    ${me ? "" : `<div class="card" style="margin-bottom:14px">

}

/* Swap two stops and persist both. Positions are rewritten from 1 upward each
   time rather than nudged, so a list that has been reordered and had rows
   removed for weeks cannot drift into ties or gaps. */
async function moveStop(id, dir) {
  const rows = schedFor(S.day);
  const i = rows.findIndex(r => r.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= rows.length) return;
  const order = rows.slice();
  order[i] = rows[j]; order[j] = rows[i];
  for (let k = 0; k < order.length; k++) {
    if (order[k].position === k + 1) continue;
    const { error } = await sb.from("visit_schedule")
      .update({ position: k + 1 }).eq("id", order[k].id);
    if (error) return toast(friendly(error.message), "bad");
  }
  await loadSched();
  draw();
}

async function loadSched() {
  const { data, error } = await sb.from("visit_schedule")
    .select("*").eq("salesman_id", S.me.id).order("position");
  if (!error) DB.sched = data || [];
}

   Kelulusan — the office side
   Four of the client's screens put a request in front of somebody who is not
   the salesman: a payment waits for accounts, a price change is submitted as
   Mohon, a credit note is requested, and a stock request is approved. None of
   his forty screenshots showed the person doing the approving. This is that
   half, and it is the open question in the report answered with a proposal
   rather than left blank.
   =========================================================================== */
const isMgmt = () => !!(S.me && S.me.role === "management");
const stockQty = id => { const r = DB.reqs.find(x => x.id === id); return r ? r.qty : 0; };

/* One path for every decision, so the four workflows cannot drift apart in how
   they report success or failure. */
async function doDecide(kind, id, yes, note, qty) {
  const btn = document.querySelector("[data-a='dogo']");
  if (btn) { btn.textContent = "Menghantar…"; btn.disabled = true; }
  let res;
  if (kind === "pay")
    res = yes ? await sb.rpc("approve_payment", { p_payment: id })
              : await sb.rpc("reject_payment", { p_payment: id, p_note: note });
  else if (kind === "price")
    res = await sb.rpc("decide_price_request",
            { p_request: id, p_approve: yes, p_note: note || null });
  else if (kind === "cn")
    res = await sb.rpc("decide_credit_note",
            { p_note_id: id, p_approve: yes, p_note: note || null });
  else if (kind === "stock") {
    const r = DB.reqs.find(x => x.id === id);
    res = yes ? await sb.rpc("issue_stock", { p_salesman: r.salesman_id, p_product: r.product_id,
                   p_qty: parseInt(qty, 10) || r.qty, p_request: id })
              /* The argument is p_reason, not p_note. PostgREST resolves an
                 overload by argument name, so the wrong one does not fall back
                 to the default — it fails to find the function at all, and
                 rejecting a stock request never worked. */
              : await sb.rpc("reject_stock_request", { p_request: id, p_reason: note });
  } else return;

  $("#over").innerHTML = "";
  if (res.error) return toast(friendly(res.error.message), "bad");
  await loadAll();
  draw();
  const d = res.data || {};
  toast(yes ? (d.doc_no ? `Diluluskan · ${d.doc_no}` : "Diluluskan.") : "Ditolak.",
        yes ? "good" : "bad");
}

/* ===========================================================================
   Jadual Harian
   Built to the written requirement, which is unusually explicit about what
   this is NOT: not attendance, not visit tracking, no pending or completed
   state. It is a list of the shops a salesman means to call on, in the order
   he means to call on them. Nothing records whether he went.

   His own app contradicts that in three places (a Kerja Harian report, GPS
   route recording, a per-shop daily log), and the screen itself was never
   shared. The spec is followed here and the contradiction stays an open
   question in the report — question 32.
   =========================================================================== */
const ymd = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const dayOf = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };

function schedFor(day) {
  return DB.sched.filter(r => r.visit_on === day)
    .sort((a, b) => a.position - b.position);
}

/* Outlets worth calling on that are not yet on the list: money outstanding, or
   consignment stock sitting long enough to be worth counting. Derived, never
   stored — the salesman decides, this only saves him looking it up. */
function schedSuggest(day) {
  const on = schedFor(day).map(r => r.customer_id);
  const out = [];
  DB.customers.forEach(c => {
    if (on.indexOf(c.id) >= 0 || c.active === false) return;
    const owed = DB.invoices.filter(v => v.customer_id === c.id && v.status !== "paid")
      .reduce((a, v) => a + (+v.total - +v.paid), 0);
    const oldest = DB.consign.filter(g => g.customer_id === c.id && !g.checked_at)
      .map(g => new Date(g.sent_at)).sort((a, b) => a - b)[0];
    const days = oldest ? Math.floor((Date.now() - oldest) / 864e5) : 0;
    const due = c.term === "consign" && oldest &&
                days >= (c.service_days || 30);
    if (owed > 0.004 || due)
      out.push({ c: c, why: due ? `Baki ${days} hari — perlu disemak` : `Hutang ${RM(owed)}`,
                 rank: due ? 1 : 2, owed: owed });
  });
  return out.sort((a, b) => a.rank - b.rank || b.owed - a.owed).slice(0, 8);
}

  const strip = [];

      return `<div class="stop">

/* ===========================================================================
   Dokumen — Lihat, PDF, WhatsApp, Cetak
   One description of a document, read by the screen, the PDF and the WhatsApp
   message. Three renderings of the same paperwork must not be allowed to
   disagree about what is on it, so none of them builds its own.
   =========================================================================== */
const DOC_TITLE = { DO: "Delivery Order", SO: "Sales Order", INV: "Invois",
                    REC: "Resit Bayaran", RET: "Pulangan" };

function docFind(type, id) {
  if (type === "DO")  return DB.dos.find(x => x.id === id);
  if (type === "SO")  return DB.sos.find(x => x.id === id);
  if (type === "INV") return DB.invoices.find(x => x.id === id);
  if (type === "REC") return DB.receipts.find(x => x.id === id);
  if (type === "RET") return DB.returns.find(x => x.id === id);
  return null;
}

function docModel(type, d) {
  const c = custOf(d.customer_id);
  /* An invoice holds a total, not a line list — the goods are described once,
     on the SO it was raised from. The customer being charged has to see what
     for, so the lines are read back through that link rather than left off the
     one document they actually receive. A receipt reaches them the same way. */
  let lines = linesOf(d.id);
  if (!lines.length && type === "INV" && d.so_id) lines = linesOf(d.so_id);
  if (!lines.length && type === "REC" && d.invoice_id) {
    const inv = DB.invoices.find(x => x.id === d.invoice_id);
    if (inv && inv.so_id) lines = linesOf(inv.so_id);
  }
  if (!lines.length && type === "RET" && d.product_id)
    lines = [{ product_id: d.product_id, qty: d.qty, unit_price: 0 }];

  const rows = [["No", d.doc_no], ["Tarikh", fLong(new Date(d.issued_at))],
                ["Reseller", c ? c.name : "—"], ["Kod", c ? rcode(c) : "—"]];
  if (type === "DO")  rows.push(["Terma", "Konsainan"]);
  if (type === "SO") {
    if (d.do_id) { const o = DB.dos.find(x => x.id === d.do_id); if (o) rows.push(["Dari D/O", o.doc_no]); }
    const inv = DB.invoices.find(x => x.so_id === d.id);
    rows.push(["Invois", inv ? inv.doc_no : "Menunggu invois"]);
  }
  if (type === "INV") {
    rows.push(["Tempoh", TERM[d.term] || d.term], ["Perlu Jelas", fLong(new Date(d.due_at))]);
    const so = soOf(d.so_id); if (so) rows.push(["Dari SO", so.doc_no]);
    if (d.do_id) { const o = DB.dos.find(x => x.id === d.do_id); if (o) rows.push(["Dari D/O", o.doc_no]); }
  }
  if (type === "REC") {
    rows.push(["Cara Bayaran", METH[d.method] || d.method || "—"]);
    const inv = DB.invoices.find(x => x.id === d.invoice_id);
    if (inv) rows.push(["Invois", inv.doc_no]);
  }
  if (type === "RET") rows.push(["Sebab", RETR[d.reason] || d.reason || "—"]);

  const amt = d.total != null ? +d.total : (d.amount != null ? +d.amount : 0);
  const extra = [];
  if (type === "INV" && +d.paid > 0) {
    extra.push(["Dibayar", RM(d.paid)], ["Baki", RM(+d.total - +d.paid)]);
  }
  const stamp = type === "REC" ? "SAH / PAID"
              : (type === "INV" && d.status === "paid") ? "SETTLED" : "";
  return { type: type, id: d.doc_no, d: d, c: c, rows: rows, lines: lines, amt: amt,
           extra: extra, stamp: stamp,
           totalLabel: type === "REC" ? "DITERIMA" : type === "DO" ? "NILAI STOK" : "JUMLAH",
           noBill: type === "DO" };
}
const METH = { tunai: "Tunai", cek: "Cek", pindahan: "Pindahan Bank", gaji: "Gaji", qr: "QR Code" };
const RETR = { damaged: "Rosak", expired: "Luput", wrong_product: "Produk salah",
               wrong_qty: "Kuantiti salah", defective: "Cacat", customer_request: "Permintaan pelanggan" };

/* The same paperwork as plain text. A web page cannot attach a file to a
   WhatsApp message — only the operating system can — so the document travels
   as text, which is what a shop owner reads off their phone anyway. */
function docText(m) {
  const L = [];
  L.push("*" + CO.name + "*");
  L.push(CO.address);
  L.push(CO.phone + "  SSM " + CO.ssm, "");
  L.push("*" + (DOC_TITLE[m.type] || m.type).toUpperCase() + "*", "");
  m.rows.forEach(([k, v]) => L.push(k + ": " + v));
  if (m.lines.length) {
    L.push("", "----------------------------");
    m.lines.forEach(l => {
      const p = prodOf(l.product_id);
      L.push(p.name);
      L.push("  " + l.qty + (l.unit_price ? " x " + RM(l.unit_price) + " = " + RM(l.qty * l.unit_price)
                                          : " unit"));
    });
    L.push("----------------------------");
  }
  if (m.amt) L.push("*" + m.totalLabel + ": " + RM(m.amt) + "*");
  m.extra.forEach(([k, v]) => L.push(k + ": " + v));
  if (m.stamp) L.push("", "*" + m.stamp + "*");
  L.push("", "Terima kasih atas sokongan anda.");
  return L.join("\n");
}

/* A real PDF file, drawn at the selected roll width so it prints at its true
   size. The text is drawn rather than screenshotted: the file stays a few KB
   and the figures stay selectable. */
let PDFLIB = null;
function loadPDF() {
  if (PDFLIB) return Promise.resolve(PDFLIB);
  if (self.jspdf && self.jspdf.jsPDF) return Promise.resolve(PDFLIB = self.jspdf.jsPDF);
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload = () => { if (self.jspdf && self.jspdf.jsPDF) res(PDFLIB = self.jspdf.jsPDF);
                       else rej(new Error("Pustaka PDF tidak dapat dimuatkan.")); };
    s.onerror = () => rej(new Error("Tiada sambungan untuk memuatkan pustaka PDF."));
    document.head.appendChild(s);
  });
}
async function docPDF(m) {
  const jsPDF = await loadPDF();
  const W = S.roll === "58" ? 58 : 80;
  const PAD = 4, CW = W - PAD * 2, LH = 4;

  /* A receipt's height depends on its own content — how many lines, how far a
     long outlet name wraps. A page cannot be resized once drawn, so the whole
     receipt is laid out twice: once on a scratch page to find where it ends,
     then on a page cut to exactly that length. On a thermal roll the
     difference is paper. */
  function layout(doc) {
    let y = 8;
    const line = (t, o) => { o = o || {};
      doc.setFontSize(o.size || 7.5);
      doc.setFont("courier", o.bold ? "bold" : "normal");
      doc.splitTextToSize(String(t), CW).forEach(p => {
        doc.text(p, o.center ? W / 2 : PAD, y, o.center ? { align: "center" } : undefined);
        y += LH; });
    };
    const pair = (l, v) => { doc.setFontSize(7.5);
      doc.setFont("courier", "normal"); doc.text(String(l), PAD, y);
      doc.setFont("courier", "bold");   doc.text(String(v), W - PAD, y, { align: "right" });
      y += LH; };
    const rule = () => { doc.setLineDashPattern([0.6, 0.6], 0); doc.setLineWidth(0.15);
      doc.line(PAD, y - 2.4, W - PAD, y - 2.4); doc.setLineDashPattern([], 0); y += 1.4; };

    line(CO.name, { bold: true, size: 9, center: true });
    line(CO.address, { size: 6, center: true });
    line(CO.phone + "  SSM " + CO.ssm, { size: 6, center: true });
    y += 1.6; rule();
    line((DOC_TITLE[m.type] || m.type).toUpperCase(), { bold: true, center: true });
    y += 1.6; rule();
    m.rows.forEach(([l, v]) => pair(l, v));
    if (m.lines.length) {
      y += 1.6; rule();
      m.lines.forEach(l => { const p = prodOf(l.product_id);
        line(p.name);
        pair(l.qty + (l.unit_price ? " x " + RM(l.unit_price) : " unit"),
             l.unit_price ? RM(l.qty * l.unit_price) : ""); });
    }
    if (m.amt) { y += 1.6; rule();
      doc.setFontSize(9); doc.setFont("courier", "bold");
      doc.text(m.totalLabel, PAD, y); doc.text(RM(m.amt), W - PAD, y, { align: "right" });
      y += LH + 1; }
    m.extra.forEach(([l, v]) => pair(l, v));
    if (m.stamp) { y += 1.4; line(m.stamp, { bold: true, center: true, size: 9 }); }
    y += 2.4; rule();
    line("Terima kasih atas sokongan anda.", { size: 6, center: true });
    line("Dokumen dijana oleh " + CO.name, { size: 6, center: true });
    return y;
  }

  const H = Math.max(50, layout(new jsPDF({ unit: "mm", format: [W, 600] })) + 6);
  const doc = new jsPDF({ unit: "mm", format: [W, H], compress: true });
  layout(doc);
  doc.setProperties({ title: m.type + " " + m.id, author: CO.name,
                      subject: m.c ? m.c.name : "" });
  doc.save(m.type + "-" + m.id + ".pdf");
}

/* ===========================================================================
   Ambil Order
   One screen, three outcomes, decided by the outlet's payment term — which is
   the whole point of the requirement's "payment term is not a due date".
     Konsainan   → stock is dropped. A delivery order, nothing billed.
     Bill To Bil → a sale. SO and invoice, due by the agreed term.
     Tunai       → a sale paid on the spot. SO, invoice, payment, receipt.
   =========================================================================== */
function vTakeOrder(id) {
  const c = custOf(id);
  if (!c) return backBar(true) + `<div class="body pad"><div class="empty"><b>Tiada rekod</b></div></div>`;
  const consign = c.term === "consign";
  const cash = c.term === "cash";
  const d = S.ord || (S.ord = { lines: {}, price: {}, method: "tunai" });
  const avail = DB.products.filter(p => (DB.van[p.id] || 0) > 0);

  return backBar(true) + title(consign ? "Hantar Stok" : "Ambil Order") + `
  <div class="body pad">
    <div class="cust">
      <div class="t"><span class="code">${esc(rcode(c))}</span>
        <div class="nm">${esc(c.name)}</div>
        <div class="ad">${esc([c.address, c.district].filter(Boolean).join(", "))}</div></div>
      <span class="term">${esc(TERM[c.term] || c.term)}</span>
    </div>

    ${avail.length ? `
    <div class="block">
      <table class="t tight"><thead><tr>
        <th>Produk</th><th class="r">Harga</th><th class="c">Kuantiti</th><th class="r">Jumlah</th>
      </tr></thead><tbody>${avail.map(p => {
        const van = DB.van[p.id] || 0;
        /* An approved Tukar Harga is a standing price for this outlet, so it
           is what the order opens at rather than the list price. */
        const own = DB.custPrices.find(x => x.customer_id === id && x.product_id === p.id);
        const base = own ? +own.price : +p.price;
        const pr = d.price[p.id] != null ? d.price[p.id] : base.toFixed(2);
        return `<tr data-ol="${p.id}">
          <td class="pname">${esc(p.name)}
            <div style="font-size:11px;color:var(--dim);font-weight:400">
              Van ${N(van)} · Lantai ${(+p.floor_price).toFixed(2)}</div>
            ${own ? `<div style="font-size:11px;color:var(--grn-d);font-weight:600">
              Harga diluluskan</div>` : ""}</td>
          <td class="r"><input class="qin pin" type="number" step="0.01"
            min="${p.floor_price}" inputmode="decimal" data-op="${p.id}" value="${esc(pr)}"></td>
          <td class="c">${stepper(`<input class="qin" type="number" min="0" max="${van}"
            inputmode="numeric" data-oq="${p.id}" value="${d.lines[p.id] || ""}"
            placeholder="0">`)}</td>
          <td class="r" data-ot="${p.id}"></td></tr>`;
      }).join("")}</tbody></table>
      <div class="tfoot">
        <div><span>Total Kuantiti :</span><b id="ordQty">0</b></div>
        <div><span>Total :</span><b id="ordTotal">${RM(0)}</b></div>
      </div>
    </div>

    ${cash ? `<div class="f"><label>Cara Bayaran</label><div class="chips">
      ${[["tunai","Tunai"],["cek","Cek"],["pindahan","Pindahan Bank"],["gaji","Gaji"],["qr","QR Code"]]
        .map(([k,l]) => `<button data-a="ordmeth" data-v="${k}"
          class="${d.method === k ? "on" : ""}">${l}</button>`).join("")}
    </div></div>` : ""}

    <p class="hint">${consign
      ? "Konsainan: stok ini dihantar dan belum dibilkan. Bil dikira pada lawatan berikutnya melalui Semak Baki Stok."
      : cash ? "Tunai: Invois dan resit dijana serentak, dibayar penuh sekarang."
             : `Bill To Bil: Invois dijana dan perlu dijelaskan dalam ${c.term_months || 2} bulan.`}
      Harga boleh diturunkan sehingga harga lantai sahaja. Kuantiti dihadkan kepada stok dalam van.</p>
    <p class="hint">Reka bentuk asal menguruskan perubahan harga melalui permohonan
      (<b>Mohon</b>) pada profil reseller, bukan pada skrin order. Soalan terbuka dalam laporan.</p>

    <button class="rowbtn ${consign ? "" : "g"}" data-a="ordcalc" data-id="${id}">
      ${consign ? "Hantar Stok" : "Hantar Order"}</button>`
    : `<div class="empty"><b>Van kosong</b>
        <span>Tiada stok dalam van anda. Buat Stok Request dahulu.</span></div>`}
  </div>`;
}

/* Totals are rewritten in place rather than by re-rendering, because a form
   that re-renders on every keystroke loses the caret and the phone keyboard
   with it. */
function ordRecalc() {
  let qty = 0, total = 0;
  document.querySelectorAll("[data-ol]").forEach(row => {
    const id = row.dataset.ol;
    const q = parseInt((row.querySelector("[data-oq]") || {}).value, 10) || 0;
    const p = parseFloat((row.querySelector("[data-op]") || {}).value) || 0;
    const cell = row.querySelector("[data-ot]");
    const amt = Math.round(q * p * 100) / 100;
    /* Blank, not a dash: a dash in a money column beside a − button reads as
       another control. */
    if (cell) cell.textContent = q > 0 ? RM(amt) : "";
    qty += q; total += amt;
  });
  const a = $("#ordQty"), b = $("#ordTotal");
  if (a) a.textContent = N(qty);
  if (b) b.textContent = RM(Math.round(total * 100) / 100);
}

function ordHarvest() {
  const d = S.ord; if (!d) return;
  d.lines = {}; d.price = {};

/* ===========================================================================
   Semak Baki Stok — the consignment balance check
   The salesman counts what is left on the shelf; the system works out what
   sold and raises one bill for the visit.
   =========================================================================== */

/* Open consignment stock for one outlet, grouped by product, newest drop
   first. The order matters: the balance is assigned to the newest rows, so
   the oldest units are the ones treated as sold. */
function cgOpen(custId) {
  const rows = DB.consign.filter(g => g.customer_id === custId && !g.checked_at)
    .sort((a, b) => new Date(b.sent_at) - new Date(a.sent_at));
  const by = {};
  rows.forEach(r => { (by[r.product_id] = by[r.product_id] || []).push(r); });
  return Object.keys(by).map(pid => ({
    product_id: pid,
    name: prodOf(pid).name,
    rows: by[pid],
    sent: by[pid].reduce((a, r) => a + r.qty_sent, 0),
  })).sort((a, b) => a.name.localeCompare(b.name));
}

/* The same allocation the database performs, so the figure on screen is the
   figure that gets billed. If these two ever disagree the salesman is the one
   who finds out, standing at a counter. */
function cgPlan(custId, counts) {
  const out = { lines: [], total: 0, sold: 0 };
  cgOpen(custId).forEach(g => {
    const bal = counts[g.product_id];
    if (bal == null) return;
    let left = bal;
    g.rows.forEach(r => {
      const rowBal = Math.min(r.qty_sent, left);
      left -= rowBal;
      const sold = r.qty_sent - rowBal;
      if (sold > 0) {
        out.lines.push({ name: g.name, qty: sold, price: +r.unit_price,
                         amount: Math.round(sold * r.unit_price * 100) / 100 });
        out.total += Math.round(sold * r.unit_price * 100) / 100;
        out.sold += sold;
      }
    });
  });
  out.total = Math.round(out.total * 100) / 100;
  return out;
}

      <button class="rowbtn" type="submit" id="go">${S.busy ? "Sedang masuk…" : "Log masuk"}</button>

}

/* ===========================================================================
   Render
   =========================================================================== */
function draw() {
  let h;
  if (!sb)           h = vLogin();
  else if (!S.ready) h = `<div class="boot"><div style="text-align:center"><div class="spin"></div>
      <p style="margin-top:14px;font-size:14px;opacity:.9">Menyemak sesi…</p></div></div>`;
  else if (!S.me)    h = vLogin();
  else if (!S.loaded) h = `<div class="boot"><div style="text-align:center"><div class="spin"></div>
      <p style="margin-top:14px;font-size:14px;opacity:.9">Memuatkan data…</p></div></div>`;
  else {
    const t = cur();
    let v;
    if (!t) v = S.tab === "home" ? (isMgmt() ? vApprovals() : vHome())
            : S.tab === "reseller" ? vReseller()
            : S.tab === "stok" ? vStok() : S.tab === "gps" ? vGps() : vRanking();
    else if (t.name === "sales")     v = vSales();
    else if (t.name === "dolist")    v = vDoList();
    else if (t.name === "hutang")    v = vHutang();
    else if (t.name === "kesimpulan")v = vKesimpulan();
    else if (t.name === "order")     v = vOrder(t.id);
    else if (t.name === "dodet")     v = vDoDet(t.id);
    else if (t.name === "cust")      v = vCust(t.id, t.sub);
    else if (t.name === "stockreq")  v = vStockReq();
    else if (t.name === "reqhist")   v = vReqHist();
    else if (t.name === "requests")  v = vRequests();
    else if (t.name === "nearest")   v = vNearest();
    else if (t.name === "register")  v = vRegister();
    else if (t.name === "cgcheck")   v = vCgCheck(t.id);
    else if (t.name === "takeorder") v = vTakeOrder(t.id);
    else if (t.name === "doc")       v = vDoc(t.t, t.id);
    else if (t.name === "return")    v = vReturn(t.id);
    else if (t.name === "jadual")    v = vJadual();
    else if (t.name === "settings")  v = vSettings();
    else v = `<div class="body pad"><div class="empty"><b>Tiada skrin</b></div></div>`;
    h = v + tabBar();
  }
  $("#app").innerHTML = h;
  document.body.dataset.rk = (!cur() && S.tab === "ranking" && S.me && S.loaded) ? "1" : "";
  chrome();
  const q = $("#q"); if (q) { q.oninput = e => { S.q = e.target.value; redrawBody(); }; }
  /* A "Cetak" button promises the print dialog, so opening the document view
     from one goes straight there once the page has settled. */
  const t = cur();
  if (t && t.name === "doc" && t.auto) { t.auto = false; setPaper();
    setTimeout(() => window.print(), 400); }
  /* A stop's remark saves when the salesman leaves the field. Re-rendering on
     every keystroke would close the keyboard mid-note. */
  document.querySelectorAll("[data-jr]").forEach(i => {
    i.onchange = async () => {
      const { error } = await sb.from("visit_schedule")
        .update({ remark: i.value.trim() || null }).eq("id", i.dataset.jr);
      if (error) return toast(friendly(error.message), "bad");
      const row = DB.sched.find(r => r.id === i.dataset.jr);
      if (row) row.remark = i.value.trim() || null;
      toast("Catatan disimpan.", "good");
    };
  });
  /* Order totals update as the salesman types, without re-rendering. */
  if (document.querySelector("[data-ol]")) {
    document.querySelectorAll("[data-oq],[data-op]").forEach(i => { i.oninput = ordRecalc; });
    ordRecalc();
  }
  /* Photographs are held as File objects with a preview URL until registration
     succeeds and there is a folder to put them in. */
  document.querySelectorAll("[data-rp]").forEach(inp => {
    inp.onchange = e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (file.size > 12 * 1024 * 1024) return toast("Gambar terlalu besar (maksimum 12MB).", "bad");
      const kind = e.target.dataset.rp;
      if (kind === "return" && S.ret) {
        if (S.ret.photo && S.ret.photo.url) URL.revokeObjectURL(S.ret.photo.url);
        retHarvest();
        S.ret.photo = { file: file, url: URL.createObjectURL(file) };
        return draw();
      }
      if (!S.reg) return;
      const old = S.reg.photos[kind];
      if (old && old.url) URL.revokeObjectURL(old.url);
      regHarvest();
      S.reg.photos[kind] = { file: file, url: URL.createObjectURL(file) };
      S.reg.err = "";          /* the complaint is answered; stop showing it */
      draw();
    };
  });
  if (!S.me && !S.busy) { const e = $("#em"); if (e) (e.value ? $("#pw") : e).focus(); }
}
/* Typing in a search box must not steal focus by re-rendering the input, so
   the list is redrawn without touching the field. */
function redrawBody() {
  const q = $("#q"), pos = q ? q.selectionStart : 0, val = q ? q.value : "";
  draw();
  const n = $("#q");
  if (n) { n.value = val; n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {} }
}

    const c = custOf(el.dataset.id), d = S.ord;
    const ids = Object.keys(d.lines);
    if (!ids.length) return toast("Masukkan sekurang-kurangnya satu kuantiti.", "bad");
    for (const id of ids) {
      const p = prodOf(id), van = DB.van[id] || 0;
      const price = parseFloat(d.price[id]);
      if (d.lines[id] > van)
        return toast(`${p.name}: van ada ${van} sahaja.`, "bad");
      if (!(price > 0))
        return toast(`${p.name}: harga tidak sah.`, "bad");
      if (price < +p.floor_price - 0.0001)
        return toast(`${p.name}: harga lantai ${RM(p.floor_price)}.`, "bad");

    ordConfirm(el.dataset.id);

    const id = el.dataset.id, c = custOf(id), d = S.ord;

      ? await sb.rpc("post_consign_drop", { p_customer: id, p_lines: lines })
      : await sb.rpc("post_sale", { p_customer: id, p_lines: lines,
          p_pay_now: c.term === "cash", p_method: c.term === "cash" ? d.method : null });
