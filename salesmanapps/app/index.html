  },

  /* ---- consignment balance check ---- */
  cgcheck(el) { S.cg = {}; push("cgcheck", { id: el.dataset.id }); },
  cgcalc() {
    const t = cur(); if (!t) return;
    S.cg = {};
    let any = false, bad = null;
    document.querySelectorAll("[data-cg]").forEach(i => {
      const v = i.value.trim();
      if (v === "") return;
      const n = parseInt(v, 10), max = +i.getAttribute("max");
      if (!(n >= 0) || n > max) { bad = bad || `Baki mesti antara 0 dan ${max}.`; return; }
      S.cg[i.dataset.cg] = n; any = true;
    });
    if (bad)  return toast(bad, "bad");
    if (!any) return toast("Masukkan baki bagi sekurang-kurangnya satu produk.", "bad");
    const plan = cgPlan(t.id, S.cg);
    if (!plan.lines.length)
      return toast("Tiada unit terjual, jadi tiada apa untuk dibilkan.", "bad");
    cgConfirm(t.id, plan);
  },
  async cgpost(el) {
    const id = el.dataset.id;
    const counts = Object.keys(S.cg).map(p => ({ product_id: p, balance: S.cg[p] }));
    el.textContent = "Menghantar…"; el.disabled = true;
    const { data, error } = await sb.rpc("post_consign_check",
      { p_customer: id, p_counts: counts });
    if (error) { $("#over").innerHTML = ""; return toast(friendly(error.message), "bad"); }
    $("#over").innerHTML = "";
    S.cg = {};
    await loadAll();
    pop();
    toast(`${data.invoice_no} · ${RM(data.total)} — ${data.sold} unit terjual.`, "good");
  },

  /* ---- registration ---- */
  regstart() { regInit(); push("register"); },
  regagain() { regInit(); draw(); scrollTo(0, 0); },
  regpick(el) { regHarvest(); S.reg.f[el.dataset.k] = el.dataset.v; draw(); },
  regoff(el) {
    regHarvest();
    const i = +el.dataset.v, a = S.reg.f.off || (S.reg.f.off = []);
    const at = a.indexOf(i); if (at >= 0) a.splice(at, 1); else a.push(i);
    draw();
  },
  regback() { regHarvest(); S.reg.err = ""; S.reg.step--; draw(); scrollTo(0, 0); },
  regnext() {
    regHarvest();
    const f = S.reg.f, st = S.reg.step;
    const miss = n => { S.reg.err = n; draw(); scrollTo(0, 0); return true; };
    if (st === 0 && !(f.name || "").trim())    return miss("Nama kedai diperlukan.");
    if (st === 1 && !(f.address || "").trim()) return miss("Alamat diperlukan.");
    if (st === 2 && !(f.pic || "").trim())     return miss("Nama penjaga diperlukan.");
    if (st === 2 && !(f.phone || "").trim())   return miss("No. telefon diperlukan.");
    if (st === 4) {
      const need = PHOTOS.filter(p => p[2] && !S.reg.photos[p[0]]);
      if (need.length) return miss("Gambar diperlukan: " + need.map(p => p[1]).join(", ") + ".");
    }
    S.reg.err = ""; S.reg.step++; draw(); scrollTo(0, 0);
  },
  reggps() {
    if (!navigator.geolocation) return toast("Peranti tidak menyokong GPS.", "bad");
    regHarvest();
    toast("Mengambil lokasi…");
    navigator.geolocation.getCurrentPosition(
      p => { S.reg.f.lat = p.coords.latitude; S.reg.f.lng = p.coords.longitude; draw(); },
      () => toast("Tidak dapat lokasi. Semak kebenaran.", "bad"),
      { enableHighAccuracy: true, timeout: 10000 });
  },
  async regsubmit() {
    regHarvest();
    const f = S.reg.f;
    if (S.reg.f.term === "consign" && !S.reg.photos.consign_form)
      { S.reg.err = "Gambar borang konsainan yang ditandatangani diperlukan."; return draw(); }
    S.reg.busy = true; S.reg.err = ""; draw();

    const lines = Object.keys(S.reg.lines).map(id => {
      const p = DB.products.find(x => x.id === id);
      return { product_id: id, qty: S.reg.lines[id], price: p ? p.price : 0 };
    });
    const months = parseInt(f.service_month, 10);
    const payload = {
      name: f.name, app_name: f.app_name, ssm_name: f.ssm_name, ssm: f.ssm,
      reseller_code: f.reseller_code, outlet_type: f.outlet_type,
      address: f.address, postcode: f.postcode, town: f.town, district: f.district,
      state: f.state, country: f.country, lat: f.lat, lng: f.lng,
      pic: f.pic, pic_ic: f.pic_ic, phone: f.phone, whatsapp: f.whatsapp,
      office_phone: f.office_phone, email: f.email,
      pic_off_days: f.off || [], pic_open_time: f.pic_open_time, pic_close_time: f.pic_close_time,
      term: f.term, term_months: f.term_months, credit_limit: f.credit_limit,
      service_days: months > 0 ? months * 30 : null,
      commission_grp: f.commission_grp, excel_grp: f.excel_grp,
      lines: lines,
      /* A cash opening order is paid on the spot, so how it was paid has to be
         recorded with it. Leaving this out made the database fall back to its
         own default and the money arrived under a method nobody chose. */
      method: f.term === "cash" ? (f.method || "tunai") : null,
    };
    const { data, error } = await sb.rpc("register_customer", { p: payload });
    if (error) { S.reg.busy = false; S.reg.err = friendly(error.message); return draw(); }

    /* The customer exists now, so the photographs have a folder to go in.
       A failed upload must not undo a real registration — it is reported and
       the photographs can be added again from the profile. */
    const failed = [];
    for (const kind of Object.keys(S.reg.photos)) {
      try { await uploadPhoto(data.customer_id, kind, S.reg.photos[kind].file); }
      catch (e) { failed.push(kind); }
    }
    const op = data.opening;
    S.reg.busy = false;
    S.reg.done = {
      id: data.customer_id, code: data.code, name: f.name,
      opening: op ? (op.do_no ? `${op.do_no} · ${RM(op.total)}`
                              : `${op.so_no || ""} ${op.invoice_no || ""} · ${RM(op.total)}`.trim())
                  : "",
      photos: failed.length ? "" : `${Object.keys(S.reg.photos).length} gambar dimuat naik.`,
      warn: failed.length
        ? `Reseller sudah didaftarkan, tetapi ${failed.length} gambar gagal dimuat naik ` +
          `(${failed.join(", ")}). Cuba muat naik semula dari Galeri.` : "",
    };
    await loadAll();
    draw(); scrollTo(0, 0);
    toast(`Reseller ${data.code} didaftarkan.`, "good");
  },

  install()  { if (!deferredInstall) return; deferredInstall.prompt();
               deferredInstall.userChoice.finally(() => { deferredInstall = null; chrome(); }); },
  noinstall(){ installDismissed = true;
               try { localStorage.setItem("sa.install", "no"); } catch (_) {} chrome(); },
  async refresh() { await loadMe(); draw(); },
  async reload()  { S.loaded = false; draw(); await loadAll(); draw(); toast("Data dimuat semula.", "good"); },
  async signout() {
    S.me = null; S.data = null; S.stack = []; S.tab = "home"; S.err = ""; S.loaded = false;
    try { localStorage.removeItem(WHO); } catch (_) {}
    try { if (sb) await sb.auth.signOut(); } catch (_) {}
    draw();
  },
  closeover() { $("#over").innerHTML = ""; },
};

let calFrom = null, calTo = null, calMon = null, calDone = null;
function openCal(done) {
  calFrom = S.range ? S.range.from : null; calTo = S.range ? S.range.to : null;
  calMon = new Date((calFrom || new Date()).getFullYear(), (calFrom || new Date()).getMonth(), 1);
  calDone = done; drawCal();
}
function drawCal() {
  const y = calMon.getFullYear(), m = calMon.getMonth();
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  let cells = "";
  for (let i = 0; i < first; i++) cells += `<button disabled></button>`;
  for (let d = 1; d <= days; d++) {
    const t = new Date(y, m, d).getTime();
    const a = calFrom && calFrom.getTime(), b = calTo && calTo.getTime();
    const pick = t === a || t === b;
    const mid = a && b && t > a && t < b;
    cells += `<button data-cd="${d}" class="${pick ? "pick" : mid ? "in" : ""}">${d}</button>`;
  }
  $("#over").innerHTML = `<div class="modal"><div class="mbox"><div class="mi">
    <div class="cal-h"><button data-cm="-1">&lsaquo;</button>
      <span>${MONS[m]} ${y}</span><button data-cm="1">&rsaquo;</button></div>
    <div class="cal-g">${["S","M","T","W","T","F","S"].map(d => `<span class="dow">${d}</span>`).join("")}
      ${cells}</div>
    <div class="cal-a"><button class="no" data-a="closeover">Cancel</button>
      <button class="yes" data-ok="1">Pengesahan</button></div>
  </div></div></div>`;
}

let payInv = null, payKind = "", payMethod = "";
function openPay(id) {
  payInv = DB.invoices.find(v => v.id === id);
  payKind = ""; payMethod = "";
  drawPay(1);
}
function drawPay(step) {
  if (!payInv) return;
  const bal = Number(payInv.total) - Number(payInv.paid);
  let inner;
  if (step === 1) {
    const kinds = [["partial", "Partial Payment"], ["paid", "Paid"], ["over", "Over Payment"]];
    inner = `<div class="pay-tot">Total Pay : <b>${RM(bal)}</b></div>
      ${kinds.map(([k, l]) => `<button class="ck ${payKind===k?"on":""}" data-pk="${k}">
        <i></i><span>${l}</span></button>`).join("")}
      ${payKind === "over" ? `<div class="err" style="margin:14px 0 0">
        Lebihan bayaran masih ditolak oleh pangkalan data. Keputusan diperlukan: lebihan
        dibawa ke bil berikutnya, atau dipulangkan? Ada dalam laporan.</div>` : ""}
      <button class="rowbtn b" data-pn="1" ${payKind && payKind !== "over" ? "" : "disabled"}>Next</button>`;
  } else {
    const ms = [["tunai","Tunai"],["cek","Cek"],["pindahan","Pindahan Bank"],
                ["gaji","Gaji"],["qr","QR Code"]];
    inner = `<div class="pay-tot">Total Pay : <b>${RM(bal)}</b></div>
      <h5>Cara Bayaran</h5>
      ${ms.map(([k, l]) => `<button class="ck ${payMethod===k?"on":""}" data-pm="${k}">
        <i></i><span>${l}</span></button>`).join("")}
      <h5>Jumlah Bayaran</h5>
      <div class="f" style="margin-bottom:6px"><input id="pamt" type="number" step="0.01" min="0.01"
        inputmode="decimal" value="${payKind === "paid" ? bal.toFixed(2) : ""}"
        placeholder="${bal.toFixed(2)}" ${payKind === "paid" ? "readonly" : ""}></div>
      <h5>Komen</h5>
      <div class="f"><textarea id="pcom" placeholder="Komen"></textarea></div>
      <button class="rowbtn g" data-pc="1">Pengesahan</button>
      <p class="hint" style="margin-top:10px">Komen belum disimpan — tiada ruangan untuk
        catatan pada jadual bayaran. Ada dalam laporan.</p>`;
  }
  $("#over").innerHTML = `<div class="modal"><div class="mbox">
    <div class="mh"><b>Pesanan Terkini</b><button data-a="closeover">&times;</button></div>
    <div class="mi">${inner}</div></div></div>`;
}
async function confirmPay() {
  const amt = parseFloat(($("#pamt") || {}).value || "0");
  const bal = Number(payInv.total) - Number(payInv.paid);
  if (!payMethod) return toast("Pilih cara bayaran.", "bad");
  if (!(amt > 0))  return toast("Masukkan jumlah bayaran.", "bad");
  if (amt > bal + 0.001) return toast("Jumlah melebihi baki. Pilih Partial atau Paid.", "bad");
  const btn = document.querySelector("[data-pc]");
  if (btn) { btn.textContent = "Menghantar…"; btn.disabled = true; }
  const { error } = await sb.rpc("post_payment",
    { p_invoice: payInv.id, p_amount: amt, p_method: payMethod });
  if (error) { drawPay(2); return toast(friendly(error.message), "bad"); }
  $("#over").innerHTML = "";
  toast("Bayaran direkod. Resit dijana.", "good");
  await loadAll();
  draw();
}
function friendly(m) {
  const s = (m || "").toLowerCase();
  if (s.includes("already settled")) return "Invois ini sudah dijelaskan.";
  if (s.includes("exceeds")) return "Jumlah melebihi baki tertunggak.";
  if (s.includes("another salesman")) return "Outlet ini dipegang salesman lain.";
  if (s.includes("failed to fetch")) return "Tiada sambungan. Semak internet anda.";
  return m;
}

/* ===========================================================================
   Events
   =========================================================================== */
/* A − / + tap on a quantity field. The input's own min/max/step are the rule,
   and the synthetic `input` event is what makes the running totals, the draft
   harvesters and everything else already bound to typing fire unchanged. */
function bump(inp, dir) {
  const stp  = parseFloat(inp.getAttribute("step")) || 1;
  const lo   = inp.getAttribute("min") === null ? -Infinity : +inp.getAttribute("min");
  const hi   = inp.getAttribute("max") === null ?  Infinity : +inp.getAttribute("max");
  const had  = inp.value.trim() !== "";
  if (!had && dir < 0) return;            /* empty already means none */
  let n = Math.round(((parseFloat(inp.value) || 0) + dir * stp) * 1000) / 1000;
  if (n > hi) { n = hi; toast(`Maksimum ${N(hi)}.`, "bad"); }
  if (n < lo) n = lo;
  inp.value = String(n);
  inp.dispatchEvent(new Event("input", { bubbles: true }));
}

document.addEventListener("click", e => {
  const qs = e.target.closest("[data-qs]");
  if (qs) {
    e.preventDefault();
    const inp = qs.parentNode.querySelector("input");
    if (inp) bump(inp, +qs.dataset.qs);
    return;
  }
  /* calendar */
  const cd = e.target.closest("[data-cd]");
  if (cd) {
    const d = new Date(calMon.getFullYear(), calMon.getMonth(), +cd.dataset.cd);
    if (!calFrom || (calFrom && calTo)) { calFrom = d; calTo = null; }
    else if (d < calFrom) { calTo = calFrom; calFrom = d; }
    else calTo = d;
    return drawCal();
  }
  const cm = e.target.closest("[data-cm]");
  if (cm) { calMon = new Date(calMon.getFullYear(), calMon.getMonth() + (+cm.dataset.cm), 1);
            return drawCal(); }
  if (e.target.closest("[data-ok]")) {
    if (!calFrom) return;
    S.range = { from: calFrom, to: calTo || calFrom };
    $("#over").innerHTML = "";
    return calDone ? calDone(S.range) : draw();
  }
  /* payment */
  const pk = e.target.closest("[data-pk]");
  if (pk) { payKind = pk.dataset.pk; return drawPay(1); }
  if (e.target.closest("[data-pn]")) return drawPay(2);
  const pm = e.target.closest("[data-pm]");
  if (pm) { payMethod = pm.dataset.pm; const amt = ($("#pamt")||{}).value;
            drawPay(2); const n = $("#pamt"); if (n && amt) n.value = amt; return; }
  if (e.target.closest("[data-pc]")) { confirmPay(); return; }

  const el = e.target.closest("[data-a]");
  if (!el || el.tagName === "FORM") return;
  if (el.tagName === "A") return;                  /* real links open normally */
  e.preventDefault();
  /* a tap on the scrim closes it, a tap inside must not */
  if (el.dataset.a === "closeover" && e.target !== el &&
      !e.target.closest(".cal-a") && !e.target.closest(".mh")) {
    if (e.target.closest(".sheet") && !e.target.closest(".rowbtn")) return;
    if (e.target.closest(".mbox") && !e.target.closest(".mh")) return;
  }
  const fn = A[el.dataset.a];
  if (fn) { const r = fn(el); if (r && r.catch) r.catch(err => toast(friendly(err.message), "bad")); }
});

document.addEventListener("submit", async e => {
  const f = e.target.closest('[data-a="login"]');
  if (!f) return;
  e.preventDefault();
  const em = ($("#em") || {}).value || "", pw = ($("#pw") || {}).value || "";
  S.lastEmail = em;
  if (!em.trim() || !pw) { S.err = "Sila isi e-mel dan kata laluan."; return draw(); }
  S.busy = true; S.err = ""; draw();
  const { data, error } = await sb.auth.signInWithPassword({ email: em.trim(), password: pw });
  S.busy = false;
  if (error) { S.err = authMsg(error.message); return draw(); }
  S.email = data.user.email;
  await loadMe();
  draw();
  if (S.me) loadAll().then(draw);
});
function authMsg(m) {
  const s = (m || "").toLowerCase();
  if (s.includes("invalid login")) return "E-mel atau kata laluan salah. Cuba lagi.";
  if (s.includes("banned")) return "Akses akaun ini sudah ditarik balik. Hubungi pengurusan.";
  if (s.includes("failed to fetch")) return "Tiada sambungan. Semak internet anda.";
  return m;
}

/* ===========================================================================
   Data
   =========================================================================== */
const WHO = "sa.who";
const cacheWho = p => { try { localStorage.setItem(WHO, JSON.stringify(p)); } catch (_) {} };
const cachedWho = id => {
  try { const p = JSON.parse(localStorage.getItem(WHO) || "null");
        return p && p.id === id ? p : null; } catch (_) { return null; }
};

async function loadMe(opts) {
  opts = opts || {};
  let user = opts.session && opts.session.user;
  if (!user) {
    const { data } = await sb.auth.getUser().catch(() => ({ data: {} }));
    user = data && data.user;
  }
  if (!user) { S.me = null; return; }
  S.email = user.email;
  const { data: p, error } = await sb.from("profiles")
    .select("id,name,code,zone,role,active,alerts_seen_at").eq("id", user.id).maybeSingle();
  if (error) {
    /* A token we already hold is evidence enough to open the app. The figures
       inside stay as dashes until the signal returns, so nothing unverified is
       ever shown as fact. */
    const c = cachedWho(user.id);
    if (c) { S.me = c; S.data = null; return; }
    S.me = null; S.err = "Tiada sambungan. Semak internet anda."; return;
  }
  if (!p) { S.me = null; S.err = "Tiada profil untuk akaun ini."; return; }
  if (p.active === false) {
    S.me = null; S.err = "Akses akaun ini sudah ditarik balik.";
    try { localStorage.removeItem(WHO); } catch (_) {}
    await sb.auth.signOut(); return;
  }
  S.me = p; cacheWho(p);
}

async function loadAll() {
  if (!S.me) return;
  try {
    const [prod, cust, inv, so, d_o, lines, pay, cg, req, van, ret, rec, co, sch,
           prq, cnq, cpq, prof] = await Promise.all([
      sb.from("products").select("*").eq("active", true).order("sku"),
      sb.from("customers").select("*").order("code"),
      sb.from("invoices").select("*").order("issued_at", { ascending: false }),
      sb.from("sales_orders").select("*").order("issued_at", { ascending: false }),
      sb.from("delivery_orders").select("*").order("issued_at", { ascending: false }),
      sb.from("doc_lines").select("kind,doc_id,product_id,qty,unit_price"),
      sb.from("payments").select("*").order("paid_at", { ascending: false }),
      sb.from("consignments").select("*").order("sent_at", { ascending: false }),
      sb.from("stock_requests").select("*").order("requested_at", { ascending: false }),
      sb.from("van_stock").select("product_id,qty").eq("salesman_id", S.me.id),
      sb.from("returns").select("*").order("issued_at", { ascending: false }),
      sb.from("receipts").select("*").order("issued_at", { ascending: false }),
      sb.from("company").select("*").maybeSingle(),
      sb.from("visit_schedule").select("*").eq("salesman_id", S.me.id).order("position"),
      sb.from("price_requests").select("*").order("requested_at", { ascending: false }),
      sb.from("credit_notes").select("*").order("requested_at", { ascending: false }),
      sb.from("customer_prices").select("*"),
      sb.from("profiles").select("id,name,code,zone,role").eq("role", "salesman").order("code"),
    ]);
    /* The company row and receipts are not worth failing the whole load over —
       documents degrade to placeholders, everything else still works. */
    const bad = [prod, cust, inv, so, d_o, lines, pay, cg, req, van, ret].find(r => r.error);
    if (bad) { S.loaded = true; S.data = null; return toast(friendly(bad.error.message), "bad"); }
    DB.receipts = (rec && rec.data) || [];
    DB.sched = (sch && sch.data) || [];
    DB.priceReqs   = (prq && prq.data) || [];
    DB.creditNotes = (cnq && cnq.data) || [];
    DB.custPrices  = (cpq && cpq.data) || [];
    DB.profiles    = (prof && prof.data) || [];
    if (co && co.data) CO = {
      name: co.data.name || CO.name, address: co.data.address || CO.address,
      phone: co.data.phone || CO.phone, ssm: co.data.ssm || CO.ssm };

    DB.products = prod.data || [];
    DB.customers = cust.data || [];
    DB.invoices = inv.data || [];
    DB.sos = so.data || [];
    DB.dos = d_o.data || [];
    DB.payments = pay.data || [];
    DB.consign = cg.data || [];
    DB.reqs = req.data || [];
    DB.returns = ret.data || [];
    DB.lines = {};
    (lines.data || []).forEach(l => { (DB.lines[l.doc_id] = DB.lines[l.doc_id] || []).push(l); });
    DB.van = {};
    (van.data || []).forEach(v => { DB.van[v.product_id] = v.qty; });

    const day = dOnly(new Date());
    const todayPay = DB.payments.filter(p => new Date(p.paid_at) >= day);
    const todaySo  = DB.sos.filter(s => new Date(s.issued_at) >= day);
    S.data = {
      received: todayPay.reduce((a, p) => a + Number(p.amount), 0),
      qty: todaySo.reduce((a, s) => a + linesOf(s.id).reduce((b, l) => b + l.qty, 0), 0),
      stock: Object.values(DB.van).reduce((a, n) => a + n, 0),
    };
    S.loaded = true;
    if (S.tab === "ranking") loadRanking();
  } catch (e) {
    S.loaded = true; S.data = null;
    toast(friendly(e.message), "bad");
  }
}

async function loadRanking() {
  const now = new Date();
  let from, to;
  if (S.rkPeriod === "last") {
    from = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    to   = new Date(now.getFullYear(), now.getMonth(), 1);
  } else if (S.rkPeriod === "custom" && S.range) {
    from = S.range.from; to = new Date(S.range.to.getTime() + 864e5);
  } else {
    from = new Date(now.getFullYear(), now.getMonth(), 1);
    to   = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  }
  const { data, error } = await sb.rpc("ranking_board",
    { p_from: from.toISOString(), p_to: to.toISOString() });
  S.rkRows = error ? [] : (data || []);
  if (error) toast(friendly(error.message), "bad");
  draw();
}

/* One photograph, in three steps: ask the edge function to sign a path it has
   judged this salesman entitled to, PUT the file straight at storage, then
   record it. The file never passes through a JSON body, so a 4MB photo on a
   weak signal is one upload rather than a 5.5MB request. */
async function uploadPhoto(customerId, kind, file) {
  const { data: { session } } = await sb.auth.getSession();
  const call = body => fetch(`${SB_URL}/functions/v1/reseller-upload`, {
    method: "POST",
    headers: { "content-type": "application/json",
               authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify(body),
  }).then(async r => {
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `upload failed (${r.status})`);
    return j;
  });

  const signed = await call({ action: "sign-upload", customer_id: customerId, kind: kind,
                              content_type: file.type });
  const put = await fetch(signed.signedUrl, {
    method: "PUT",
    headers: { "content-type": file.type, "x-upsert": "true" },
    body: file,
  });
  if (!put.ok) throw new Error(`storage refused the file (${put.status})`);
  await call({ action: "record", customer_id: customerId, kind: kind, path: signed.path });
  if (S.gal) delete S.gal[customerId];
  return signed.path;
}

/* Registration photographs, fetched through the edge function that signs a
   one-hour read URL. The phone never holds a key that reaches the bucket. */
async function loadGaleri(custId) {
  S.gal = S.gal || {};
  if (S.gal[custId]) return;
  try {
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch(`${SB_URL}/functions/v1/reseller-upload`, {
      method: "POST",
      headers: { "content-type": "application/json",
                 authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ action: "list", customer_id: custId }),
    });
    const j = await r.json();
    S.gal[custId] = (j && j.files) || [];
  } catch (_) { S.gal[custId] = []; }
  draw();
}

async function boot() {
  if (!sb) { S.err = "Tidak dapat menghubungi pelayan."; S.ready = true; return draw(); }
  const { data } = await sb.auth.getSession().catch(() => ({ data: {} }));
  if (data && data.session) {
    try { await loadMe({ session: data.session }); }
    catch (e) { S.err = authMsg(e.message || String(e)); }
  }
  S.ready = true;
  draw();
  if (S.me) { await loadAll(); draw(); }
  sb.auth.onAuthStateChange(evt => { if (evt === "SIGNED_OUT") { S.me = null; S.loaded = false; draw(); } });
}

if ("serviceWorker" in navigator)
  addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));

draw();
boot();
</script>
