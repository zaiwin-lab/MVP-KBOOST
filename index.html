<meta charset="utf-8">
<title>Winning Salesman</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Field-sales control room demo for KOBIS Berhad — plan the day, visit the outlet, take the order, collect payment, watch the ranking move.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
/* ============================================================
   Winning Salesman — KOBIS Berhad field-sales demo
   Bright, professional light surface. Committed single theme:
   every colour painted explicitly so the page stays bright on
   any host background.
   ============================================================ */
:root{
  --page:#F1F5FA; --s1:#FFFFFF; --s2:#F7FAFD; --s3:#EDF2F8; --s4:#E1E9F2;
  --rail:#FFFFFF;
  --text:#121A2B; --muted:#5A6880; --dim:#8B98AE;
  --line:#E4EBF3; --line-2:#CFD9E6;

  --jade:#0D9B7C; --jade-lo:#E1F5F0; --jade-hi:#0A7A61;
  --peri:#4B5DD8; --peri-lo:#ECEEFD;
  --gold:#B27812; --gold-lo:#FBF2DE;
  --coral:#CE4033; --coral-lo:#FDEBE9;

  --paper:#FDFBF6; --paper-2:#F2EEE4; --paper-ink:#1E1A14; --paper-dim:#6E6559;

  --ui:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --dp:"Familjen Grotesk","Manrope",-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --r-s:8px; --r:12px; --r-l:16px; --r-pill:100px;
  --pad:22px; --gap:16px;
  --sh:0 1px 2px rgba(18,26,43,.05), 0 6px 20px rgba(18,26,43,.06);
  --sh-lift:0 2px 4px rgba(18,26,43,.06), 0 14px 34px rgba(18,26,43,.10);
  --rail-w:228px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--page); color:var(--text);
  font-family:var(--ui); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overflow-x:hidden; position:relative; min-height:100vh;
}
/* Ambient tone washes — soft colour in the corners so the page reads
   considered rather than flat white. */
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(900px 520px at 8% -8%,  rgba(13,155,124,.10), transparent 62%),
    radial-gradient(760px 460px at 96% 2%,  rgba(75,93,216,.09),  transparent 60%),
    radial-gradient(820px 500px at 50% 108%,rgba(178,120,18,.07), transparent 62%),
    var(--page);
}
h1,h2,h3,h4{font-family:var(--dp);font-weight:600;line-height:1.15;text-wrap:balance;letter-spacing:-.015em;color:var(--text)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* ---------- shell ---------- */
#app{min-height:100vh}
.topbar{
  position:sticky;top:0;z-index:60;height:58px;
  display:flex;align-items:center;gap:14px;padding:0 20px;
  background:rgba(255,255,255,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--dp);font-weight:700;letter-spacing:-.02em;font-size:15px}
.brand .mk{width:23px;height:23px;border-radius:7px;background:linear-gradient(140deg,#14B891,#0A7A61);display:grid;place-items:center;flex:none;box-shadow:0 2px 6px rgba(13,155,124,.35)}
.brand small{display:block;font-family:var(--ui);font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);line-height:1}
.live{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--jade)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--jade);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(13,155,124,.45)}70%{box-shadow:0 0 0 9px rgba(13,155,124,0)}100%{box-shadow:0 0 0 0 rgba(13,155,124,0)}}
.spacer{flex:1}

/* client-company switcher */
.co{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--s2);border:1px solid var(--line-2);border-radius:var(--r-pill)}
.co .cod{width:8px;height:8px;border-radius:2px;background:linear-gradient(140deg,#14B891,#4B5DD8);flex:none}
.co select{background:none;border:none;font-size:12.5px;font-weight:700;cursor:pointer;max-width:210px}

.toggle{display:flex;background:var(--s3);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px;gap:2px}
.toggle button{padding:6px 15px;border-radius:var(--r-pill);font-size:12.5px;font-weight:700;color:var(--muted);transition:.18s}
.toggle button[aria-pressed="true"]{background:var(--jade);color:#fff;box-shadow:0 2px 6px rgba(13,155,124,.32)}
.toggle button:hover:not([aria-pressed="true"]){color:var(--text)}

.who{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;background:var(--s2);border:1px solid var(--line-2);border-radius:var(--r-pill)}
.who select{background:none;border:none;font-size:12.5px;font-weight:700;cursor:pointer}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;flex:none;font-family:var(--ui)}

.layout{display:flex;min-height:calc(100vh - 58px)}
.rail{width:var(--rail-w);flex:none;border-right:1px solid var(--line);background:var(--rail);padding:18px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:58px;height:calc(100vh - 58px)}
.rail .lbl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:800;padding:12px 10px 6px}
.rail a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-s);color:var(--muted);font-weight:600;font-size:13.5px;transition:.15s}
.rail a:hover{background:var(--s3);color:var(--text)}
.rail a.on{background:var(--jade-lo);color:var(--jade-hi)}
.rail .foot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--line);font-size:11px;color:var(--dim);line-height:1.6}

.main{flex:1;min-width:0;padding:26px 28px 60px;max-width:1440px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-size:27px}
.head p{color:var(--muted);font-size:13.5px;margin-top:5px}

/* ---------- primitives ---------- */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh)}
.card .ch{display:flex;align-items:center;gap:10px;padding:15px var(--pad);border-bottom:1px solid var(--line)}
.card .ch h3{font-size:14.5px}
.card .cb{padding:var(--pad)}
.grid{display:grid;gap:var(--gap)}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.split{grid-template-columns:1.35fr 1fr;align-items:start}
@media(max-width:1080px){.split{grid-template-columns:1fr}}

.kpi{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-l);padding:17px 18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:800}
.kpi .v{font-family:var(--dp);font-size:29px;font-weight:700;margin-top:9px;letter-spacing:-.025em}
.kpi .s{font-size:12px;color:var(--muted);margin-top:5px;display:flex;align-items:center;gap:6px}
.kpi .bar{height:4px;background:var(--s3);border-radius:3px;margin-top:12px;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:3px;background:var(--jade);transition:width .9s cubic-bezier(.2,.8,.2,1)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-pill);font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;transition:.25s}
.c-ok{background:var(--jade-lo);color:var(--jade-hi)}
.c-warn{background:var(--gold-lo);color:var(--gold)}
.c-bad{background:var(--coral-lo);color:var(--coral)}
.c-mut{background:var(--s3);color:var(--muted)}
.c-ai{background:var(--peri-lo);color:var(--peri)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 17px;border-radius:var(--r-s);font-weight:700;font-size:13.5px;background:var(--s1);color:var(--text);border:1px solid var(--line-2);box-shadow:0 1px 2px rgba(18,26,43,.05);transition:.16s}
.btn:hover{background:var(--s2);border-color:var(--dim)}
.btn-p{background:var(--jade);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(13,155,124,.3)}
.btn-p:hover{background:var(--jade-hi);border-color:transparent}
.btn-g{background:transparent;border-color:var(--line-2);color:var(--muted);box-shadow:none}
.btn-g:hover{color:var(--text);border-color:var(--dim)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-lg{width:100%;padding:15px;font-size:15px;border-radius:var(--r)}

table{width:100%;border-collapse:collapse;font-size:13px}
.tw{overflow-x:auto}
th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:800;padding:0 12px 9px;white-space:nowrap}
td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--s2)}
.r{text-align:right}

/* ---------- AI layer: periwinkle voice ---------- */
.ai{background:linear-gradient(150deg,#F3F5FE 0%,#FBFCFF 60%);border:1px solid #D6DBFA;border-radius:var(--r-l);padding:19px 21px;box-shadow:var(--sh)}
.ai .hd{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.ai .hd b{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--peri);font-weight:800}
.ai .hd .ts{margin-left:auto;font-size:11px;color:var(--dim);font-family:var(--mono)}
.ai p{font-size:14.5px;line-height:1.68;color:#26304D}
.ai p b{color:#0F1730;font-weight:800}
.ai .why{margin-top:13px;padding-top:12px;border-top:1px solid #DFE3FB;display:flex;flex-wrap:wrap;gap:7px}
.spark{width:15px;height:15px;flex:none}

.nudge{background:var(--peri-lo);border:1px solid #D6DBFA;border-radius:var(--r);padding:13px 15px;display:flex;gap:11px;align-items:flex-start}
.nudge .tx{font-size:13.5px;line-height:1.55;color:#26304D}
.flag{background:var(--gold-lo);border:1px solid #EFD9A6;border-radius:var(--r);padding:13px 15px;display:flex;gap:11px;align-items:flex-start}
.flag .tx{font-size:13px;line-height:1.55;color:#5C3F07}

/* ---------- ranking ---------- */
.rank{display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:13px;padding:11px 13px;background:var(--s2);border:1px solid var(--line);border-radius:var(--r);will-change:transform}
.row.me{border-color:var(--jade);background:var(--jade-lo)}
.pos{width:25px;height:25px;border-radius:var(--r-s);background:var(--s4);color:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;font-variant-numeric:tabular-nums}
.row:nth-child(1) .pos{background:linear-gradient(140deg,#E8B33F,#C08A16);color:#fff}
.row:nth-child(2) .pos{background:linear-gradient(140deg,#B9C4D4,#8E9BAF);color:#fff}
.row:nth-child(3) .pos{background:linear-gradient(140deg,#C4885A,#9A6437);color:#fff}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:11.5px;color:var(--muted)}
.row .vl{text-align:right;flex:none}
.row .vl b{display:block;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.row .vl span{font-size:11px;color:var(--dim)}
.tgt{height:8px;background:var(--s3);border-radius:4px;overflow:hidden;display:flex}
.tgt i{display:block;height:100%;transition:width 1s cubic-bezier(.2,.8,.2,1)}

/* ---------- roadmap ---------- */
.road{background:linear-gradient(150deg,#FFFFFF,#F4F8FC);border:1px dashed var(--line-2);border-radius:var(--r-l);padding:19px 21px}
.road h3{font-size:14px;margin-bottom:4px}
.road p{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.road .items{display:flex;flex-wrap:wrap;gap:8px}
.road .it{padding:7px 13px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-pill);font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px}
.road .it::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--line-2)}

/* ---------- phone ---------- */
.stage{display:flex;justify-content:center;padding:30px 20px 70px;gap:34px;align-items:flex-start}
.phone{width:392px;flex:none;background:#FFFFFF;border:1px solid var(--line-2);border-radius:36px;padding:11px;box-shadow:0 30px 70px rgba(18,26,43,.16),0 4px 12px rgba(18,26,43,.06);position:sticky;top:84px}
.screen{background:var(--page);border-radius:27px;overflow:hidden;height:748px;display:flex;flex-direction:column;position:relative;border:1px solid var(--line)}
.notch{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:10.5px;color:var(--dim);font-family:var(--mono);flex:none}
.sv{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 16px;scrollbar-width:thin}
.sv::-webkit-scrollbar{width:4px}
.sv::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:2px}
.tabs{flex:none;display:flex;border-top:1px solid var(--line);background:var(--s1);padding:7px 6px 9px}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px;border-radius:var(--r-s);font-size:10.5px;font-weight:700;color:var(--dim)}
.tabs a.on{color:var(--jade)}
.side{width:320px;flex:none;position:sticky;top:84px}
@media(max-width:900px){.stage{padding:0;display:block}.phone{width:100%;border:none;border-radius:0;padding:0;position:static;box-shadow:none}.screen{border-radius:0;border:none;height:auto;min-height:calc(100vh - 58px)}.notch{display:none}.stage .side{display:none}.tabs{position:sticky;bottom:0}}

.sh{padding:14px 2px 12px}
.sh h2{font-size:21px}
.sh p{font-size:12.5px;color:var(--muted);margin-top:3px}
.stop{display:flex;gap:11px;align-items:center;padding:13px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;width:100%;text-align:left;box-shadow:var(--sh);transition:.16s}
.stop:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:var(--sh-lift)}
.stop.done{opacity:.62;box-shadow:none}
.stop .sq{width:30px;height:30px;border-radius:9px;background:var(--s3);color:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;font-variant-numeric:tabular-nums}
.stop.done .sq{background:var(--jade-lo);color:var(--jade)}
.stop .in{flex:1;min-width:0}
.stop .in b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .in span{font-size:11.5px;color:var(--muted)}

.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:800;margin-bottom:6px}
.fld input,.fld select{width:100%;padding:12px 13px;background:var(--s1);border:1px solid var(--line-2);border-radius:var(--r-s);font-size:14px;font-weight:600;transition:.15s}
.fld input:focus,.fld select:focus{border-color:var(--jade);outline:none;box-shadow:0 0 0 3px var(--jade-lo)}
.fld input.bad{border-color:var(--gold)}

.line{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.line .pn{flex:1;min-width:0}
.line .pn b{display:block;font-size:13px;font-weight:700}
.line .pn span{font-size:11px;color:var(--dim);font-family:var(--mono)}
.step{display:flex;align-items:center;gap:2px;background:var(--s1);border:1px solid var(--line-2);border-radius:var(--r-s);flex:none}
.step button{width:29px;height:29px;display:grid;place-items:center;font-size:16px;font-weight:700;color:var(--muted)}
.step button:hover{color:var(--jade)}
.step .q{width:28px;text-align:center;font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}

.tot{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-top:2px solid var(--line-2);margin-top:6px}
.tot b{font-family:var(--dp);font-size:25px;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- paper documents ---------- */
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-2);border-radius:var(--r);padding:24px 22px;font-family:var(--mono);font-size:12px;line-height:1.65;box-shadow:0 12px 34px rgba(18,26,43,.12)}
.paper .ph{text-align:center;padding-bottom:14px;border-bottom:1.5px solid var(--paper-ink)}
.paper .ph b{font-family:var(--dp);font-size:17px;letter-spacing:-.01em;display:block}
.paper .ph span{font-size:10.5px;color:var(--paper-dim);letter-spacing:.05em}
.paper .rw{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.paper .rw span{color:var(--paper-dim)}
.paper .sec{padding:12px 0;border-bottom:1px dashed rgba(30,26,20,.24)}
.paper .gt{display:flex;justify-content:space-between;padding:12px 0 0;font-size:15px;font-weight:700;border-top:1.5px solid var(--paper-ink);margin-top:10px}
.paper .stamp{margin-top:16px;text-align:center;font-size:11px;letter-spacing:.16em;font-weight:700;padding:9px;border:2px solid var(--jade);color:var(--jade-hi);border-radius:6px;transform:rotate(-1.2deg)}
.paper .ft{text-align:center;font-size:10px;color:var(--paper-dim);margin-top:14px;line-height:1.6}

/* ---------- misc ---------- */
.mask{position:fixed;inset:0;background:rgba(18,26,43,.42);backdrop-filter:blur(5px);z-index:100;display:grid;place-items:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-l);padding:24px;max-width:400px;width:100%;box-shadow:0 30px 80px rgba(18,26,43,.28);animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(14px) scale(.98);opacity:0}}
.wa{background:#ECE5DD;border-radius:var(--r);padding:15px;border:1px solid #DED5CB}
.bub{background:#D9FDD3;border-radius:9px 9px 2px 9px;padding:10px 12px;font-size:13px;line-height:1.55;margin-left:auto;max-width:88%;color:#111B21;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.bub .lk{color:#027EB5;word-break:break-all;font-size:12px;display:block;margin-top:6px}
.bub .tm{font-size:10px;color:rgba(17,27,33,.5);text-align:right;margin-top:4px}

.tick{display:flex;flex-direction:column;gap:9px;max-height:262px;overflow-y:auto}
.tk{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.tk:last-child{border:none}
.tk .td{width:6px;height:6px;border-radius:50%;margin-top:6px;flex:none}
.tk .tt{flex:1;color:var(--muted);line-height:1.5}
.tk .tt b{color:var(--text);font-weight:700}
.tk time{font-size:10.5px;color:var(--dim);font-family:var(--mono);flex:none}

.note{background:var(--s2);border-left:3px solid var(--jade);border-radius:0 var(--r-s) var(--r-s) 0;padding:12px 14px;font-size:12.5px;color:var(--muted);line-height:1.6}
.empty{text-align:center;padding:38px 20px;color:var(--dim)}
.empty b{display:block;font-family:var(--dp);font-size:15px;color:var(--muted);margin-bottom:5px}
.hist{display:flex;flex-direction:column;gap:0}
.hv{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.hv .hd2{width:74px;flex:none;color:var(--dim);font-family:var(--mono);font-size:11px}
.banner{border-radius:var(--r);padding:15px 17px;display:flex;gap:12px;align-items:center;font-size:13.5px;line-height:1.55}
.b-ok{background:var(--jade-lo);border:1px solid #A9E3D4;color:#0A5F4C}
.b-warn{background:var(--coral-lo);border:1px solid #F3C0BA;color:#8C2A20}
.mg{margin-top:var(--gap)}
.stk{display:flex;flex-direction:column;gap:var(--gap)}

.ic{width:17px;height:17px;flex:none}
.rail a .ic{opacity:.85}

/* ---- one build engine, run once per tenant ---- */
function buildTenant(cfg){
  const W = {
    company:{id:cfg.id,name:cfg.name,trade:cfg.trade,reg:cfg.reg,monthTarget:cfg.target,word:cfg.word},
    word:cfg.word, products:[], salesmen:[], outlets:[], orders:[], invoices:[], payments:[], visits:[],
    seq:{order:0,invoice:0}, feed:[], resigned:null, baseAssign:{}, baseVisit:{}
  };
  const cid=cfg.id;

  W.products = cfg.products.map(([name,sku,price],i)=>
    ({id:cid+"p"+(i+1),companyId:cid,name,sku,price,floor:Math.round(price*0.82)}));

  W.salesmen = cfg.salesmen.map(([name,zone],i)=>
    ({id:cid+"s"+(i+1),companyId:cid,name,zone,color:PAL[i%PAL.length],active:true,joined:dAgo(between(220,900))}));

  const zoneOwner={};
  W.salesmen.forEach(s=>zoneOwner[s.zone]=s.id);
  W.zoneOwner=zoneOwner;

  W.outlets = cfg.outlets.map(([name,area,zone,tier,owner],i)=>({
    id:cid+"o"+(i+1), companyId:cid, name, area, zone, tier, owner,
    phone:"01"+between(1,9)+"-"+between(200,999)+" "+between(1000,9999),
    creditTerm:cfg.terms[tier], since:dAgo(between(400,1400)),
    salesmanId: zoneOwner[zone] || W.salesmen[0].id
  }));
  W.outlets.forEach(o=>W.baseAssign[o.id]=o.salesmanId);

  const inv=(n)=>"INV-2026-"+String(n).padStart(4,"0");
  const ord=(n)=>"ORD-"+String(n).padStart(4,"0");

  // ---- 90 days of trading history ----
  W.outlets.forEach(o=>{
    const n = o.tier==="A"?between(11,15):o.tier==="B"?between(6,10):between(3,5);
    const gap = Math.floor(90/n);
    for(let k=0;k<n;k++){
      const days = 90 - k*gap - between(0,3);
      if(days<1) continue;
      const date=dAgo(days), lineN=o.tier==="A"?between(3,5):between(2,3);
      const used=new Set(), lines=[];
      for(let j=0;j<lineN;j++){
        const p=pick(W.products); if(used.has(p.id)) continue; used.add(p.id);
        const [lo,hi]=cfg.qty[o.tier];
        const disc = R()<0.28 ? (1-(between(3,9)/100)) : 1;
        lines.push({productId:p.id,qty:between(lo,hi),unitPrice:Math.round(p.price*disc*100)/100});
      }
      if(!lines.length) continue;
      const total=lines.reduce((s,l)=>s+l.qty*l.unitPrice,0);
      const oid=ord(++W.seq.order);
      W.orders.push({id:oid,companyId:cid,outletId:o.id,salesmanId:o.salesmanId,date,lines,total,status:"invoiced"});
      const iid=inv(++W.seq.invoice), due=new Date(date.getTime()+o.creditTerm*DAY);
      const rec={id:iid,companyId:cid,orderId:oid,outletId:o.id,salesmanId:o.salesmanId,issued:date,due,total,paid:0,status:"open"};
      W.invoices.push(rec);
      const settled = days>o.creditTerm+8 ? R()<0.9 : R()<0.42;
      if(settled){
        rec.paid=total; rec.status="paid";
        W.payments.push({id:"PAY-"+String(W.payments.length+1).padStart(4,"0"),companyId:cid,invoiceId:iid,outletId:o.id,
          date:new Date(date.getTime()+between(1,Math.max(1,o.creditTerm))*DAY),amount:total,method:pick(["Cash","Bank Transfer","Cheque"])});
      } else if(R()<0.3){
        const part=Math.round(total*(between(30,60)/100));
        rec.paid=part; rec.status="partial";
        W.payments.push({id:"PAY-"+String(W.payments.length+1).padStart(4,"0"),companyId:cid,invoiceId:iid,outletId:o.id,
          date:new Date(date.getTime()+between(2,Math.max(2,o.creditTerm))*DAY),amount:part,method:pick(["Cash","Bank Transfer"])});
      }
    }
  });

  // ---- today's beat plan ----
  W.salesmen.forEach((s,si)=>{
    const mine=W.outlets.filter(o=>o.salesmanId===s.id);
    const plan=mine.slice(0,Math.min(mine.length,between(4,6)));
    const doneCount = si===0 ? Math.min(2,plan.length) : between(1,Math.max(1,plan.length-1));
    plan.forEach((o,i)=>{
      const visited=i<doneCount;
      W.visits.push({id:"V-"+s.id+"-"+o.id,companyId:cid,salesmanId:s.id,outletId:o.id,date:TODAY,
        status:visited?"visited":"planned",
        checkInAt:visited?new Date(TODAY.getTime()+(9+i)*36e5+between(0,55)*6e4):null,
        geo:visited?{lat:(3.05+R()*0.22).toFixed(5),lng:(101.58+R()*0.28).toFixed(5)}:null});
    });
  });
  W.visits.forEach(v=>W.baseVisit[v.id]=v.salesmanId);

  // ---- today's sales, so no dashboard is ever empty at pitch time ----
  W.salesmen.forEach(s=>{
    W.visits.filter(v=>v.salesmanId===s.id&&v.status==="visited").forEach(v=>{
      const o=W.outlets.find(x=>x.id===v.outletId); if(!o) return;
      const used=new Set(), lines=[];
      for(let j=0;j<between(2,4);j++){
        const p=pick(W.products); if(used.has(p.id)) continue; used.add(p.id);
        const [lo,hi]=cfg.qty[o.tier];
        lines.push({productId:p.id,qty:between(lo,hi),unitPrice:p.price});
      }
      if(!lines.length) return;
      const total=lines.reduce((a,l)=>a+l.qty*l.unitPrice,0);
      const oid=ord(++W.seq.order);
      W.orders.push({id:oid,companyId:cid,outletId:o.id,salesmanId:s.id,date:v.checkInAt||TODAY,lines,total,status:"invoiced"});
      const iid=inv(++W.seq.invoice);
      const rec={id:iid,companyId:cid,orderId:oid,outletId:o.id,salesmanId:s.id,issued:TODAY,
        due:new Date(TODAY.getTime()+o.creditTerm*DAY),total,paid:0,status:"open"};
      W.invoices.push(rec);
      if(R()<0.55){ rec.paid=total; rec.status="paid";
        W.payments.push({id:"PAY-"+String(W.payments.length+1).padStart(4,"0"),companyId:cid,invoiceId:iid,
          outletId:o.id,date:TODAY,amount:total,method:pick(["Cash","Bank Transfer"])}); }
    });
  });

  // ---- live activity feed ----
  const ev=[];
  W.visits.filter(v=>v.status==="visited").slice(0,7).forEach(v=>{
    const s=W.salesmen.find(x=>x.id===v.salesmanId), o=W.outlets.find(x=>x.id===v.outletId);
    ev.push({t:v.checkInAt,c:HUE.jade,h:`<b>${esc(firstName(s.name))}</b> checked in at <b>${esc(o.name)}</b>`});
  });
  W.payments.filter(p=>p.date.toDateString()===TODAY.toDateString()).slice(0,5).forEach(p=>{
    const o=W.outlets.find(x=>x.id===p.outletId);
    ev.push({t:new Date(TODAY.getTime()+between(9,16)*36e5),c:HUE.peri,
      h:`Payment <b>${"RM "+Math.round(p.amount).toLocaleString("en-MY")}</b> collected from <b>${esc(o.name)}</b>`});
  });
  W.feed = ev.sort((a,b)=>b.t-a.t);
  return W;
}

/* Active-tenant state. DB is a live view of whichever company is
   selected, so every selector and view below stays tenant-agnostic
   and no query can reach across companies. */

function byId(arr,id){return arr.find(x=>x.id===id)}


/* ===========================================================
   3. DERIVED SELECTORS
   =========================================================== */
const S = {
  outlet:id=>byId(DB.outlets,id), sm:id=>byId(DB.salesmen,id), prod:id=>byId(DB.products,id),
  isToday:d=>d && new Date(d).toDateString()===TODAY.toDateString(),
  ordersToday:()=>DB.orders.filter(o=>S.isToday(o.date)),
  salesToday:sid=>S.ordersToday().filter(o=>!sid||o.salesmanId===sid).reduce((a,o)=>a+o.total,0),
  collectedToday:()=>DB.payments.filter(p=>S.isToday(p.date)).reduce((a,p)=>a+p.amount,0),
  invoicedToday:()=>DB.invoices.filter(i=>S.isToday(i.issued)).reduce((a,i)=>a+i.total,0),
  visits:sid=>DB.visits.filter(v=>!sid||v.salesmanId===sid),
  outstanding:oid=>DB.invoices.filter(i=>(!oid||i.outletId===oid)&&i.status!=="paid").reduce((a,i)=>a+(i.total-i.paid),0),
  overdue:oid=>DB.invoices.filter(i=>(!oid||i.outletId===oid)&&i.status!=="paid"&&i.due<TODAY).reduce((a,i)=>a+(i.total-i.paid),0),
  outletOrders:oid=>DB.orders.filter(o=>o.outletId===oid).sort((a,b)=>b.date-a.date),
  lastVisit:oid=>{const os=S.outletOrders(oid); return os.length?os[0].date:null},
  avgOrder:oid=>{const os=S.outletOrders(oid); return os.length? os.reduce((a,o)=>a+o.total,0)/os.length : 0},
  mtdSales:()=>DB.orders.filter(o=>o.date.getMonth()===TODAY.getMonth()&&o.date.getFullYear()===TODAY.getFullYear()).reduce((a,o)=>a+o.total,0),
  // 90-day average unit price actually paid at this outlet, for the anomaly check
  avgUnitPrice:(oid,pid)=>{
    let q=0,v=0;
    S.outletOrders(oid).forEach(o=>o.lines.forEach(l=>{ if(l.productId===pid){q+=l.qty;v+=l.qty*l.unitPrice} }));
    return q? v/q : null;
  },
  daysSinceProduct:(oid,pid)=>{
    const os=S.outletOrders(oid);
    for(const o of os){ if(o.lines.some(l=>l.productId===pid)) return daysBetween(o.date,TODAY); }
    return null;
  },
  // One definition of "behind plan", shared by the table and the AI briefing so
  // the two can never contradict each other on screen.
  expectedPace:()=>Math.min(1,(11-8)/9),           // 11:00 through an 08:00-17:00 day
  pace:s=>{
    const r = s.planned ? s.visits/s.planned : 0, e = S.expectedPace();
    if(r >= e)        return {k:"c-ok",  t:"On track",   behind:false};
    if(r >= e*0.72)   return {k:"c-warn",t:"Mid-plan",   behind:false};
    return                   {k:"c-bad", t:"Behind plan",behind:true};
  },
  ranking:()=>DB.salesmen.filter(s=>s.active).map(s=>{
      const v=S.visits(s.id);
      return {...s, sales:S.salesToday(s.id), visits:v.filter(x=>x.status==="visited").length, planned:v.length,
              collected:DB.payments.filter(p=>S.isToday(p.date)&&DB.invoices.some(i=>i.id===p.invoiceId&&i.salesmanId===s.id)).reduce((a,p)=>a+p.amount,0)};
    }).sort((a,b)=>b.sales-a.sales)
};

/* ===========================================================
   4. AI LAYER — rule-based but genuinely data-driven.
      Every number below is computed from DB, never hardcoded.
   =========================================================== */
const AI = {
  /* Smart Jadual Harian: score each stop, expose the rationale */
  routeScore(outletId){
    const o=S.outlet(outletId);
    const overdue=S.overdue(outletId);
    const last=S.lastVisit(outletId);
    const since=last?daysBetween(last,TODAY):120;
    const avg=S.avgOrder(outletId);
    const tierW={A:14,B:8,C:4}[o.tier];
    const score = (overdue/1000)*3.2 + (avg/1000)*2.1 + (since/7)*1.6 + tierW;
    const why=[];
    if(overdue>0) why.push({t:`Overdue ${RM(overdue)}`,k:"bad"});
    if(since>=21) why.push({t:`${since} days since last order`,k:"warn"});
    else if(since<=6) why.push({t:`Visited ${since}d ago`,k:"mut"});
    if(avg>=2500) why.push({t:`High value · avg ${RM(avg)}`,k:"ok"});
    if(o.tier==="A") why.push({t:"Tier A outlet",k:"ok"});
    if(!why.length) why.push({t:"Routine coverage",k:"mut"});
    return {score,why,overdue,since,avg};
  },
  orderedPlan(salesmanId){
    return S.visits(salesmanId).map(v=>({v,...AI.routeScore(v.outletId)}))
      .sort((a,b)=>{
        if(a.v.status!==b.v.status) return a.v.status==="visited"?1:-1; // done sink to bottom
        return b.score-a.score;
      });
  },

  /* Manager morning briefing — one paragraph, all live numbers */
  briefing(){
    const rank=S.ranking();
    const behind=rank.filter(s=>S.pace(s).behind);
    const atRisk=S.overdue();
    const mtd=S.mtdSales(), tgt=DB.company.monthTarget;
    const pct=Math.round(mtd/tgt*100);
    const top=rank[0];
    const totV=rank.reduce((a,s)=>a+s.visits,0), totP=rank.reduce((a,s)=>a+s.planned,0);
    const collect=S.invoicedToday()>0?Math.round(S.collectedToday()/S.invoicedToday()*100):0;

    let p=`Team is <b>${totV} of ${totP} ${DB.word.p.toLowerCase()}</b> covered so far today, worth <b>${RM(S.salesToday())}</b> in orders. `;
    p += behind.length
      ? `<b>${behind.length} salesm${behind.length>1?"en are":"an is"} behind plan</b> — ${behind.map(s=>esc(firstName(s.name))+" ("+s.visits+"/"+s.planned+")").join(", ")}. `
      : `Everyone is tracking on or ahead of plan. `;
    p += `<b>${RM(atRisk)}</b> is sitting overdue across ${DB.invoices.filter(i=>i.status!=="paid"&&i.due<TODAY).length} invoices — that is the number to chase before month end. `;
    p += `Top mover is <b>${esc(top.name)}</b> at ${RM(top.sales)} from ${top.visits} visit${top.visits===1?"":"s"}. `;
    p += `Month to date <b>${RM(mtd)}</b>, ${pct}% of the ${RM(tgt)} target.`;
    return {html:p, chips:[
      {t:`Collection rate today ${collect}%`,k:collect>=60?"ok":"warn"},
      {t:`${behind.length} behind plan`,k:behind.length?"bad":"ok"},
      {t:`${RM(atRisk)} at risk`,k:atRisk>0?"warn":"ok"},
      {t:`${pct}% to target`,k:pct>=70?"ok":"warn"}
    ]};
  },

  /* Coaching nudge after an order is logged */
  coach(outletId, order){
    const o=S.outlet(outletId);
    const bought=new Set(order.lines.map(l=>l.productId));
    // product the outlet historically buys but did not order now, longest gap first
    let best=null;
    DB.products.forEach(p=>{
      if(bought.has(p.id)) return;
      const d=S.daysSinceProduct(outletId,p.id);
      if(d!==null && d>=30 && (!best||d>best.d)) best={p,d};
    });
    if(best) return `<b>${esc(o.name)}</b> has not ordered <b>${esc(best.p.name)}</b> in <b>${best.d} days</b> — they used to carry it. Mention it on the next visit, it is usually a ${RM(Math.round(best.p.price*8))} add-on.`;
    const avg=S.avgOrder(outletId);
    if(avg && order.total < avg*0.75)
      return `This order is <b>${Math.round((1-order.total/avg)*100)}% below</b> ${esc(o.name)}'s usual ${RM(avg)}. Worth asking what changed before you leave the shop.`;
    return `Solid order — <b>${Math.round(order.total/(avg||order.total)*100)}%</b> of ${esc(o.name)}'s average. Confirm the next delivery date while you are still in the shop.`;
  },

  /* Price anomaly, checked before the order is confirmed */
  anomaly(outletId, lines){
    const flags=[];
    lines.forEach(l=>{
      if(!l.qty) return;
      const p=S.prod(l.productId);
      const hist=S.avgUnitPrice(outletId,l.productId);
      if(l.unitPrice < p.floor)
        flags.push(`<b>${esc(p.name)}</b> at ${RM2(l.unitPrice)} is below the ${RM2(p.floor)} floor price.`);
      else if(hist && l.unitPrice < hist*0.88)
        flags.push(`<b>${esc(p.name)}</b> at ${RM2(l.unitPrice)} is <b>${Math.round((1-l.unitPrice/hist)*100)}% below</b> this outlet's 90-day average of ${RM2(hist)}.`);
    });
    return flags;
  }
};

        <span class="num" style="width:82px;text-align:right;font-weight:800;font-size:13.5px">${RM2(l.qty*l.unitPrice)}</span>

function modal(html){ $("#modal").innerHTML = `<div class="mask" data-act="close-modal"><div class="sheet" data-stop>${html}</div></div>`; }
function closeModal(){ $("#modal").innerHTML=""; }

const ACTIONS = {
  role(el){ ST.role=el.dataset.v; go(ST.role==="manager"?"/manager/dashboard":"/salesman/jadual"); },
  "pick-sm"(el){ ST.salesmanId=el.value; go("/salesman/jadual"); },

  checkin(el){
    const v=DB.visits.find(x=>x.outletId===el.dataset.id&&x.salesmanId===ST.salesmanId);
    if(v){ v.status="visited"; v.checkInAt=new Date(TODAY.getTime()+11.4*36e5);
      v.geo={lat:(3.05+R()*0.22).toFixed(5),lng:(101.58+R()*0.28).toFixed(5)};
      pushFeed(`<b>${esc(firstName(S.sm(ST.salesmanId).name))}</b> checked in at <b>${esc(S.outlet(el.dataset.id).name)}</b>`);
    }
    render();
  },
  "new-order"(el){ ST.draft=null; go("/salesman/order/"+el.dataset.id); },
  qty(el){
    const l=ST.draft.lines.find(x=>x.productId===el.dataset.p);
    l.qty=Math.max(0,l.qty+Number(el.dataset.d)); render();
  },
  "confirm-order"(el){
    const id=el.dataset.id, o=S.outlet(id);
    const lines=ST.draft.lines.filter(l=>l.qty>0).map(l=>({...l}));
    const total=lines.reduce((a,l)=>a+l.qty*l.unitPrice,0);
    const oid="ORD-"+String(++DB.seq.order).padStart(4,"0");
    const ord={id:oid,outletId:id,salesmanId:ST.salesmanId,date:new Date(TODAY.getTime()+11.5*36e5),lines,total,status:"invoiced"};
    DB.orders.push(ord);
    const iid="INV-2026-"+String(++DB.seq.invoice).padStart(4,"0");
    DB.invoices.push({id:iid,orderId:oid,outletId:id,salesmanId:ST.salesmanId,issued:TODAY,
      due:new Date(TODAY.getTime()+o.creditTerm*DAY),total,paid:0,status:"open"});
    ST.lastOrder={orderId:oid,nudge:AI.coach(id,ord)};
    ST.draft=null;
    pushFeed(`<b>${esc(firstName(S.sm(ST.salesmanId).name))}</b> logged <b>${RM(total)}</b> at <b>${esc(o.name)}</b>`,HUE.gold);
    go("/salesman/invoice/"+iid);
  },
  price(el){
    const l=ST.draft.lines.find(x=>x.productId===el.dataset.p);
    const v=parseFloat(el.value);
    if(isNaN(v)||v<=0) return;              // mid-typing ("", "1.") — leave state alone
    l.unitPrice=v;
    const caret=el.selectionStart, raw=el.value;
    render();
    const f=$(`[data-act="price"][data-p="${el.dataset.p}"]`);
    if(f){ f.value=raw; f.focus(); try{ f.setSelectionRange(caret,caret); }catch(_){} }
  },
  "to-pay"(el){ go("/salesman/payment/"+el.dataset.id); },
  "confirm-pay"(el){
    const inv=byId(DB.invoices,el.dataset.id);
    const amt=Math.min(parseFloat($("#amt").value)||0, inv.total-inv.paid);
    if(amt<=0) return;
    inv.paid+=amt; inv.status = inv.paid>=inv.total-0.01 ? "paid" : "partial";
    const pid="PAY-"+String(DB.payments.length+1).padStart(4,"0");
    DB.payments.push({id:pid,invoiceId:inv.id,outletId:inv.outletId,date:TODAY,amount:amt,method:$("#mth").value});
    pushFeed(`Payment <b>${RM(amt)}</b> collected from <b>${esc(S.outlet(inv.outletId).name)}</b>`,HUE.peri);
    go("/salesman/receipt/"+pid);
  },
  wa(el){
    const pay=byId(DB.payments,el.dataset.id), o=S.outlet(pay.outletId);
    const link=`kobis.my/r/${pay.id.toLowerCase()}`;
    modal(`<h3 style="font-size:16px;margin-bottom:4px">Send digital receipt</h3>
      <p style="color:var(--muted);font-size:12.5px;margin-bottom:15px">To ${esc(o.owner)} · ${esc(o.phone)}</p>
      <div class="wa"><div class="bub">Terima kasih ${esc(firstName(o.owner))}! Payment of <b>${RM2(pay.amount)}</b> received for ${esc(o.name)}.
        <span class="lk">https://${link}</span><span class="tm">11:31 ✓✓</span></div></div>
      <div class="note" style="margin-top:14px">Simulated. In the full build this opens the WhatsApp Business API with the receipt link attached.</div>
      <button class="btn btn-p btn-lg" style="margin-top:15px" data-act="close-modal">Done</button>`);
  },
  "close-modal"(){ closeModal(); },

  resign(){
    const D=DB, victim=D.salesmen.find(s=>s.active), heir=D.salesmen.find(s=>s.active&&s.id!==victim.id);
    if(!victim||!heir) return;
    const orders=D.orders.filter(o=>o.salesmanId===victim.id).length;
    victim.active=false;
    D.outlets.forEach(o=>{ if(o.salesmanId===victim.id) o.salesmanId=heir.id; });
    D.visits.forEach(v=>{ if(v.salesmanId===victim.id) v.salesmanId=heir.id; });
    D.resigned={victim:victim.name,heir:heir.name,heirId:heir.id,orders,payments:D.payments.length};
    if(ST.salesmanId===victim.id) ST.salesmanId=heir.id;
    render();
  },
  restore(){
    const D=DB;
    D.salesmen.forEach(s=>s.active=true);
    D.outlets.forEach(o=>{ o.salesmanId=D.baseAssign[o.id]; });
    D.visits.forEach(v=>{ v.salesmanId=D.baseVisit[v.id]; });
    D.resigned=null; render();
  },
  "pick-co"(el){
    ST.companyId=el.value; ST.salesmanId=DB.salesmen[0].id; ST.draft=null; ST.lastOrder=null;
    go(ST.role==="manager"?"/manager/dashboard":"/salesman/jadual");
  }
};

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el) return;
  if(el.dataset.act==="close-modal" && e.target.closest("[data-stop]") && e.target.dataset.act!=="close-modal") return;
  if(el.tagName!=="SELECT" && el.tagName!=="INPUT"){ e.preventDefault(); ACTIONS[el.dataset.act]?.(el); }
});
document.addEventListener("change",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  if(el.tagName==="SELECT") ACTIONS[el.dataset.act]?.(el);
});
// Price edits update live as they are typed, so the AI flag appears while the
// salesman is still standing at the counter — not after the field loses focus.
document.addEventListener("input",e=>{
  const el=e.target.closest('[data-act="price"]');
  if(el) ACTIONS.price(el);
});

/* ===========================================================
   9. RENDER + MOTION
   =========================================================== */
function positions(){
  const m=new Map(); document.querySelectorAll("#rank .row").forEach(r=>m.set(r.dataset.id,r.getBoundingClientRect().top)); return m;
}
function flip(prev){
  if(REDUCED||!prev.size) return;
  document.querySelectorAll("#rank .row").forEach(r=>{
    const was=prev.get(r.dataset.id); if(was==null) return;
    const d=was-r.getBoundingClientRect().top;
    if(!d) return;
    r.animate([{transform:`translateY(${d}px)`},{transform:"translateY(0)"}],{duration:620,easing:"cubic-bezier(.2,.8,.2,1)"});
  });
}
function countUp(){
  document.querySelectorAll("[data-count]").forEach(el=>{
    const target=Number(el.dataset.count)||0, pre=el.dataset.pre||"", suf=el.dataset.suf||"";
    const fmt=n=>(pre==="RM "?RM(n):Math.round(n).toLocaleString("en-MY"))+suf;
    if(REDUCED){ el.textContent=fmt(target); return; }
    const t0=performance.now(), dur=900;
    (function step(t){
      const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      el.textContent=fmt(target*e);
      if(p<1) requestAnimationFrame(step);
    })(t0);
  });
  requestAnimationFrame(()=>document.querySelectorAll("[data-w]").forEach(i=>{ i.style.width=i.dataset.w; if(i.dataset.c) i.style.background=i.dataset.c; }));
}

function render(){
  const prev=positions();
  const p=route();
  let html;
  if(p[0]==="salesman"){
    ST.role="salesman";
    html = p[1]==="outlet" ? vOutlet(p[2])
         : p[1]==="order" ? vOrder(p[2])
         : p[1]==="invoice"? vInvoice(p[2])
         : p[1]==="payment"? vPay(p[2])
         : p[1]==="receipt"? vReceipt(p[2])
         : p[1]==="ranking"? vSRanking()
         : p[1]==="clients"? vSOutlets()
         : vJadual();
  } else {
    ST.role="manager";
    html = p[1]==="ranking" ? vRanking()
         : p[1]==="clients" ? vClients()
         : p[1]==="client"  ? vClient(p[2])
         : p[1]==="roadmap" ? vRoadmap()
         : vDashboard();
  }
  $("#app").innerHTML = topbar()+html;
  countUp(); flip(prev);
}
render();
</script>
